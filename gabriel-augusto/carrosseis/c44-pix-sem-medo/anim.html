<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 44 ANIMADO (1080x1350, cada slide é um vídeo) · "Como receber Pix sem o cliente ter medo" · estilo CINÉTICO, formato do ajuste de 14/11
     Título ensinando EM CIMA no gancho (gráfico menor embaixo); 4 DICAS úteis (chave Pix no CNPJ, mesmo nome em todo lugar, chave que nunca muda, conferir no app e não no print);
     ligação com o site (nome, CNPJ e formas de pagamento à vista) + final aprovado. Liga com o v44 (golpe do QR Code/Pix trocado na Black Friday). Dados de exemplo marcados EXEMPLO.
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c44-pix-sem-medo -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-weight: 600; src: url("../fontes/playfair-600.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-style: italic; font-weight: 600; src: url("../fontes/playfair-600-italic.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script src="../animado/mockups.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7;
const S = [], slide = (dur, trocas, render) => S.push({ dur, trocas, render });
const CARD = (x, y, w, h, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${K.vidro()}overflow:hidden;${extra}`;
// setinha do mouse; k = clique (0..1)
const cursor = (x, y, k = 0) => `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="40" height="56"><g transform="scale(${1 - .15 * Math.sin(clamp(k) * Math.PI)})">
  <path d="M0 0 L0 44 L11 34 L19 52 L28 48 L20 30 L35 30 Z" fill="#fff" stroke="#0B0B0D" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const onda = (x, y, k, cor = '#fff') => k > 0 && k < 1 ? `<div class="abs" style="left:${x - 60 * k}px;top:${y - 60 * k}px;width:${120 * k}px;height:${120 * k}px;border-radius:50%;border:4px solid ${cor};opacity:${1 - k}"></div>` : '';
const FEITO = (t) => K.kick(t, .1, 'NO SEU SITE', 655);

const TAG = (x = 36, y = 28) => `<div class="abs" style="right:${x}px;top:${y}px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>`;
const ROT = txt => `<div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">${txt}</div>`;

const VIVA = () => K.verm ? '#fff' : '#FF2E43';

// ---------- celular com a tela do WhatsApp Business (tema escuro) ----------
const ZB = '#0B141A', ZH = '#1F2C34', ZT = '#E9EDEF', ZS = '#8696A0', ZG = '#00A884';
const FONE = (t, inner) => { const inn = ease(t / .6);
  return `<div class="abs" style="left:110px;top:112px;width:344px;height:600px;border-radius:52px;background:#0B0B0D;padding:12px;box-shadow:0 0 0 3px rgba(255,255,255,.25), 0 50px 100px -30px rgba(0,0,0,.9);opacity:${inn};transform:translateY(${(1 - inn) * 40}px) rotate(-2deg)">
    <div style="width:320px;height:576px;border-radius:42px;overflow:hidden;position:relative;background:${ZB};font-family:IT,sans-serif;color:${ZT}">${inner}</div>
    <div style="position:absolute;left:50%;top:22px;width:90px;height:24px;margin-left:-45px;border-radius:12px;background:#0B0B0D"></div></div>`; };
const TOPO = (tit, sub = '') => `<div style="height:104px;padding:50px 20px 0;background:${ZH};display:flex;align-items:center;gap:14px"><span style="font-size:26px;color:${ZS}">←</span><div><b style="font-size:23px">${tit}</b>${sub ? `<div style="font-size:15px;color:${ZS}">${sub}</div>` : ''}</div></div>`;
// lista de opções; sel = índice tocado, k = progresso do toque
const LISTA = (itens, sel = -1, k = 0) => itens.map(([ic, tx, sub], j) => `<div style="display:flex;align-items:center;gap:14px;padding:15px 20px;position:relative;background:${j === sel && k > 0 ? `rgba(0,168,132,${.28 * Math.sin(clamp(k) * Math.PI) + (k >= 1 ? .14 : 0)})` : 'transparent'}">
    <span style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:21px">${ic}</span><div><div style="font-size:19px;font-weight:600">${tx}</div>${sub ? `<div style="font-size:14px;color:${ZS}">${sub}</div>` : ''}</div></div>`).join('');
const CHAVE = (on) => `<span style="flex-shrink:0;width:52px;height:30px;border-radius:15px;background:${on > .5 ? ZG : '#3B4A54'};position:relative"><span style="position:absolute;top:4px;left:${4 + 22 * clamp(on)}px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span>`;
// passos do lado direito (o caminho dentro do app), cada um entra com ✓
const PASSOS = (t, L, t0 = .5, dt = .55) => L.map((tx, j) => { const k = back((t - t0 - j * dt) / .4), ok = back((t - t0 - j * dt - .3) / .3);
  return k <= 0 ? '' : `<div class="abs" style="left:500px;width:480px;top:${150 + j * 112}px;padding:18px 22px;${K.vidro()}border-radius:24px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:25px;line-height:1.2;opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 70}px)">
    <span style="flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-family:Anton;font-size:22px;transform:scale(${clamp(ok, 0, 1.15)})">${j + 1}</span>${tx}</div>`; }).join('');
const FERR = [['🏪', 'Perfil comercial'], ['🛍️', 'Catálogo'], ['💤', 'Mensagem de ausência'], ['👋', 'Mensagem de saudação'], ['⚡', 'Respostas rápidas']];
const DICA = (t, n, tit, txt, ini) => `${K.kick(t, .1, 'DICA ' + n, 736)}${K.kin(t, .3, tit, { y: 978, max: 148, ini })}${K.corpo(t, 3.0, txt, 1150, { fs: 31 })}${K.rodape(t, 3.6)}`;

// tela de app de banco genérico (sem marca)
const BB = '#111316', BH = '#1B1F24', BA = '#21C38B', BT = '#F2F4F5', BS = '#8B95A1';
const BTOPO = (tit) => `<div style="height:100px;padding:48px 20px 0;background:${BH};display:flex;align-items:center;gap:14px"><span style="font-size:24px;color:${BS}">←</span><b style="font-size:22px;color:${BT}">${tit}</b></div>`;
const BANCO = (inner) => `<div style="position:absolute;inset:0;background:${BB};color:${BT}">${inner}</div>`;
const EXE = `<div style="position:absolute;right:16px;bottom:12px;font-size:12px;color:${BS};letter-spacing:.12em;font-weight:800">EXEMPLO</div>`;

// 1 · gancho: TÍTULO em cima ensinando; embaixo, menor, a tela de confirmação do Pix com os 3 itens sendo conferidos (EXEMPLO)
slide(7, [[0, 'black'], [3.0, 'red']], t => {
  const inn = ease((t - 1.0) / .6);
  const C = [['👤', 'Para', 'DOCE ANA LTDA'], ['🏢', 'CNPJ', '00.000.000/0001-00'], ['💰', 'Valor', 'R$ 120,00']];
  return `${K.kin(t, .05, ['Como receber Pix', '*sem o cliente ter medo*'], { y: 300, max: 165 })}
    ${K.corpo(t, 1.0, 'Arrasta e configura hoje: <b>4 dicas</b> pra o cliente pagar tranquilo, sem achar que é golpe.', 470, { fs: 34 })}
    <div style="${CARD(150, 640, 780, 420, `opacity:${.92 * inn};transform:translateY(${(1 - inn) * 40}px)`)}">${ROT('O QUE O CLIENTE CONFERE NO PIX')}${TAG(30, 360)}
      ${C.map(([ic, r, v], j) => { const k = back((t - 1.6 - j * .5) / .4), ok = back((t - 1.9 - j * .5) / .3);
        return `<div class="abs" style="left:36px;right:36px;top:${86 + j * 84}px;height:70px;display:flex;align-items:center;gap:14px;padding:0 20px;border-radius:18px;background:rgba(255,255,255,.08);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 60}px)">
          <span style="font-size:28px">${ic}</span><span style="font-size:21px;color:rgba(255,255,255,.7);width:80px">${r}</span><b style="font-size:25px;flex:1">${v}</b>
          <span style="width:38px;height:38px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:21px;font-weight:800;transform:scale(${clamp(ok, 0, 1.15)})">✓</span></div>`; }).join('')}</div>
    <div class="abs" style="left:0;right:0;bottom:46px;text-align:center;opacity:${ease((t - 3.6) / .4)}"><span style="display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:40px;background:${K.verm ? '#fff' : '#FF2E43'};color:${K.verm ? '#C3101F' : '#fff'};font-family:Anton;font-size:34px;letter-spacing:.06em;box-shadow:0 0 ${30 + 14 * Math.sin(t * 4)}px rgba(255,255,255,.35)">ARRASTA <span style="display:inline-block;transform:translateX(${Math.sin(t * 4) * 14}px)">→</span></span></div>`; });

// 2 · DICA 1 · chave Pix no CNPJ: o cliente vê o nome da empresa, não o seu CPF
slide(7, [[0, 'black'], [3.4, 'red']], t => {
  const tela2 = t > 1.8, k = clamp((t - 1.1) / .5);
  const inner = !tela2 ? BANCO(BTOPO('Minhas chaves Pix') + `<div style="padding:16px 20px">${[['🪪', 'CPF', 'conta pessoal', 0], ['🏢', 'CNPJ', 'conta da empresa', 1], ['📱', 'Celular', '', 0], ['✉️', 'E-mail', '', 0]].map(([ic, n, s, alvo]) => `<div style="display:flex;align-items:center;gap:14px;padding:15px 10px;border-radius:14px;background:${alvo && k > 0 ? `rgba(33,195,139,${.3 * Math.sin(k * Math.PI) + (k >= 1 ? .15 : 0)})` : 'transparent'}"><span style="font-size:24px">${ic}</span><div><div style="font-size:19px;font-weight:700">${n}</div>${s ? `<div style="font-size:14px;color:${BS}">${s}</div>` : ''}</div><span style="margin-left:auto;color:${BS}">›</span></div>`).join('')}</div>`) + (t > 1.0 && t < 1.8 ? onda(160, 250, k, BA) : '')
    : BANCO(BTOPO('Pix recebido por') + `<div style="padding:26px 22px">
        <div style="font-size:14px;color:${BS}">QUEM O CLIENTE VÊ</div>
        <div style="margin-top:10px;padding:16px;border-radius:14px;background:rgba(255,255,255,.05);font-size:18px;color:${BS};text-decoration:line-through;opacity:${1 - .5 * clamp((t - 2.4) / .4)}">Maria A. S. · CPF ***.123.456-**</div>
        <div style="margin-top:12px;padding:16px;border-radius:14px;background:rgba(33,195,139,.15);border:2px solid ${BA};font-size:20px;font-weight:800;transform:scale(${back((t - 2.6) / .4)})">DOCE ANA LTDA<div style="font-size:14px;font-weight:600;color:${BS};margin-top:4px">CNPJ 00.000.000/0001-00</div></div>
        <div style="margin-top:18px;font-size:16px;color:${BA};font-weight:800;opacity:${ease((t - 3.2) / .4)}">✓ Passa cara de empresa séria</div></div>${EXE}`);
  return `${FONE(t, inner)}${PASSOS(t, ['Abre uma conta no nome da empresa', 'No app: Pix › Minhas chaves', 'Cadastra a chave com o CNPJ', 'O cliente vê o nome da loja, não o seu CPF'])}
  ${DICA(t, 1, ['Chave Pix', '*no CNPJ*'], 'Na hora de pagar, o cliente vê <b>o nome da sua empresa</b>, e não o nome de uma pessoa qualquer.', 1)}`; });

// 3 · DICA 2 · o mesmo nome em todo lugar: Instagram, WhatsApp e Pix batendo
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const L = [['📸', 'Instagram', '@doceana'], ['💬', 'WhatsApp', 'Doce Ana'], ['💸', 'Pix', 'DOCE ANA LTDA']];
  const inner = BANCO(BTOPO('Confere antes de pagar') + `<div style="padding:22px 20px">${L.map(([ic, n, v], j) => { const k = back((t - .7 - j * .55) / .4), ok = back((t - 1.0 - j * .55) / .3);
      return `<div style="display:flex;align-items:center;gap:12px;padding:16px 14px;margin-bottom:12px;border-radius:14px;background:rgba(255,255,255,.06);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 40}px)"><span style="font-size:24px">${ic}</span><div><div style="font-size:14px;color:${BS}">${n}</div><b style="font-size:19px">${v}</b></div><span style="margin-left:auto;width:30px;height:30px;border-radius:50%;background:${BA};color:#06301A;display:grid;place-items:center;font-weight:800;transform:scale(${clamp(ok, 0, 1.15)})">✓</span></div>`; }).join('')}
      <div style="margin-top:10px;text-align:center;padding:14px;border-radius:24px;background:${BA};color:#06301A;font-weight:800;font-size:19px;transform:scale(${back((t - 2.6) / .4)})">Tudo bate: pode pagar</div></div>${EXE}`);
  return `${FONE(t, inner)}${PASSOS(t, ['Mesmo nome no Instagram e no WhatsApp', 'O nome da conta do Pix igual ao da loja', 'Se mudar o nome, muda em todo lugar'])}
  ${DICA(t, 2, ['O mesmo nome', '*em todo lugar*'], 'Quando o nome do Pix bate com o da loja, <b>o cliente paga sem desconfiar.</b>', 3)}`; });

// 4 · DICA 3 · a chave que nunca muda: mensagem fixa no WhatsApp avisando
slide(7, [[0, 'black'], [3.4, 'red']], t => {
  const inner = TOPO('Doce Ana', 'conta comercial') + `<div style="padding:16px;position:relative;height:440px">
      <div style="max-width:86%;padding:12px 14px;border-radius:4px 14px 14px 14px;background:${ZH};font-size:16px;line-height:1.35;transform:scale(${back((t - .5) / .4)});transform-origin:0 0">💸 <b>Nossa chave Pix é o CNPJ</b><br>00.000.000/0001-00<br>DOCE ANA LTDA</div>
      <div style="margin-top:12px;max-width:86%;padding:12px 14px;border-radius:4px 14px 14px 14px;background:${ZH};font-size:16px;line-height:1.35;border-left:4px solid #F15C6D;transform:scale(${back((t - 1.4) / .4)});transform-origin:0 0">⚠️ <b>Essa chave nunca muda.</b> Se alguém pedir Pix pra outro nome ou outro número, é golpe.</div>
      <div style="position:absolute;left:16px;right:16px;top:${lerp(330, 300, ease((t - 2.4) / .4))}px;padding:10px 14px;border-radius:12px;background:#182229;font-size:14px;color:${ZS};opacity:${ease((t - 2.4) / .4)}">📌 Mensagem fixada · Catálogo · Perfil</div>
      <div style="position:absolute;right:16px;bottom:12px;font-size:12px;color:${ZS};letter-spacing:.12em;font-weight:800">EXEMPLO</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['Manda a chave sempre do mesmo número', 'Deixa ela no perfil e no catálogo', 'Avisa: "nossa chave nunca muda"'])}
  ${DICA(t, 3, ['Avisa que a chave', '*nunca muda*'], 'Se alguém se passar por você, <b>o cliente já sabe que é golpe.</b>', 4)}`; });

// 5 · DICA 4 · confere no app, não no print: o print chega, mas só vale quando aparece no extrato
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const tela2 = t > 2.0;
  const inner = !tela2 ? TOPO('Cliente novo', 'online') + `<div style="padding:16px">
        <div style="max-width:70%;padding:8px;border-radius:4px 14px 14px 14px;background:${ZH};transform:scale(${back((t - .5) / .4)});transform-origin:0 0"><div style="height:150px;border-radius:10px;background:#2A3942;display:grid;place-items:center;text-align:center;font-size:15px;color:${ZS}">🧾<br>Comprovante.jpg<br><b style="color:${ZT}">R$ 120,00</b></div></div>
        <div style="margin-top:10px;max-width:70%;padding:10px 14px;border-radius:4px 14px 14px 14px;background:${ZH};font-size:16px;transform:scale(${back((t - 1.0) / .4)});transform-origin:0 0">Já paguei! Pode mandar? 🙏</div>
        ${t > 1.4 ? `<div style="margin-top:18px;text-align:center"><span style="display:inline-block;padding:8px 16px;border-radius:20px;background:#F15C6D;color:#fff;font-weight:800;font-size:16px;transform:rotate(-4deg) scale(${back((t - 1.4) / .3)})">PRINT NÃO É DINHEIRO</span></div>` : ''}</div>`
    : BANCO(BTOPO('Extrato') + `<div style="padding:18px 20px">
        <div style="font-size:14px;color:${BS}">HOJE</div>
        ${[['Pix recebido', 'Cliente novo', '+ R$ 120,00', 2.5], ['Pix recebido', 'Ana Paula', '+ R$ 45,00', 2.9]].map(([a, b, v, t0]) => `<div style="display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.08);opacity:${ease((t - t0) / .35)};transform:translateY(${(1 - ease((t - t0) / .35)) * 20}px)"><span style="font-size:22px">💸</span><div><b style="font-size:17px">${a}</b><div style="font-size:14px;color:${BS}">${b}</div></div><b style="margin-left:auto;color:${BA};font-size:17px">${v}</b></div>`).join('')}
        <div style="margin-top:18px;text-align:center;padding:14px;border-radius:24px;background:${BA};color:#06301A;font-weight:800;font-size:18px;transform:scale(${back((t - 3.4) / .4)})">✓ Caiu de verdade: pode entregar</div></div>${EXE}`);
  return `${FONE(t, inner)}${PASSOS(t, ['O cliente mandou o comprovante?', 'Abre o app do banco', 'Só entrega quando aparecer no extrato'])}
  ${DICA(t, 4, ['Confere no app,', '*não no print*'], 'Comprovante falso existe. <b>Dinheiro de verdade aparece no extrato.</b>', 2)}`; });

// 6 · ligação com o site: o site mostra quem recebe e como pagar: os jeitos de pagar entram com ✓, incluindo os vales (EXEMPLO)
slide(6.5, [[0, 'red'], [3.0, 'black']], t => {
  const P = [['⚡', 'Pix'], ['💳', 'Crédito'], ['💳', 'Débito'], ['🍽️', 'Vale-refeição'], ['🛒', 'Vale-alimentação'], ['💵', 'Dinheiro']];
  const selo = back((t - 2.6) / .4);
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('FORMAS DE PAGAMENTO')}${TAG()}
      <div class="abs" style="left:40px;right:40px;top:86px;display:grid;grid-template-columns:1fr 1fr;gap:16px">${P.map(([ic, tx], j) => { const k = back((t - .4 - j * .25) / .35);
        return `<div style="height:80px;display:flex;align-items:center;gap:14px;padding:0 20px;border-radius:20px;background:rgba(255,255,255,.08);opacity:${clamp(k)};transform:scale(${clamp(k, 0, 1.06)})">
          <span style="font-size:32px">${ic}</span><b style="font-size:28px;flex:1">${tx}</b><span style="width:40px;height:40px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:22px;font-weight:800">✓</span></div>`; }).join('')}</div>
      ${selo > 0 ? `<div class="abs" style="left:0;right:0;top:400px;text-align:center"><span style="display:inline-block;padding:12px 28px;border-radius:30px;background:#fff;color:#C3101F;font-weight:800;font-size:28px;transform:scale(${clamp(selo, 0, 1.1)})">🍽️ Aceitamos todos os vales</span></div>` : ''}</div>
  ${K.kick(t, .1, 'E O SEU SITE?', 655)}${K.kin(t, .3, ['Seu site mostra', '*quem recebe o Pix*'], { y: 900, max: 175, ini: 5 })}
  ${K.corpo(t, 3.2, 'No site que eu faço ficam à vista <b>seu nome, CNPJ, endereço e formas de pagamento</b>: o cliente confere antes de pagar.', 1110, { fs: 33 })}
  ${K.rodape(t, 3.8)}`; });

// 7 · final aprovado
slide(6.5, [[0, 'black'], [1.4, 'red']], t => {
  const it = ['🏢 Nome e CNPJ à vista', '💳 Formas de pagamento', '🔒 Seu nome no endereço', '📍 Onde fica', '⭐ Avaliações', '🤝 Cliente paga sem medo'];
  return `<div class="abs" style="left:70px;top:170px;width:940px;display:grid;grid-template-columns:1fr 1fr;gap:20px">${it.map((x, j) => { const k = back((t - .3 - j * .15) / .4);
      return `<div style="padding:26px 22px;${K.vidro()}border-radius:28px;font-weight:800;font-size:29px;display:flex;justify-content:space-between;align-items:center;gap:10px;transform:scale(${clamp(k, 0, 1.1)});opacity:${clamp(k)}">${x}<span style="flex-shrink:0;width:46px;height:46px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:28px;transform:scale(${back((t - .6 - j * .15) / .3)})">✓</span></div>`; }).join('')}</div>
  ${K.kick(t, 1.4, 'SITE PROFISSIONAL', 655)}${K.kin(t, 1.6, ['Quer isso', '*no seu site?*'], { y: 900, max: 185, ini: 6 })}
  ${K.corpo(t, 2.6, 'Dá uma olhada na <b>minha bio</b>: tem tudo lá. 👆', 1110, { fs: 38 })}
  <div class="abs" style="left:0;right:0;bottom:44px;text-align:center;opacity:${ease((t - 3.2) / .4)};font-weight:800;font-size:24px;letter-spacing:.2em;color:rgba(255,255,255,.8)">OLHA A BIO DO @EUAUGUSTO_OLIV 👆</div>`; });

window.SLIDES = S;
