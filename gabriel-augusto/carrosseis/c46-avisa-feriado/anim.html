<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 46 ANIMADO (1080x1350, cada slide é um vídeo) · "Como avisar que vai fechar no feriado" · estilo CINÉTICO, formato do ajuste de 14/11
     Feriado nacional da Consciência Negra na sexta 20/11/2026. Título ensinando EM CIMA (semana com a sexta marcada, menor embaixo); 4 DICAS: horário especial no Google (Ajuda oficial do Perfil da Empresa),
     mensagem de ausência com horário personalizado no WhatsApp Business, lista de transmissão, status/story; ligação com o site (horário à vista, "aberto agora") + final aprovado. Dados de exemplo marcados EXEMPLO.
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c46-avisa-feriado -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-weight: 600; src: url("../fontes/playfair-600.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-style: italic; font-weight: 600; src: url("../fontes/playfair-600-italic.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script src="../animado/mockups.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7;
const S = [], slide = (dur, trocas, render) => S.push({ dur, trocas, render });
const CARD = (x, y, w, h, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${K.vidro()}overflow:hidden;${extra}`;
// setinha do mouse; k = clique (0..1)
const cursor = (x, y, k = 0) => `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="40" height="56"><g transform="scale(${1 - .15 * Math.sin(clamp(k) * Math.PI)})">
  <path d="M0 0 L0 44 L11 34 L19 52 L28 48 L20 30 L35 30 Z" fill="#fff" stroke="#0B0B0D" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const onda = (x, y, k, cor = '#fff') => k > 0 && k < 1 ? `<div class="abs" style="left:${x - 60 * k}px;top:${y - 60 * k}px;width:${120 * k}px;height:${120 * k}px;border-radius:50%;border:4px solid ${cor};opacity:${1 - k}"></div>` : '';
const FEITO = (t) => K.kick(t, .1, 'NO SEU SITE', 655);

const TAG = (x = 36, y = 28) => `<div class="abs" style="right:${x}px;top:${y}px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>`;
const ROT = txt => `<div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">${txt}</div>`;

const VIVA = () => K.verm ? '#fff' : '#FF2E43';

// ---------- celular com a tela do WhatsApp Business (tema escuro) ----------
const ZB = '#0B141A', ZH = '#1F2C34', ZT = '#E9EDEF', ZS = '#8696A0', ZG = '#00A884';
const FONE = (t, inner) => { const inn = ease(t / .6);
  return `<div class="abs" style="left:110px;top:112px;width:344px;height:600px;border-radius:52px;background:#0B0B0D;padding:12px;box-shadow:0 0 0 3px rgba(255,255,255,.25), 0 50px 100px -30px rgba(0,0,0,.9);opacity:${inn};transform:translateY(${(1 - inn) * 40}px) rotate(-2deg)">
    <div style="width:320px;height:576px;border-radius:42px;overflow:hidden;position:relative;background:${ZB};font-family:IT,sans-serif;color:${ZT}">${inner}</div>
    <div style="position:absolute;left:50%;top:22px;width:90px;height:24px;margin-left:-45px;border-radius:12px;background:#0B0B0D"></div></div>`; };
const TOPO = (tit, sub = '') => `<div style="height:104px;padding:50px 20px 0;background:${ZH};display:flex;align-items:center;gap:14px"><span style="font-size:26px;color:${ZS}">←</span><div><b style="font-size:23px">${tit}</b>${sub ? `<div style="font-size:15px;color:${ZS}">${sub}</div>` : ''}</div></div>`;
// lista de opções; sel = índice tocado, k = progresso do toque
const LISTA = (itens, sel = -1, k = 0) => itens.map(([ic, tx, sub], j) => `<div style="display:flex;align-items:center;gap:14px;padding:15px 20px;position:relative;background:${j === sel && k > 0 ? `rgba(0,168,132,${.28 * Math.sin(clamp(k) * Math.PI) + (k >= 1 ? .14 : 0)})` : 'transparent'}">
    <span style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:21px">${ic}</span><div><div style="font-size:19px;font-weight:600">${tx}</div>${sub ? `<div style="font-size:14px;color:${ZS}">${sub}</div>` : ''}</div></div>`).join('');
const CHAVE = (on) => `<span style="flex-shrink:0;width:52px;height:30px;border-radius:15px;background:${on > .5 ? ZG : '#3B4A54'};position:relative"><span style="position:absolute;top:4px;left:${4 + 22 * clamp(on)}px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span>`;
// passos do lado direito (o caminho dentro do app), cada um entra com ✓
const PASSOS = (t, L, t0 = .5, dt = .55) => L.map((tx, j) => { const k = back((t - t0 - j * dt) / .4), ok = back((t - t0 - j * dt - .3) / .3);
  return k <= 0 ? '' : `<div class="abs" style="left:500px;width:480px;top:${150 + j * 112}px;padding:18px 22px;${K.vidro()}border-radius:24px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:25px;line-height:1.2;opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 70}px)">
    <span style="flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-family:Anton;font-size:22px;transform:scale(${clamp(ok, 0, 1.15)})">${j + 1}</span>${tx}</div>`; }).join('');
const FERR = [['🏪', 'Perfil comercial'], ['🛍️', 'Catálogo'], ['💤', 'Mensagem de ausência'], ['👋', 'Mensagem de saudação'], ['⚡', 'Respostas rápidas']];
const DICA = (t, n, tit, txt, ini) => `${K.kick(t, .1, 'DICA ' + n, 736)}${K.kin(t, .3, tit, { y: 978, max: 148, ini })}${K.corpo(t, 3.0, txt, 1150, { fs: 31 })}${K.rodape(t, 3.6)}`;

// tela de app de banco genérico (sem marca)
const BB = '#111316', BH = '#1B1F24', BA = '#21C38B', BT = '#F2F4F5', BS = '#8B95A1';
const BTOPO = (tit) => `<div style="height:100px;padding:48px 20px 0;background:${BH};display:flex;align-items:center;gap:14px"><span style="font-size:24px;color:${BS}">←</span><b style="font-size:22px;color:${BT}">${tit}</b></div>`;
const BANCO = (inner) => `<div style="position:absolute;inset:0;background:${BB};color:${BT}">${inner}</div>`;
const EXE = `<div style="position:absolute;right:16px;bottom:12px;font-size:12px;color:${BS};letter-spacing:.12em;font-weight:800">EXEMPLO</div>`;

// tela do Perfil da Empresa no Google (tema escuro, sem logo)
const GB = '#202124', GH = '#2D2E31', GT = '#E8EAED', GS = '#9AA0A6', GA = '#8AB4F8';
const GTOPO = (tit) => `<div style="height:100px;padding:48px 20px 0;background:${GH};display:flex;align-items:center;gap:14px"><span style="font-size:24px;color:${GS}">✕</span><b style="font-size:21px;color:${GT}">${tit}</b></div>`;
const GTELA = (inner) => `<div style="position:absolute;inset:0;background:${GB};color:${GT}">${inner}</div>`;

// 1 · gancho: TÍTULO em cima ensinando; embaixo, menor, a semana com a sexta 20 virando FERIADO e os avisos saindo (EXEMPLO)
slide(7, [[0, 'black'], [3.0, 'red']], t => {
  const inn = ease((t - 1.0) / .6), D = ['SEG 16', 'TER 17', 'QUA 18', 'QUI 19', 'SEX 20', 'SÁB 21', 'DOM 22'];
  const P = [['🔎', 'Google: fechado na sexta'], ['💬', 'WhatsApp: resposta automática'], ['📲', 'Clientes avisados']];
  return `${K.kin(t, .05, ['Como avisar que vai', '*fechar no feriado*'], { y: 300, max: 165 })}
    ${K.corpo(t, 1.0, 'Sexta (20/11) é feriado. Arrasta e vê <b>4 avisos</b> pra o cliente não bater na porta fechada.', 470, { fs: 34 })}
    <div style="${CARD(130, 640, 820, 420, `opacity:${.92 * inn};transform:translateY(${(1 - inn) * 40}px)`)}">${ROT('SUA SEMANA')}${TAG(30, 360)}
      <div class="abs" style="left:36px;right:36px;top:76px;display:flex;gap:8px">${D.map((d, j) => { const k = ease((t - 1.1 - j * .06) / .3), fer = j === 4 ? back((t - 1.8) / .4) : 0;
        return `<div style="flex:1;padding:10px 0;border-radius:14px;text-align:center;font-weight:800;font-size:17px;line-height:1.2;opacity:${k};background:${fer > 0 ? '#fff' : 'rgba(255,255,255,.08)'};color:${fer > 0 ? '#C3101F' : 'rgba(255,255,255,.7)'};transform:scale(${1 + .08 * clamp(fer)})">${d.replace(' ', '<br>')}${fer > 0 ? '<div style="font-size:11px;letter-spacing:.08em">FERIADO</div>' : ''}</div>`; }).join('')}</div>
      ${P.map(([ic, tx], j) => { const k = back((t - 2.3 - j * .45) / .4), ok = back((t - 2.6 - j * .45) / .3);
        return `<div class="abs" style="left:36px;right:36px;top:${172 + j * 62}px;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:16px;background:rgba(255,255,255,.08);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 60}px)">
          <span style="font-size:22px">${ic}</span><b style="font-size:21px;flex:1">${tx}</b>
          <span style="width:32px;height:32px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:18px;font-weight:800;transform:scale(${clamp(ok, 0, 1.15)})">✓</span></div>`; }).join('')}</div>
    <div class="abs" style="left:0;right:0;bottom:46px;text-align:center;opacity:${ease((t - 3.6) / .4)}"><span style="display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:40px;background:${K.verm ? '#fff' : '#FF2E43'};color:${K.verm ? '#C3101F' : '#fff'};font-family:Anton;font-size:34px;letter-spacing:.06em;box-shadow:0 0 ${30 + 14 * Math.sin(t * 4)}px rgba(255,255,255,.35)">ARRASTA <span style="display:inline-block;transform:translateX(${Math.sin(t * 4) * 14}px)">→</span></span></div>`; });

// 2 · DICA 1 · horário especial no Google: Editar perfil › Horário › Horário especial › 20 de nov. › Fechado
slide(7.5, [[0, 'black'], [3.4, 'red']], t => {
  const tela2 = t > 1.8, k = clamp((t - 1.1) / .5), fech = clamp((t - 2.8) / .25);
  const inner = !tela2 ? GTELA(GTOPO('Editar perfil') + `<div style="padding:12px 18px">${[['🏪', 'Sobre'], ['📞', 'Contato'], ['📍', 'Local e áreas'], ['🕗', 'Horário'], ['➕', 'Mais']].map(([ic, n], j) => `<div style="display:flex;align-items:center;gap:14px;padding:15px 8px;border-radius:12px;background:${j === 3 && k > 0 ? `rgba(138,180,248,${.3 * Math.sin(k * Math.PI) + (k >= 1 ? .15 : 0)})` : 'transparent'}"><span style="font-size:22px">${ic}</span><b style="font-size:19px">${n}</b><span style="margin-left:auto;color:${GS}">›</span></div>`).join('')}</div>`) + (t > 1.0 && t < 1.8 ? onda(160, 330, k, GA) : '')
    : GTELA(GTOPO('Horário especial') + `<div style="padding:18px 20px">
        <div style="font-size:14px;color:${GS}">Datas comemorativas e feriados</div>
        <div style="margin-top:12px;padding:16px;border-radius:14px;background:rgba(138,180,248,.12);border:2px solid ${GA};transform:scale(${back((t - 2.0) / .4)})">
          <b style="font-size:19px">Sexta-feira, 20 de nov.</b><div style="font-size:14px;color:${GS};margin-top:2px">Dia da Consciência Negra</div>
          <div style="margin-top:14px;display:flex;align-items:center;gap:12px;font-size:18px"><span style="width:26px;height:26px;border-radius:6px;border:2px solid ${GA};display:grid;place-items:center;background:${fech > .5 ? GA : 'transparent'};color:#202124;font-weight:800">${fech > .5 ? '✓' : ''}</span>Fechado</div></div>
        <div style="margin-top:20px;text-align:center;padding:14px;border-radius:24px;background:${GA};color:#202124;font-weight:800;font-size:18px;opacity:${ease((t - 3.3) / .4)}">Salvar</div></div>`);
  return `${FONE(t, inner)}${PASSOS(t, ['Abre seu Perfil da Empresa no Google', 'Editar perfil › Horário', 'Horário especial › 20 de nov.', 'Marca "Fechado" ou põe o horário do dia'])}
  ${DICA(t, 1, ['Horário especial', '*no Google*'], 'Quem procura no Google ou no Maps vê que você tá fechado <b>e não perde a viagem.</b>', 1)}`; });

// 3 · DICA 2 · mensagem de ausência só no feriado: programação "horário personalizado" (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const tela2 = t > 1.7, on = clamp((t - 2.0) / .25), msg = 'Oi! Hoje é feriado e estamos fechados 🙏 Sábado a gente volta às 8h. Deixa sua mensagem!', n = Math.floor(clamp((t - 2.3) / 1.1) * msg.length), prog = back((t - 3.5) / .4);
  const inner = !tela2 ? TOPO('Ferramentas comerciais') + LISTA(FERR, 2, clamp((t - 1.1) / .5)) + (t > 1.0 && t < 1.7 ? onda(160, 380, clamp((t - 1.1) / .5), ZG) : '')
    : TOPO('Mensagem de ausência') + `<div style="padding:16px 20px">
        <div style="display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600">Enviar mensagem de ausência<span style="margin-left:auto"></span>${CHAVE(on)}</div>
        <div style="margin-top:18px;font-size:14px;color:${ZG};font-weight:700">MENSAGEM</div>
        <div style="margin-top:8px;min-height:110px;padding:14px 16px;border-radius:14px;background:#005C4B;font-size:17px;line-height:1.35;opacity:${clamp(on * 2)}">${msg.slice(0, n)}</div>
        <div style="margin-top:18px;font-size:14px;color:${ZG};font-weight:700">PROGRAMAÇÃO</div>
        <div style="margin-top:8px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);font-size:16px;line-height:1.35;opacity:${prog > 0 ? 1 : .35};transform:scale(${prog > 0 ? clamp(prog, 0, 1.05) : 1})">🕗 Horário personalizado<div style="color:${ZS};font-size:14px">Sex 20/11, 00h até Sáb 21/11, 8h</div></div>
        <div style="margin-top:10px;text-align:right;font-size:12px;color:${ZS};letter-spacing:.12em;font-weight:800">EXEMPLO</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['⋮ › Ferramentas comerciais', 'Mensagem de ausência', 'Escreve o aviso do feriado', 'Programação: horário personalizado'])}
  ${DICA(t, 2, ['Resposta automática', '*só no feriado*'], 'Quem chamar na sexta já recebe <b>quando você volta</b>, sem ficar no vácuo.', 3)}`; });

// 4 · DICA 3 · lista de transmissão: um aviso pra todos os clientes de uma vez (EXEMPLO)
slide(7, [[0, 'black'], [3.4, 'red']], t => {
  const C = ['Ana Paula', 'Carlos', 'Dona Lúcia', 'Marcos', 'Juliana'];
  const inner = TOPO('Nova transmissão', '5 contatos') + `<div style="padding:12px 18px">${C.map((n, j) => { const k = ease((t - .5 - j * .2) / .3), ok = back((t - .7 - j * .2) / .3);
      return `<div style="display:flex;align-items:center;gap:12px;padding:10px 4px;opacity:${k}"><span style="width:38px;height:38px;border-radius:50%;background:#2A3942;display:grid;place-items:center;font-weight:800">${n[0]}</span><span style="font-size:17px">${n}</span><span style="margin-left:auto;width:26px;height:26px;border-radius:50%;background:${ZG};color:#06301A;display:grid;place-items:center;font-weight:800;font-size:14px;transform:scale(${clamp(ok, 0, 1.15)})">✓</span></div>`; }).join('')}
      ${t > 2.2 ? `<div style="margin:10px 0 0 auto;max-width:86%;padding:12px 14px;border-radius:14px 4px 14px 14px;background:#005C4B;font-size:16px;line-height:1.35;transform:scale(${back((t - 2.2) / .4)});transform-origin:100% 0">📢 Sexta (20/11) é feriado e vamos fechar. Sábado voltamos no horário normal! 🙌 <span style="font-size:12px;color:#9FC9BD">✓✓</span></div>` : ''}
      <div style="margin-top:8px;text-align:right;font-size:12px;color:${ZS};letter-spacing:.12em;font-weight:800">EXEMPLO</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['⋮ › Nova transmissão', 'Escolhe os clientes', 'Manda o aviso uma vez só'])}
  ${DICA(t, 3, ['Avisa todo mundo', '*de uma vez*'], 'Na lista de transmissão, cada cliente recebe <b>no privado</b>, sem grupo e sem bagunça.', 4)}`; });

// 5 · DICA 4 · status e story: o aviso fica 24 horas pra quem olhar (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const prog = clamp((t - .6) / 4.5), sai = back((t - 1.0) / .5);
  const inner = `<div style="position:absolute;inset:0;background:linear-gradient(160deg,#C3101F,#3A0008)">
      <div style="position:absolute;left:14px;right:14px;top:50px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)"><div style="height:100%;width:${prog * 100}%;background:#fff;border-radius:2px"></div></div>
      <div style="position:absolute;left:18px;top:66px;display:flex;align-items:center;gap:10px"><span style="width:36px;height:36px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-weight:800">DA</span><b style="font-size:16px">Doce Ana</b><span style="font-size:13px;opacity:.7">agora</span></div>
      <div style="position:absolute;left:24px;right:24px;top:170px;text-align:center;transform:scale(${clamp(sai, 0, 1.08)});opacity:${clamp(sai)}">
        <div style="font-family:Anton;font-size:46px;line-height:1.05">SEXTA É<br>FERIADO</div>
        <div style="margin-top:14px;font-size:18px;line-height:1.35">Vamos fechar na sexta (20/11).<br>Sábado voltamos às 8h 💛</div>
        <div style="margin-top:18px;display:inline-block;padding:10px 18px;border-radius:20px;background:#fff;color:#C3101F;font-weight:800;font-size:16px;opacity:${ease((t - 2.4) / .4)}">🕗 Encomendas até quinta!</div></div>
      <div style="position:absolute;right:16px;bottom:14px;font-size:12px;letter-spacing:.12em;font-weight:800;opacity:.75">EXEMPLO</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['Posta no status do WhatsApp', 'Posta no story do Instagram', 'Aproveita: "encomendas até quinta"'])}
  ${DICA(t, 4, ['Avisa no status', '*e no story*'], 'O aviso fica no ar por um dia inteiro e ainda <b>adianta as vendas pra quinta.</b>', 2)}`; });

// 6 · ligação com o site: horário à vista, aberto agora e como chegar: o selo muda sozinho e o botão abre a rota (EXEMPLO)
slide(6.5, [[0, 'red'], [3.0, 'black']], t => {
  const H = [['Seg a sex', '8h às 18h'], ['Sábado', '8h às 13h'], ['Domingo', 'Fechado']], rota = eio((t - 2.4) / 1.4), pulso = 1 + .06 * Math.sin(t * 5);
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('HORÁRIO E ENDEREÇO')}${TAG()}
      <div class="abs" style="left:40px;top:84px;display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:30px;background:rgba(37,211,102,.18);color:#4BE38A;font-weight:800;font-size:30px;transform:scale(${back((t - .4) / .4)})">
        <i style="width:18px;height:18px;border-radius:50%;background:#25D366;box-shadow:0 0 ${10 + 8 * Math.sin(t * 5)}px #25D366"></i>Aberto agora · fecha às 18h</div>
      ${H.map(([d, h], j) => { const k = ease((t - .8 - j * .2) / .35); return `<div class="abs" style="left:40px;width:400px;top:${178 + j * 62}px;display:flex;justify-content:space-between;font-size:28px;opacity:${k}"><b>${d}</b><span style="color:rgba(255,255,255,.75)">${h}</span></div>`; }).join('')}
      <div class="abs" style="left:490px;top:96px;width:410px;height:290px;border-radius:24px;overflow:hidden;background:${K.verm ? 'rgba(90,0,10,.6)' : 'rgba(255,255,255,.06)'}">
        <svg width="410" height="290">${[[0, 70, 410, 50], [0, 200, 410, 230], [90, 0, 120, 290], [280, 0, 250, 290]].map(([a, b, c, d]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="rgba(255,255,255,.15)" stroke-width="10"/>`).join('')}
          <path d="M60 250 L110 205 L250 215 L270 120 L330 90" fill="none" stroke="${VIVA()}" stroke-width="8" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="${520 * (1 - rota)}" style="filter:drop-shadow(0 0 10px ${VIVA()})"/>
          <circle cx="60" cy="250" r="12" fill="#fff"/>${rota > .95 ? `<circle cx="330" cy="90" r="16" fill="${VIVA()}"/>` : ''}</svg>
        ${rota > .2 ? `<div class="abs" style="right:14px;bottom:14px;padding:8px 16px;border-radius:16px;background:#fff;color:#111;font-weight:800;font-size:22px;opacity:${ease((rota - .2) * 3)}">🚗 12 min</div>` : ''}</div>
      <div class="abs" style="left:40px;top:400px;padding:16px 30px;border-radius:30px;background:#fff;color:#C3101F;font-weight:800;font-size:28px;transform:scale(${t > 1.8 && t < 2.4 ? pulso : 1})">📍 Como chegar</div>
      ${t > 1.4 && t < 2.5 ? cursor(lerp(700, 200, eio((t - 1.4) / .6)), lerp(470, 420, eio((t - 1.4) / .6)), clamp((t - 2.1) / .25)) : ''}</div>
  ${K.kick(t, .1, 'E O SEU SITE?', 690)}${K.kin(t, .3, ['Seu horário', '*sempre à vista*'], { y: 900, max: 180, ini: 4 })}
  ${K.corpo(t, 3.2, 'No site que eu faço, o horário fica à vista, com <b>aberto agora</b> e a rota em um toque. O cliente não perde a viagem.', 1110, { fs: 32 })}
  ${K.rodape(t, 3.8)}`; });

// 7 · final aprovado
slide(6.5, [[0, 'black'], [1.4, 'red']], t => {
  const it = ['🕗 Horário à vista', '🟢 Aberto agora', '📍 Como chegar', '💬 Botão do WhatsApp', '🔒 Seu nome no endereço', '🤝 Cliente que não perde a viagem'];
  return `<div class="abs" style="left:70px;top:170px;width:940px;display:grid;grid-template-columns:1fr 1fr;gap:20px">${it.map((x, j) => { const k = back((t - .3 - j * .15) / .4);
      return `<div style="padding:26px 22px;${K.vidro()}border-radius:28px;font-weight:800;font-size:29px;display:flex;justify-content:space-between;align-items:center;gap:10px;transform:scale(${clamp(k, 0, 1.1)});opacity:${clamp(k)}">${x}<span style="flex-shrink:0;width:46px;height:46px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:28px;transform:scale(${back((t - .6 - j * .15) / .3)})">✓</span></div>`; }).join('')}</div>
  ${K.kick(t, 1.4, 'SITE PROFISSIONAL', 655)}${K.kin(t, 1.6, ['Quer isso', '*no seu site?*'], { y: 900, max: 185, ini: 6 })}
  ${K.corpo(t, 2.6, 'Dá uma olhada na <b>minha bio</b>: tem tudo lá. 👆', 1110, { fs: 38 })}
  <div class="abs" style="left:0;right:0;bottom:44px;text-align:center;opacity:${ease((t - 3.2) / .4)};font-weight:800;font-size:24px;letter-spacing:.2em;color:rgba(255,255,255,.8)">OLHA A BIO DO @EUAUGUSTO_OLIV 👆</div>`; });

window.SLIDES = S;
window.mostrar = (i, t) => { const s = S[i]; const f = K.fundo(t, s.trocas); document.getElementById('st').innerHTML = f + s.render(t) + K.topo(i + 1, TOTAL, t, s.dur); };
window.mostrar(0, 0);
</script></body></html>
