<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 23 ANIMADO (Instagram 1080x1350, cada slide é um vídeo) · "O dólar subiu: teu preço vai ficar pra trás?"
     Estilo CINÉTICO (27/10: "usa esse novo modelo de vídeo também nas artes com animação"), kit em ../animado/cinetico.js.
     Estrutura do guia: 1 gancho · 2 CTA de engajamento · 3–6 passo a passo com tela · 7 presente de verdade (planilha em presente/).
     Dólar: R$ 4,99 na sexta 23/10 → R$ 5,42 na abertura → passou de R$ 5,60 na manhã de 26/10 (Tribuna PR, Times Brasil, Money Times, Terra). Telas desenhadas, nomes fictícios.
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c23-dolar-preco -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7, G = '#D6B36C';
const S = [];
const slide = (dur, trocas, render) => S.push({ dur, trocas, render });

// 1 · gancho: o gráfico do dólar subindo e a pergunta
slide(6, [[0, 'black'], [2.1, 'red']], t => `
  ${K.linha(t, { y: 140, h: 480, rotulo: 'DÓLAR · US$ 1 EM REAIS', min: 4.85, max: 5.75, pontos: [{ rot: 'SEXTA', v: 4.99, t: .3 }, { rot: 'ABERTURA', v: 5.42, t: 1.0 }, { rot: 'MANHÃ', v: 5.60, t: 1.8 }] })}
  ${K.kin(t, 2.3, ['Teu preço', 'vai ficar', '*pra trás?*'], { y: 890, max: 150 })}
  ${K.corpo(t, 3.6, '4 passos pra <b>não perder dinheiro</b> nas próximas semanas.', 1150, { fs: 34 })}
  ${K.rodape(t, 4.2)}`);

// 2 · CTA de engajamento: salva + promessa do presente
slide(5.5, [[0, 'red']], t => { const fill = eio((t - 1.0) / .6), pop = back((t - 1.0) / .5), inn = ease((t - .1) / .5);
  return `<div class="abs" style="left:0;right:0;top:170px;display:grid;place-items:center;${K.surge(inn)}">
    <svg width="300" height="380" viewBox="0 0 30 38" style="transform:scale(${pop > 1 ? 1 + (pop - 1) * .5 : lerp(.9, 1, pop)});filter:drop-shadow(0 0 ${40 * fill}px rgba(255,255,255,.55))">
      <path d="M3 2h24v33l-12-8-12 8z" fill="#fff" fill-opacity="${fill}" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>
  ${K.kin(t, .5, ['*Salva*', 'esse post'], { y: 820, max: 200 })}
  ${K.corpo(t, 1.6, 'Você vai precisar dele <b>essa semana</b>.', 1040)}
  <div class="abs" style="left:150px;right:150px;top:1120px;padding:22px 30px;display:flex;gap:20px;align-items:center;justify-content:center;${K.vidro()}${K.surge(ease((t - 2.4) / .6))}">
    <span style="font-size:52px;display:inline-block;transform:rotate(${Math.sin(t * 5) * 8}deg)">🎁</span><span style="font-weight:600;font-size:32px">No último slide tem <b>um presente</b> pra você.</span></div>`; });

// 3 · passo 1: onde o dólar entra no custo
slide(7, [[0, 'black']], t => { const L = [['📦', 'Embalagem'], ['🔩', 'Peça e equipamento'], ['🧴', 'Produto importado'], ['🌾', 'Matéria-prima (trigo, por exemplo)']];
  return `${L.map((it, j) => { const k = ease((t - 1.4 - j * .4) / .5), tag = back((t - 1.7 - j * .4) / .4);
    return `<div class="abs" style="left:70px;right:70px;top:${150 + j * 122}px;height:104px;display:flex;align-items:center;gap:24px;padding:0 30px;${K.vidro()}border-radius:28px;opacity:${clamp(k * 1.3)};transform:translateX(${(1 - k) * (j % 2 ? 160 : -160)}px);filter:blur(${(1 - k) * 8}px)">
      <span style="font-size:52px">${it[0]}</span><span style="font-weight:700;font-size:36px">${it[1]}</span>
      <span style="margin-left:auto;padding:6px 18px;border-radius:14px;background:#FF2E43;color:#fff;font-family:Anton;font-size:34px;transform:scale(${tag});display:inline-block">US$</span></div>`; }).join('')}
  ${K.kick(t, .1, 'PASSO 1', 660)}
  ${K.kin(t, .3, ['Acha o dólar', '*no teu custo*'], { y: 900, max: 175, ini: 1 })}
  ${K.corpo(t, 3.4, 'Tudo que vem de fora, ou depende de coisa de fora, <b>pode subir primeiro.</b>', 1110, { fs: 34 })}
  ${K.rodape(t, 4)}`; });

// 4 · passo 2: refaz a conta (o preço é o mesmo, o custo cresce e come o lucro)
slide(8.5, [[0, 'black'], [4.3, 'red']], t => {
  const cresce = eio((t - 2.8) / 1.2), Hc = lerp(130, 190, cresce), Hd = 80, Hl = lerp(130, 70, cresce), base = 450, alerta = back((t - 4.3) / .4);
  const k1 = ease((t - 1.0) / .5), k2 = ease((t - 1.3) / .5), k3 = ease((t - 1.6) / .5), yC = base - Hc, yD = yC - Hd - 8, yL = yD - Hl - 8;
  const bloco = (y, h, fundo, cor, txt, sub, k) => `<div class="abs" style="left:50px;top:${y}px;width:300px;height:${h}px;border-radius:16px;background:${fundo};color:${cor};opacity:${k};transform:scaleY(${k});transform-origin:50% 100%;display:flex;flex-direction:column;justify-content:center;align-items:center">
    <b style="font-family:Anton;font-size:38px;font-weight:400">${txt}</b>${h >= 95 ? `<span style="font-weight:700;font-size:21px;opacity:.85">${sub}</span>` : ""}</div>`;
  return `<div class="abs" style="left:70px;top:140px;width:940px;height:490px;${K.vidro()}overflow:hidden;opacity:${ease(t / .6)}">
    ${bloco(yC, Hc, cresce > .05 ? K.viva() : '#fff', cresce > .05 && !K.verm ? '#fff' : '#0B0B0D', 'CUSTO', cresce > .05 ? '▲ subiu com o dólar' : 'o que você paga', k1)}
    ${bloco(yD, Hd, 'rgba(255,255,255,.22)', '#fff', 'DESPESAS', 'aluguel, taxa, entrega', k2)}
    ${bloco(yL, Hl, G, '#1A1205', 'LUCRO', cresce > .5 ? '▼ encolheu' : 'o que sobra pra você', k3)}
    <div class="abs" style="left:410px;top:100px;width:480px;${K.surge(ease((t - 2.0) / .5))}">
      <div style="font-weight:800;font-size:24px;letter-spacing:.14em;color:rgba(255,255,255,.65)">PREÇO DE HOJE</div>
      <div style="font-family:Anton;font-size:110px;line-height:1.05">R$ 100</div>
      <div style="font-weight:600;font-size:30px;color:rgba(255,255,255,.85);margin-top:6px">Mesmo preço, custo maior…</div></div>
    ${alerta > 0 ? `<div class="abs" style="left:410px;top:310px;padding:16px 26px;border-radius:22px;border:5px solid #fff;transform:scale(${alerta}) rotate(-3deg);background:rgba(110,6,17,.6)">
      <div style="font-family:Anton;font-size:50px;line-height:1.05;color:#fff">QUEM PAGA É TEU LUCRO</div></div>` : ''}</div>
  ${K.kick(t, .1, 'PASSO 2', 660)}
  ${K.kin(t, .3, ['Refaz', '*a conta*'], { y: 900, max: 175, ini: 2 })}
  ${K.corpo(t, 5, 'Valores de exemplo. <b>Faz a tua conta com o custo novo</b> antes de vender.', 1110, { fs: 32 })}
  ${K.rodape(t, 5.5)}`; });

// 5 · passo 3: avisa antes (vira motivo pra comprar agora)
slide(7.5, [[0, 'black'], [4.7, 'red']], t => {
  const msg = 'Oi, Ana! 😊 Dia 10 o preço muda. Quem fechar até lá paga o valor de hoje.';
  const n = Math.floor(clamp((t - 1.2) / 2.0) * msg.length), envia = t > 3.4, dig = t > 3.8 && t < 4.6, resp = back((t - 4.6) / .45);
  return `<div class="abs" style="left:110px;right:110px;top:140px;height:490px;${K.vidro()}overflow:hidden;display:flex;flex-direction:column;${K.surge(ease((t - .1) / .5))}">
    <div style="display:flex;align-items:center;gap:16px;padding:22px 28px;border-bottom:1px solid rgba(255,255,255,.12)"><div style="width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:30px">👩</div>
      <div><b style="font-size:29px">Ana (cliente)</b><div style="font-size:21px;color:rgba(255,255,255,.6)">${dig ? 'digitando…' : 'online'}</div></div></div>
    <div style="flex:1;padding:20px 24px">
      ${envia ? `<div style="margin-left:auto;max-width:86%;padding:16px 20px;border-radius:20px 20px 6px 20px;background:#005C4B;font-size:27px;line-height:1.3;transform:scale(${back((t - 3.4) / .35)});transform-origin:100% 100%">${msg}</div>` : ''}
      ${dig ? `<div style="margin-top:14px;width:100px;padding:12px 18px;border-radius:20px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.7);font-size:28px">• • •</div>` : ''}
      ${resp > 0 ? `<div style="margin-top:14px;max-width:80%;padding:16px 20px;border-radius:20px 20px 20px 6px;background:rgba(255,255,255,.16);font-size:28px;font-weight:600;transform:scale(${resp});transform-origin:0 100%">Então vou fechar hoje! 🙌</div>` : ''}</div>
    <div style="display:flex;gap:12px;padding:12px 18px 18px"><div style="flex:1;min-height:58px;padding:14px 20px;border-radius:30px;background:rgba(255,255,255,.10);font-size:23px;color:${envia ? 'rgba(255,255,255,.5)' : '#fff'}">${envia ? 'Mensagem' : msg.slice(0, n) + (Math.sin(t * 9) > 0 ? '|' : '')}</div>
      <div style="width:58px;height:58px;border-radius:50%;background:#00A884;display:grid;place-items:center;font-size:26px">➤</div></div></div>
  ${K.kick(t, .1, 'PASSO 3', 660)}
  ${K.kin(t, .3, ['Avisa', '*antes de mudar*'], { y: 900, max: 175, ini: 3 })}
  ${K.corpo(t, 5.2, 'Aviso com data <b>vira motivo pra comprar agora.</b>', 1120)}
  ${K.rodape(t, 5.6)}`; });

// 6 · passo 4: mostra o valor (onde entra o trabalho dele, sem anúncio)
slide(7, [[0, 'red']], t => { const it = [['📸', 'Foto boa do produto', 1.4], ['⭐', 'Avaliação boa no Google', 1.9], ['🌐', 'Site que explica o que você entrega', 2.4]];
  return `${it.map((x, j) => { const k = back((t - x[2]) / .5), chk = back((t - x[2] - .35) / .4);
    return `<div class="abs" style="left:70px;right:70px;top:${170 + j * 150}px;height:122px;display:flex;align-items:center;gap:24px;padding:0 32px;${K.vidro()}border-radius:30px;transform:scale(${clamp(k, 0, 1.1)});opacity:${clamp(k)}">
      <span style="font-size:54px">${x[0]}</span><span style="font-weight:700;font-size:35px">${x[1]}</span><span style="margin-left:auto;width:56px;height:56px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:34px;font-weight:800;transform:scale(${chk})">✓</span></div>`; }).join('')}
  ${K.kick(t, .1, 'PASSO 4', 660)}
  ${K.kin(t, .3, ['Mostra o valor', '*não só o preço*'], { y: 900, max: 160, ini: 4 })}
  ${K.corpo(t, 3.4, 'Quando o preço sobe, o cliente procura <b>um motivo pra pagar.</b> Dá esse motivo.', 1110, { fs: 34 })}
  ${K.rodape(t, 4)}`; });

// 7 · presente de verdade: comenta PREÇO → planilha no direct
slide(8, [[0, 'black'], [3.9, 'red']], t => {
  const word = 'PREÇO', n = Math.floor(clamp((t - 1.4) / .8) * word.length), voa = eio((t - 2.8) / 1.0), dm = back((t - 3.9) / .5);
  return `<div class="abs" style="left:110px;right:110px;top:170px;height:110px;display:flex;align-items:center;gap:20px;padding:0 28px;${K.vidro()}border-radius:30px;${K.surge(ease((t - 1.0) / .5))}">
    <div style="width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:30px">🙂</div>
    <div style="flex:1;font-size:38px;font-weight:800">${word.slice(0, n)}<span style="opacity:${n < word.length && Math.sin(t * 9) > 0 ? 1 : 0}">|</span></div>
    <span style="font-size:27px;font-weight:700;color:${n >= word.length ? '#4F9BFF' : 'rgba(255,255,255,.4)'}">Publicar</span></div>
  <div class="abs" style="left:${lerp(180, 520, voa) - 50}px;top:${lerp(300, 420, voa) - Math.sin(voa * Math.PI) * 110}px;opacity:${t > 2.8 && voa < 1 ? 1 : 0};font-size:84px;transform:rotate(${voa * 20}deg)">📄</div>
  ${dm > 0 ? `<div class="abs" style="left:150px;right:150px;top:390px;padding:26px 30px;display:flex;gap:24px;align-items:center;${K.vidro()}border-radius:30px;transform:scale(${dm})">
    <div style="width:100px;height:120px;border-radius:14px;background:#1D6F42;display:grid;place-items:center;font-family:Anton;font-size:40px;color:#fff;flex-shrink:0">XLS</div>
    <div><div style="font-weight:800;font-size:31px">planilha-preco-novo.xlsx</div><div style="font-size:27px;color:rgba(255,255,255,.75);margin-top:6px">Chegou no teu direct ✓✓</div></div></div>` : ''}
  ${K.kick(t, .1, '🎁 PRESENTE', 605)}
  ${K.kin(t, .3, ['Comenta', '*PREÇO*'], { y: 870, max: 180, ini: 5 })}
  ${K.corpo(t, 4.4, 'que eu te mando no direct a <b>planilha do preço novo</b>: você coloca teus custos e ela mostra quanto cobrar.', 1130, { fs: 31 })}
  <div class="abs" style="left:0;right:0;bottom:44px;text-align:center;opacity:${ease((t - 5) / .4)};font-weight:800;font-size:24px;letter-spacing:.2em;color:rgba(255,255,255,.75)">DE GRAÇA · SALVA E MANDA PRA QUEM VENDE</div>`; });

window.SLIDES = S;
window.mostrar = (i, t) => { const s = S[i]; const f = K.fundo(t, s.trocas); document.getElementById('st').innerHTML = f + K.topo(i + 1, TOTAL, t, s.dur) + s.render(t); };
window.mostrar(0, 0);
</script></body></html>
