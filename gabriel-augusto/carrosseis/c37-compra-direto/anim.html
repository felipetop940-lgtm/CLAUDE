<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 37 ANIMADO (1080x1350, cada slide é um vídeo) · "Com isso o cliente compra direto de você" · estilo CINÉTICO focado em SITE
     Regras de 27-29/10 e 07/11: gancho com promessa + animação coerente (vender por marketplace x pelo seu site, EXEMPLO), sem imagem de IA, sem falar de IA, sempre "seu/sua", sem o emoji de calendário;
     site real do Dr. Fernando no celular; preços claros (EXEMPLO); cardápio com filtro (EXEMPLO); perguntas frequentes (EXEMPLO); vídeo na página (EXEMPLO); final aprovado. Liga com o v37 (11.11).
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c37-compra-direto -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-weight: 600; src: url("../fontes/playfair-600.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-style: italic; font-weight: 600; src: url("../fontes/playfair-600-italic.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script src="../animado/mockups.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7;
const S = [], slide = (dur, trocas, render) => S.push({ dur, trocas, render });
const CARD = (x, y, w, h, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${K.vidro()}overflow:hidden;${extra}`;
// setinha do mouse; k = clique (0..1)
const cursor = (x, y, k = 0) => `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="40" height="56"><g transform="scale(${1 - .15 * Math.sin(clamp(k) * Math.PI)})">
  <path d="M0 0 L0 44 L11 34 L19 52 L28 48 L20 30 L35 30 Z" fill="#fff" stroke="#0B0B0D" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const onda = (x, y, k, cor = '#fff') => k > 0 && k < 1 ? `<div class="abs" style="left:${x - 60 * k}px;top:${y - 60 * k}px;width:${120 * k}px;height:${120 * k}px;border-radius:50%;border:4px solid ${cor};opacity:${1 - k}"></div>` : '';
const FEITO = (t) => K.kick(t, .1, 'NO SEU SITE', 655);

const TAG = (x = 36, y = 28) => `<div class="abs" style="right:${x}px;top:${y}px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>`;
const ROT = txt => `<div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">${txt}</div>`;

const VIVA = () => K.verm ? '#fff' : '#FF2E43';

// 1 · gancho: vender só pelo marketplace x vender pelo seu site (EXEMPLO), os ✓ entram do lado do site
slide(7, [[0, 'black'], [3.0, 'red']], t => {
  const A = ['Taxa em cada venda', 'O cliente é da plataforma', 'Concorrente do lado'], B = ['Venda direto com você', 'O cliente é seu', 'Só o seu negócio na tela'];
  const lado = (x, tit, L, bom, t0) => `<div class="abs" style="left:${x}px;top:76px;width:420px">
      <div style="font-weight:800;font-size:24px;letter-spacing:.12em;color:${bom ? '#fff' : 'rgba(255,255,255,.6)'};margin-bottom:14px">${tit}</div>
      ${L.map((tx, j) => { const k = back((t - t0 - j * .4) / .4);
        return `<div style="height:76px;margin-bottom:14px;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:20px;background:${bom ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.05)'};opacity:${clamp(k)};transform:translateY(${(1 - clamp(k)) * 20}px)">
          <span style="width:40px;height:40px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;background:${bom ? '#fff' : 'rgba(255,255,255,.15)'};color:${bom ? '#C3101F' : 'rgba(255,255,255,.7)'};transform:scale(${clamp(k, 0, 1.15)})">${bom ? '✓' : '✕'}</span>
          <b style="font-size:25px;color:${bom ? '#fff' : 'rgba(255,255,255,.65)'}">${tx}</b></div>`; }).join('')}</div>`;
  return `<div style="${CARD(70, 170, 940, 440)}">${TAG(36, 378)}${lado(40, 'SÓ NO MARKETPLACE', A, false, .4)}
      <div class="abs" style="left:468px;top:90px;bottom:70px;width:2px;background:rgba(255,255,255,.15)"></div>${lado(490, 'NO SEU SITE', B, true, 1.6)}</div>
    ${K.kin(t, .05, ['Com isso o cliente', '*compra direto de você*'], { y: 890, max: 175 })}
    ${K.corpo(t, 3.2, 'Arrasta e vê <b>o que faz ele fechar no seu site, sem intermediário.</b>', 1095, { fs: 36 })}
    <div class="abs" style="left:0;right:0;bottom:46px;text-align:center;opacity:${ease((t - 3.6) / .4)}"><span style="display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:40px;background:${K.verm ? '#fff' : '#FF2E43'};color:${K.verm ? '#C3101F' : '#fff'};font-family:Anton;font-size:34px;letter-spacing:.06em;box-shadow:0 0 ${30 + 14 * Math.sin(t * 4)}px rgba(255,255,255,.35)">ARRASTA <span style="display:inline-block;transform:translateX(${Math.sin(t * 4) * 14}px)">→</span></span></div>`; });

// 2 · site REAL do Dr. Fernando rolando num celular grande, com etiquetas do que aparece
const CEL = '../../video/src/fernando-site/cel-strip.jpg', CW = 585, CH = 5250;
slide(7.5, [[0, 'black'], [3.4, 'red']], t => {
  const inn = ease(t / .6), PW = 300, PH = 560, esc = PW / CW, rol = eio((t - .8) / 6) * (CH * esc - PH + 40);
  const tags = [['📱', 'Abre perfeito no celular', .9], ['👆', 'Botão grande, fácil de tocar', 1.6], ['⚡', 'Leve, carrega rápido', 2.3]];
  return `<div class="abs" style="left:150px;top:118px;width:${PW + 24}px;height:${PH + 24}px;border-radius:52px;background:#0B0B0D;padding:12px;box-shadow:0 0 0 3px rgba(255,255,255,.25), 0 50px 100px -30px rgba(0,0,0,.9);opacity:${inn};transform:translateY(${(1 - inn) * 40}px) rotate(-3deg)">
      <div style="width:${PW}px;height:${PH}px;border-radius:42px;overflow:hidden;position:relative;background:#111"><img src="${CEL}" style="position:absolute;left:0;top:${-rol}px;width:${PW}px"></div>
      <div style="position:absolute;left:50%;top:22px;width:90px;height:24px;margin-left:-45px;border-radius:12px;background:#0B0B0D"></div></div>
    ${tags.map(([ic, tx, t0], j) => { const k = back((t - t0) / .4); return k <= 0 ? '' : `<div class="abs" style="left:520px;top:${200 + j * 130}px;width:460px;padding:20px 24px;${K.vidro()}border-radius:26px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:28px;transform:translateX(${(1 - clamp(k)) * 80}px) scale(${clamp(k, 0, 1.06)});opacity:${clamp(k)}"><span style="font-size:36px">${ic}</span>${tx}</div>`; }).join('')}
    <div class="abs" style="left:520px;top:600px;font-weight:700;font-size:22px;color:rgba(255,255,255,.7);opacity:${ease((t - 2.8) / .4)}">fernandoaugustodr.com.br</div>
  ${K.kick(t, .1, 'SITE REAL', 676)}${K.kin(t, .3, ['Seu cliente', '*tá no celular*'], { y: 930, max: 170, ini: 1 })}
  ${K.corpo(t, 3.0, 'Esse é o site do <b>Dr. Fernando</b>, que eu fiz. No celular ele fica tão bonito quanto no computador.', 1115, { fs: 33 })}
  ${K.rodape(t, 3.6)}`; });

// 5 · preços claros (EXEMPLO): menos "quanto é?" no WhatsApp
slide(6.5, [[0, 'black'], [3.0, 'red']], t => {
  const L = [['✂️', 'Corte', 'R$ 45'], ['💇', 'Escova', 'R$ 60'], ['🎨', 'Coloração', 'R$ 120'], ['👰', 'Pacote noiva', 'sob consulta']];
  const pergunta = back((t - .4) / .4), risca = ease((t - 2.4) / .4);
  return `<div style="${CARD(70, 140, 940, 500)}">
      <div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">SERVIÇOS E VALORES</div>
      <div class="abs" style="right:36px;top:28px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>
      ${L.map(([ic, n, v], j) => { const k = ease((t - .7 - j * .3) / .45);
        return `<div class="abs" style="left:40px;right:40px;top:${90 + j * 92}px;height:76px;display:flex;align-items:center;gap:18px;padding:0 22px;border-radius:18px;background:rgba(255,255,255,.07);opacity:${k};transform:translateX(${(1 - k) * -60}px)">
          <span style="font-size:36px">${ic}</span><b style="font-size:30px">${n}</b><span style="margin-left:auto;font-family:Anton;font-size:36px;color:${K.verm ? '#fff' : '#FF2E43'}">${v}</span></div>`; }).join('')}</div>
    ${pergunta > 0 ? `<div class="abs" style="right:90px;top:600px;padding:14px 22px;border-radius:22px 22px 6px 22px;background:#005C4B;font-size:28px;font-weight:600;transform:scale(${clamp(pergunta, 0, 1.1)})">Quanto é? 🤔
      <div style="position:absolute;left:10px;right:10px;top:50%;height:5px;background:#fff;transform:scaleX(${risca});transform-origin:0 50%"></div></div>` : ''}
  ${K.kick(t, .1, 'NO SEU SITE', 690)}${K.kin(t, .3, ['Preço claro,', '*menos pergunta*'], { y: 925, max: 170, ini: 3 })}
  ${K.corpo(t, 3.2, 'Cliente que já sabe o valor chega decidido. <b>Você para de responder "quanto é?" o dia todo.</b>', 1112, { fs: 32 })}
  ${K.rodape(t, 3.8)}`; });


// 3 · catálogo com filtro: o cliente toca na categoria e só aparece o que ele quer (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const cats = ['Todos', 'Bolos', 'Doces', 'Salgados'], sel = t < 1.6 ? 0 : t < 3.2 ? 1 : 2;
  const L = [['🎂', 'Bolo de chocolate', 'R$ 90', 1], ['🍓', 'Bolo de morango', 'R$ 110', 1], ['🍫', 'Brigadeiro (cento)', 'R$ 120', 2], ['🥥', 'Beijinho (cento)', 'R$ 120', 2], ['🥟', 'Coxinha (cento)', 'R$ 95', 3], ['🧀', 'Pão de queijo (kg)', 'R$ 45', 3]];
  const vis = L.filter(x => sel === 0 || x[3] === sel).slice(0, 4), troca = sel === 0 ? ease((t - .4) / .4) : ease((t - (sel === 1 ? 1.6 : 3.2)) / .4);
  const cx = t < 1.6 ? lerp(700, 330, eio((t - .9) / .6)) : lerp(330, 500, eio((t - 2.5) / .6)), cy = 128;
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('CARDÁPIO')}${TAG()}
      <div class="abs" style="left:40px;top:80px;display:flex;gap:12px">${cats.map((c, j) => `<span style="padding:10px 24px;border-radius:26px;font-weight:800;font-size:26px;background:${j === sel ? '#fff' : 'rgba(255,255,255,.1)'};color:${j === sel ? '#C3101F' : '#fff'}">${c}</span>`).join('')}</div>
      <div class="abs" style="left:40px;right:40px;top:160px;display:grid;grid-template-columns:1fr 1fr;gap:16px">${vis.map(([ic, n, v], j) => { const k = ease((troca - j * .12) / .6);
        return `<div style="height:140px;padding:18px 20px;border-radius:22px;background:rgba(255,255,255,.08);opacity:${k};transform:scale(${.9 + .1 * k})"><div style="font-size:44px">${ic}</div><b style="display:block;font-size:26px;margin-top:6px">${n}</b><span style="font-family:Anton;font-size:30px;color:${K.verm ? '#fff' : '#FF2E43'}">${v}</span></div>`; }).join('')}</div>
      ${t > .9 && t < 3.0 ? cursor(cx, cy + 30, t < 1.7 ? clamp((t - 1.4) / .25) : clamp((t - 2.9) / .25)) : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['O cliente acha', '*o que quer*'], { y: 900, max: 175, ini: 2 })}
  ${K.corpo(t, 3.6, 'Cardápio ou catálogo com <b>filtro e preço</b>: o cliente escolhe sozinho e já chega sabendo o que quer.', 1110, { fs: 32 })}
  ${K.rodape(t, 4.2)}`; });

// 5 · perguntas respondidas: as dúvidas abrem sozinhas (EXEMPLO)
slide(6.5, [[0, 'red'], [3.2, 'black']], t => {
  const P = [['Aceita cartão e Pix?', 'Sim! Crédito, débito e Pix.'], ['Atende no sábado?', 'Sim, das 8h às 14h.'], ['Tem estacionamento?', 'Tem, na frente do salão.']];
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('PERGUNTAS FREQUENTES')}${TAG()}
      ${P.map(([p, r], j) => { const t0 = .6 + j * .8, k = ease((t - t0) / .35), ab = eio((t - t0 - .35) / .4), y = 86 + j * 135;
        return `<div class="abs" style="left:40px;right:40px;top:${y}px;padding:20px 26px;border-radius:22px;background:rgba(255,255,255,.08);opacity:${k};transform:translateY(${(1 - k) * 30}px)">
          <div style="display:flex;justify-content:space-between;font-weight:800;font-size:30px">${p}<span style="display:inline-block;transform:rotate(${ab * 45}deg);font-size:34px;line-height:1">+</span></div>
          <div style="overflow:hidden;height:${ab * 44}px;margin-top:${ab * 8}px;font-size:28px;color:${K.verm ? '#fff' : '#FF8A95'};font-weight:600">${r}</div></div>`; }).join('')}</div>
  ${FEITO(t)}${K.kin(t, .3, ['Responde antes', '*de perguntarem*'], { y: 900, max: 175, ini: 4 })}
  ${K.corpo(t, 3.2, 'As dúvidas de sempre já ficam respondidas no site. <b>Menos mensagem repetida, mais cliente decidido.</b>', 1110, { fs: 32 })}
  ${K.rodape(t, 3.8)}`; });

// 4 · vídeo na página: o player abre e toca, com legenda e barra andando
slide(6.5, [[0, 'black'], [2.6, 'red']], t => {
  const play = back((t - .5) / .4), toca = t > 1.4, pr = clamp((t - 1.4) / 4.5), ondas = Array.from({ length: 34 }, (_, j) => 12 + 46 * Math.abs(Math.sin(j * .7 + t * 6) * Math.sin(j * .23 + t * 2.3)));
  const leg = ['Oi, eu sou a Ana 👋', 'Aqui no salão a gente cuida de você', 'Agenda pelo site, é rapidinho!'][Math.min(2, Math.floor(pr * 3))];
  return `<div style="${CARD(70, 150, 940, 480)}">${ROT('VÍDEO NA SUA PÁGINA')}${TAG()}
      <div class="abs" style="left:40px;right:40px;top:80px;height:320px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 30% 30%, ${K.verm ? '#8E0B17' : '#2A2B33'}, #0B0B0D 80%)">
        ${toca ? `<div class="abs" style="left:40px;right:40px;bottom:80px;height:70px;display:flex;align-items:center;gap:8px">${ondas.map(h => `<i style="flex:1;height:${h}px;border-radius:4px;background:rgba(255,255,255,.55)"></i>`).join('')}</div>
          <div class="abs" style="left:0;right:0;top:70px;text-align:center"><span style="display:inline-block;padding:10px 22px;border-radius:14px;background:rgba(0,0,0,.6);font-weight:700;font-size:30px">${leg}</span></div>` : ''}
        ${!toca || t < 1.6 ? `<div class="abs" style="left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:#fff;display:grid;place-items:center;transform:scale(${clamp(play, 0, 1.1) * (t > 1.2 ? 1 - clamp((t - 1.2) / .4) : 1)})"><span style="margin-left:10px;width:0;height:0;border-left:44px solid #C3101F;border-top:28px solid transparent;border-bottom:28px solid transparent"></span></div>` : ''}
        <div class="abs" style="left:24px;right:24px;bottom:22px;height:8px;border-radius:4px;background:rgba(255,255,255,.2)"><div style="height:100%;width:${pr * 100}%;border-radius:4px;background:${K.verm ? '#fff' : '#FF2E43'}"></div></div></div>
      ${t > 1.0 && t < 1.5 ? cursor(lerp(760, 470, eio((t - 1.0) / .3)), lerp(440, 250, eio((t - 1.0) / .3)), clamp((t - 1.3) / .2)) : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['Seu cliente', '*te conhece antes*'], { y: 900, max: 175, ini: 3 })}
  ${K.corpo(t, 3.0, 'Um vídeo seu apresentando o negócio. <b>Quem te vê falando confia mais pra chamar.</b>', 1110, { fs: 34 })}
  ${K.rodape(t, 3.6)}`; });

// 7 · final aprovado
slide(6.5, [[0, 'black'], [1.4, 'red']], t => {
  const it = ['📱 Perfeito no celular', '🏷️ Preço claro', '🧁 Cardápio com filtro', '❓ Dúvidas respondidas', '🎬 Vídeo na página', '🤝 Cliente direto com você'];
  return `<div class="abs" style="left:70px;top:170px;width:940px;display:grid;grid-template-columns:1fr 1fr;gap:20px">${it.map((x, j) => { const k = back((t - .3 - j * .15) / .4);
      return `<div style="padding:26px 22px;${K.vidro()}border-radius:28px;font-weight:800;font-size:29px;display:flex;justify-content:space-between;align-items:center;gap:10px;transform:scale(${clamp(k, 0, 1.1)});opacity:${clamp(k)}">${x}<span style="flex-shrink:0;width:46px;height:46px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:28px;transform:scale(${back((t - .6 - j * .15) / .3)})">✓</span></div>`; }).join('')}</div>
  ${K.kick(t, 1.4, 'SITE PROFISSIONAL', 655)}${K.kin(t, 1.6, ['Quer isso', '*no seu site?*'], { y: 900, max: 185, ini: 6 })}
  ${K.corpo(t, 2.6, 'Dá uma olhada na <b>minha bio</b>: tem tudo lá. 👆', 1110, { fs: 38 })}
  <div class="abs" style="left:0;right:0;bottom:44px;text-align:center;opacity:${ease((t - 3.2) / .4)};font-weight:800;font-size:24px;letter-spacing:.2em;color:rgba(255,255,255,.8)">OLHA A BIO DO @EUAUGUSTO_OLIV 👆</div>`; });

window.SLIDES = S;
window.mostrar = (i, t) => { const s = S[i]; const f = K.fundo(t, s.trocas); document.getElementById('st').innerHTML = f + s.render(t) + K.topo(i + 1, TOTAL, t, s.dur); };
window.mostrar(0, 0);
</script></body></html>
