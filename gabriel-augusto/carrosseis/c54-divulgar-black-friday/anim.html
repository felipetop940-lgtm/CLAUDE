<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 54 ANIMADO (1080x1350, cada slide é um vídeo) · "Como divulgar sua Black Friday sem pagar anúncio" · estilo CINÉTICO, formato do ajuste de 14/11
     Título ensinando EM CIMA (4 lugares grátis onde a oferta aparece, menor embaixo); 4 DICAS: contagem regressiva no story (com lembrete), oferta no Perfil da Empresa no Google, post da oferta fixado no perfil, link da bio direto pras ofertas;
     ligação com o site (um link na bio com tudo: seunome.com.br) + final aprovado. Fontes: Canaltech, Tecnoblog, mLabs (contagem regressiva), SuperFrete e Google (ofertas no Perfil da Empresa). Dados de exemplo marcados EXEMPLO.
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c54-divulgar-black-friday -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-weight: 600; src: url("../fontes/playfair-600.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-style: italic; font-weight: 600; src: url("../fontes/playfair-600-italic.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script src="../animado/mockups.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7;
const S = [], slide = (dur, trocas, render) => S.push({ dur, trocas, render });
const CARD = (x, y, w, h, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${K.vidro()}overflow:hidden;${extra}`;
// setinha do mouse; k = clique (0..1)
const cursor = (x, y, k = 0) => `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="40" height="56"><g transform="scale(${1 - .15 * Math.sin(clamp(k) * Math.PI)})">
  <path d="M0 0 L0 44 L11 34 L19 52 L28 48 L20 30 L35 30 Z" fill="#fff" stroke="#0B0B0D" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const onda = (x, y, k, cor = '#fff') => k > 0 && k < 1 ? `<div class="abs" style="left:${x - 60 * k}px;top:${y - 60 * k}px;width:${120 * k}px;height:${120 * k}px;border-radius:50%;border:4px solid ${cor};opacity:${1 - k}"></div>` : '';
const FEITO = (t) => K.kick(t, .1, 'NO SEU SITE', 655);

const TAG = (x = 36, y = 28) => `<div class="abs" style="right:${x}px;top:${y}px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>`;
const ROT = txt => `<div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">${txt}</div>`;

const VIVA = () => K.verm ? '#fff' : '#FF2E43';

// ---------- celular com a tela do WhatsApp Business (tema escuro) ----------
const ZB = '#0B141A', ZH = '#1F2C34', ZT = '#E9EDEF', ZS = '#8696A0', ZG = '#00A884';
const FONE = (t, inner) => { const inn = ease(t / .6);
  return `<div class="abs" style="left:110px;top:112px;width:344px;height:600px;border-radius:52px;background:#0B0B0D;padding:12px;box-shadow:0 0 0 3px rgba(255,255,255,.25), 0 50px 100px -30px rgba(0,0,0,.9);opacity:${inn};transform:translateY(${(1 - inn) * 40}px) rotate(-2deg)">
    <div style="width:320px;height:576px;border-radius:42px;overflow:hidden;position:relative;background:${ZB};font-family:IT,sans-serif;color:${ZT}">${inner}</div>
    <div style="position:absolute;left:50%;top:22px;width:90px;height:24px;margin-left:-45px;border-radius:12px;background:#0B0B0D"></div></div>`; };
const TOPO = (tit, sub = '') => `<div style="height:104px;padding:50px 20px 0;background:${ZH};display:flex;align-items:center;gap:14px"><span style="font-size:26px;color:${ZS}">←</span><div><b style="font-size:23px">${tit}</b>${sub ? `<div style="font-size:15px;color:${ZS}">${sub}</div>` : ''}</div></div>`;
// lista de opções; sel = índice tocado, k = progresso do toque
const LISTA = (itens, sel = -1, k = 0) => itens.map(([ic, tx, sub], j) => `<div style="display:flex;align-items:center;gap:14px;padding:15px 20px;position:relative;background:${j === sel && k > 0 ? `rgba(0,168,132,${.28 * Math.sin(clamp(k) * Math.PI) + (k >= 1 ? .14 : 0)})` : 'transparent'}">
    <span style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:21px">${ic}</span><div><div style="font-size:19px;font-weight:600">${tx}</div>${sub ? `<div style="font-size:14px;color:${ZS}">${sub}</div>` : ''}</div></div>`).join('');
const CHAVE = (on) => `<span style="flex-shrink:0;width:52px;height:30px;border-radius:15px;background:${on > .5 ? ZG : '#3B4A54'};position:relative"><span style="position:absolute;top:4px;left:${4 + 22 * clamp(on)}px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span>`;
// passos do lado direito (o caminho dentro do app), cada um entra com ✓
const PASSOS = (t, L, t0 = .5, dt = .55) => L.map((tx, j) => { const k = back((t - t0 - j * dt) / .4), ok = back((t - t0 - j * dt - .3) / .3);
  return k <= 0 ? '' : `<div class="abs" style="left:500px;width:480px;top:${150 + j * 112}px;padding:18px 22px;${K.vidro()}border-radius:24px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:25px;line-height:1.2;opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 70}px)">
    <span style="flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-family:Anton;font-size:22px;transform:scale(${clamp(ok, 0, 1.15)})">${j + 1}</span>${tx}</div>`; }).join('');
const FERR = [['🏪', 'Perfil comercial'], ['🛍️', 'Catálogo'], ['💤', 'Mensagem de ausência'], ['👋', 'Mensagem de saudação'], ['⚡', 'Respostas rápidas']];
const DICA = (t, n, tit, txt, ini) => `${K.kick(t, .1, 'DICA ' + n, 736)}${K.kin(t, .3, tit, { y: 978, max: 148, ini })}${K.corpo(t, 3.0, txt, 1150, { fs: 31 })}${K.rodape(t, 3.6)}`;

// tela de app de banco genérico (sem marca)
const BB = '#111316', BH = '#1B1F24', BA = '#21C38B', BT = '#F2F4F5', BS = '#8B95A1';
const BTOPO = (tit) => `<div style="height:100px;padding:48px 20px 0;background:${BH};display:flex;align-items:center;gap:14px"><span style="font-size:24px;color:${BS}">←</span><b style="font-size:22px;color:${BT}">${tit}</b></div>`;
const BANCO = (inner) => `<div style="position:absolute;inset:0;background:${BB};color:${BT}">${inner}</div>`;
const EXE = `<div style="position:absolute;right:16px;bottom:12px;font-size:12px;color:${BS};letter-spacing:.12em;font-weight:800">EXEMPLO</div>`;

// tela de perfil/story genérica (sem marca)
const IG = (inner) => `<div style="position:absolute;inset:0;background:#000;color:#F5F5F5">${inner}</div>`;
const GB = '#202124', GH = '#2D2E31', GT = '#E8EAED', GS = '#9AA0A6', GA = '#8AB4F8';

// 1 · gancho: TÍTULO em cima ensinando; embaixo, menor, os 4 lugares grátis onde a oferta aparece
slide(7, [[0, 'black'], [3.0, 'red']], t => {
  const inn = ease((t - 1.0) / .6);
  const P = [['⏳', 'Story com contagem regressiva'], ['🔎', 'Oferta no Google'], ['📌', 'Post fixado no perfil'], ['🔗', 'Link da bio direto nas ofertas']];
  return `${K.kin(t, .05, ['Como divulgar sua', '*Black Friday de graça*'], { y: 300, max: 165 })}
    ${K.corpo(t, 1.0, 'Faltam 2 dias. Arrasta e vê <b>4 lugares grátis</b> pra sua oferta aparecer pra quem já te conhece.', 470, { fs: 34 })}
    <div style="${CARD(130, 640, 820, 420, `opacity:${.92 * inn};transform:translateY(${(1 - inn) * 40}px)`)}">${ROT('ONDE SUA OFERTA APARECE')}
      ${P.map(([ic, tx], j) => { const k = back((t - 1.5 - j * .45) / .4), ok = back((t - 1.8 - j * .45) / .3);
        return `<div class="abs" style="left:36px;right:36px;top:${80 + j * 76}px;height:62px;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:16px;background:rgba(255,255,255,.08);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 60}px)">
          <span style="font-size:26px">${ic}</span><b style="font-size:22px;flex:1">${tx}</b>
          <span style="padding:4px 12px;border-radius:12px;background:#fff;color:#C3101F;font-size:15px;font-weight:800;transform:scale(${clamp(ok, 0, 1.15)})">GRÁTIS</span></div>`; }).join('')}</div>
    <div class="abs" style="left:0;right:0;bottom:46px;text-align:center;opacity:${ease((t - 3.6) / .4)}"><span style="display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:40px;background:${K.verm ? '#fff' : '#FF2E43'};color:${K.verm ? '#C3101F' : '#fff'};font-family:Anton;font-size:34px;letter-spacing:.06em;box-shadow:0 0 ${30 + 14 * Math.sin(t * 4)}px rgba(255,255,255,.35)">ARRASTA <span style="display:inline-block;transform:translateX(${Math.sin(t * 4) * 14}px)">→</span></span></div>`; });

// 2 · DICA 1 · story com contagem regressiva: a figurinha aparece e o seguidor toca em "lembrar" (EXEMPLO)
slide(7.5, [[0, 'black'], [3.4, 'red']], t => {
  const fig = back((t - .7) / .45), seg = Math.max(0, 59 - Math.floor((t - .7) * 3)), lemb = t > 2.6;
  const inner = IG(`<div style="position:absolute;inset:0;background:linear-gradient(160deg,#1A1A1A,#000)">
      <div style="position:absolute;left:14px;right:14px;top:50px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)"><div style="height:100%;width:${clamp(t / 6) * 100}%;background:#fff;border-radius:2px"></div></div>
      <div style="position:absolute;left:0;right:0;top:110px;text-align:center;font-family:Anton;font-size:44px;line-height:1.05">BLACK FRIDAY<br><span style="color:#FF2E43">SEXTA, 27/11</span></div>
      <div style="position:absolute;left:26px;right:26px;top:250px;padding:16px;border-radius:18px;background:#fff;color:#111;text-align:center;transform:scale(${clamp(fig, 0, 1.08)})">
        <div style="font-size:14px;font-weight:800;letter-spacing:.08em;color:#666">COMEÇA EM</div>
        <div style="margin-top:6px;display:flex;justify-content:center;gap:8px;font-family:Anton;font-size:32px">${['01', '14', '22', String(seg).padStart(2, '0')].map((v, j) => `<span style="padding:4px 8px;border-radius:8px;background:#F1F1F1">${v}</span>${j < 3 ? '<span>:</span>' : ''}`).join('')}</div>
        <div style="margin-top:10px;padding:8px;border-radius:10px;background:${lemb ? '#21C38B' : '#EFEFEF'};color:${lemb ? '#06301A' : '#333'};font-weight:800;font-size:15px">${lemb ? '✓ Você vai ser lembrado' : '🔔 Lembrar'}</div></div>
      ${t > 2.0 && t < 2.7 ? onda(160, 420, clamp((t - 2.1) / .5), '#fff') : ''}
      <div style="position:absolute;right:16px;bottom:14px;font-size:12px;letter-spacing:.12em;font-weight:800;opacity:.7">EXEMPLO</div></div>`);
  return `${FONE(t, inner)}${PASSOS(t, ['Cria um story › figurinha', 'Contagem regressiva › data da oferta', 'Quem tocar em "lembrar" recebe o aviso'])}
  ${DICA(t, 1, ['Contagem regressiva', '*no story*'], 'O seguidor ativa o lembrete e <b>o celular avisa ele</b> quando começar.', 1)}`; });

// 3 · DICA 2 · oferta no Google: Adicionar atualização › Oferta (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const tela2 = t > 1.8, k = clamp((t - 1.1) / .5);
  const inner = !tela2 ? `<div style="position:absolute;inset:0;background:${GB};color:${GT}"><div style="height:100px;padding:48px 20px 0;background:${GH};display:flex;align-items:center"><b style="font-size:20px">Adicionar atualização</b></div>
        <div style="padding:16px 18px;display:grid;gap:10px">${[['📝', 'Novidade'], ['🏷️', 'Oferta'], ['🎉', 'Evento']].map(([ic, n], j) => `<div style="padding:16px;border-radius:14px;display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700;background:${j === 1 && k > 0 ? `rgba(138,180,248,${.35 * Math.sin(k * Math.PI) + (k >= 1 ? .2 : .08)})` : 'rgba(255,255,255,.06)'}"><span style="font-size:22px">${ic}</span>${n}</div>`).join('')}</div>
        ${t > 1.0 && t < 1.8 ? onda(160, 250, k, GA) : ''}</div>`
    : `<div style="position:absolute;inset:0;background:${GB};color:${GT}"><div style="height:100px;padding:48px 20px 0;background:${GH};display:flex;align-items:center"><b style="font-size:20px">Oferta</b></div>
        <div style="padding:16px 18px">${[['Título', 'Black Friday: 20% em todos os bolos', 2.0], ['Começa', 'sex, 27/11', 2.4], ['Termina', 'dom, 29/11', 2.7], ['Cupom', 'BLACK20', 3.0]].map(([a, v, t0]) => `<div style="padding:10px 12px;margin-bottom:8px;border-radius:10px;background:rgba(255,255,255,.06);opacity:${ease((t - t0) / .3)}"><div style="font-size:12px;color:${GS}">${a}</div><div style="font-size:16px;font-weight:700">${v}</div></div>`).join('')}
        <div style="margin-top:6px;text-align:center;padding:12px;border-radius:22px;background:${GA};color:#202124;font-weight:800;font-size:17px;opacity:${ease((t - 3.4) / .3)}">Postar</div>
        <div style="margin-top:8px;text-align:right;font-size:12px;color:${GS};letter-spacing:.12em;font-weight:800">EXEMPLO</div></div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['Abre seu Perfil da Empresa no Google', 'Adicionar atualização › Oferta', 'Título, datas e cupom › Postar'])}
  ${DICA(t, 2, ['Oferta', '*no Google*'], 'Quem te procura no Google ou no Maps <b>já vê a promoção</b> no seu perfil.', 3)}`; });

// 4 · DICA 3 · post da oferta fixado no topo do perfil (EXEMPLO)
slide(7, [[0, 'black'], [3.4, 'red']], t => {
  const fixa = eio((t - 1.4) / .6);
  const cores = ['#3A2A2A', '#2A2A3A', '#2A3A2A', '#3A3A2A', '#2A3A3A', '#3A2A3A'];
  const inner = IG(`<div style="height:100px;padding:48px 18px 0;display:flex;align-items:center;gap:10px"><b style="font-size:18px">doceana</b></div>
      <div style="padding:0 18px;display:flex;gap:14px;align-items:center"><span style="width:62px;height:62px;border-radius:50%;background:#C3101F;display:grid;place-items:center;font-weight:800">DA</span><div style="font-size:14px;line-height:1.4">Doce Ana · Confeitaria<br><span style="color:#8AB4F8">seunome.com.br</span></div></div>
      <div style="margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;position:relative">
        <div style="aspect-ratio:1;background:linear-gradient(135deg,#C3101F,#3A0008);display:grid;place-items:center;font-family:Anton;font-size:18px;text-align:center;line-height:1;transform:translate(${(1 - fixa) * 212}px, ${(1 - fixa) * 107}px);position:relative;z-index:2">BLACK<br>FRIDAY<span style="position:absolute;right:6px;top:6px;font-size:14px;opacity:${fixa}">📌</span></div>
        ${cores.map(c => `<div style="aspect-ratio:1;background:${c}"></div>`).join('')}</div>
      <div style="position:absolute;right:16px;bottom:14px;font-size:12px;letter-spacing:.12em;font-weight:800;opacity:.7">EXEMPLO</div>`);
  return `${FONE(t, inner)}${PASSOS(t, ['Posta a arte da oferta no feed', 'Toca nos ⋯ do post', 'Fixar no perfil'])}
  ${DICA(t, 3, ['Fixa a oferta', '*no topo do perfil*'], 'Quem entrar no seu perfil esses dias <b>vê a promoção primeiro</b>, não um post antigo.', 4)}`; });

// 5 · DICA 4 · link da bio direto pras ofertas (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const velho = 'linktr.exemplo/doceana123', novo = 'seunome.com.br/ofertas', apaga = clamp((t - 1.0) / .5), escreve = clamp((t - 1.6) / .9);
  const txt = t < 1.6 ? velho.slice(0, Math.ceil(velho.length * (1 - apaga))) : novo.slice(0, Math.floor(novo.length * escreve));
  const inner = IG(`<div style="height:100px;padding:48px 18px 0;display:flex;align-items:center"><b style="font-size:18px">Editar perfil › Links</b></div>
      <div style="padding:16px 18px">
        <div style="font-size:13px;color:#A8A8A8">URL</div>
        <div style="margin-top:6px;padding:14px;border-radius:12px;background:#1C1C1E;font-size:17px;color:${t < 1.6 ? '#A8A8A8' : '#8AB4F8'}">${txt}<span style="opacity:${Math.sin(t * 10) > 0 ? 1 : 0}">|</span></div>
        <div style="margin-top:12px;font-size:13px;color:#A8A8A8">Título</div>
        <div style="margin-top:6px;padding:14px;border-radius:12px;background:#1C1C1E;font-size:17px;opacity:${ease((t - 2.6) / .3)}">🖤 Ofertas da Black Friday</div>
        <div style="margin-top:16px;text-align:center;padding:12px;border-radius:12px;background:#0095F6;font-weight:800;font-size:16px;opacity:${ease((t - 3.1) / .3)}">Concluir</div>
        <div style="margin-top:10px;text-align:right;font-size:12px;letter-spacing:.12em;font-weight:800;opacity:.7">EXEMPLO</div></div>`);
  return `${FONE(t, inner)}${PASSOS(t, ['Editar perfil › Links', 'Põe o link direto das ofertas', 'Avisa no story: "link na bio"'])}
  ${DICA(t, 4, ['Link da bio', '*direto nas ofertas*'], 'Cada clique a mais <b>é um cliente a menos.</b> Leva ele direto pro que tá em promoção.', 2)}`; });

// 6 · ligação com o site: um link na bio com tudo (seunome.com.br)
slide(6.5, [[0, 'red'], [3.0, 'black']], t => {
  const feio = 'meusite.plataformagratis.exemplo/u/1234', bom = 'www.seunome.com.br', apaga = clamp((t - 1.3) / .5), k2 = clamp((t - 1.9) / .8);
  const txt = t < 1.9 ? feio.slice(0, Math.ceil(feio.length * (1 - apaga))) : bom.slice(0, Math.floor(bom.length * k2)), ok = back((t - 2.8) / .4);
  return `<div style="${CARD(70, 150, 940, 470)}">${ROT('O ENDEREÇO DO SEU SITE')}
      <div class="abs" style="left:40px;right:40px;top:100px;height:96px;display:flex;align-items:center;gap:18px;padding:0 30px;border-radius:48px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,${t > 2.7 ? .7 : .2})">
        <span style="font-size:34px">${t > 2.7 ? '🔒' : '⚠️'}</span><span style="font-size:${t < 1.9 ? 30 : 42}px;font-weight:${t < 1.9 ? 500 : 800};color:${t < 1.9 ? 'rgba(255,255,255,.6)' : '#fff'};white-space:nowrap">${txt}<span style="opacity:${Math.sin(t * 10) > 0 ? 1 : 0}">|</span></span></div>
      ${['Fácil de lembrar e de falar', 'Passa cara de empresa séria', 'Vai no cartão, no Instagram, na fachada'].map((x, j) => { const k = back((t - 3.0 - j * .25) / .35);
        return `<div class="abs" style="left:50px;top:${240 + j * 70}px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:30px;opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * -50}px)"><span style="width:42px;height:42px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:24px;font-weight:800;transform:scale(${clamp(k, 0, 1.15)})">✓</span>${x}</div>`; }).join('')}
      ${ok > 0 ? `<div class="abs" style="right:40px;top:212px;padding:10px 22px;border-radius:30px;background:#fff;color:#C3101F;font-family:Anton;font-size:32px;transform:rotate(-6deg) scale(${clamp(ok, 0, 1.15)})">DOMÍNIO PRÓPRIO</div>` : ''}</div>
  ${K.kick(t, .1, 'E O SEU SITE?', 655)}${K.kin(t, .3, ['Um link na bio', '*com tudo*'], { y: 900, max: 180, ini: 5 })}
  ${K.corpo(t, 3.4, 'No site que eu faço, ofertas, catálogo e WhatsApp ficam num endereço só: <b>seunome.com.br</b>, pra pôr na bio.', 1110, { fs: 34 })}
  ${K.rodape(t, 4.0)}`; });

// 7 · final aprovado
slide(6.5, [[0, 'black'], [1.4, 'red']], t => {
  const it = ['🔒 Seu nome no endereço', '🏷️ Ofertas num lugar só', '🛍️ Catálogo com preço', '💬 Botão do WhatsApp', '📍 Aparece no Google', '🤝 Cliente que compra'];
  return `<div class="abs" style="left:70px;top:170px;width:940px;display:grid;grid-template-columns:1fr 1fr;gap:20px">${it.map((x, j) => { const k = back((t - .3 - j * .15) / .4);
