<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 31 ANIMADO (1080x1350, cada slide é um vídeo) · "Com isso o cliente te chama na hora" · estilo CINÉTICO focado em SITE
     Regras de 27-29/10: gancho com promessa + animação coerente (celular tocando com cliente vindo do site), sem imagem de IA, sem falar de IA, sempre "seu/sua";
     antes x depois com o site real do Dr. Fernando; cardápio com filtro (EXEMPLO); vídeo na página (EXEMPLO); aberto agora + rota (EXEMPLO); avaliações (EXEMPLO); final aprovado.
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c31-cliente-chama -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-weight: 600; src: url("../fontes/playfair-600.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-style: italic; font-weight: 600; src: url("../fontes/playfair-600-italic.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script src="../animado/mockups.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7;
const S = [], slide = (dur, trocas, render) => S.push({ dur, trocas, render });
const CARD = (x, y, w, h, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${K.vidro()}overflow:hidden;${extra}`;
// setinha do mouse; k = clique (0..1)
const cursor = (x, y, k = 0) => `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="40" height="56"><g transform="scale(${1 - .15 * Math.sin(clamp(k) * Math.PI)})">
  <path d="M0 0 L0 44 L11 34 L19 52 L28 48 L20 30 L35 30 Z" fill="#fff" stroke="#0B0B0D" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const onda = (x, y, k, cor = '#fff') => k > 0 && k < 1 ? `<div class="abs" style="left:${x - 60 * k}px;top:${y - 60 * k}px;width:${120 * k}px;height:${120 * k}px;border-radius:50%;border:4px solid ${cor};opacity:${1 - k}"></div>` : '';
const FEITO = (t) => K.kick(t, .1, 'NO SEU SITE', 655);

const TAG = (x = 36, y = 28) => `<div class="abs" style="right:${x}px;top:${y}px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>`;
const ROT = txt => `<div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">${txt}</div>`;

const VIVA = () => K.verm ? '#fff' : '#FF2E43';

// 1 · gancho: o celular do dono tocando, cliente vindo do site, e os motivos dele ter chamado entrando com ✓ (EXEMPLO)
slide(7, [[0, 'black'], [3.0, 'red']], t => {
  const ring = t > .4 && t < 2.6, sh = ring ? Math.sin(t * 40) * 4 : 0, ok = back((t - 2.6) / .4), M = [['🌐', 'Achou seu site'], ['⭐', 'Viu as avaliações'], ['💬', 'Clicou pra chamar']];
  return `<div style="${CARD(70, 170, 940, 440)}">${ROT('CHEGOU AGORA')}${TAG(36, 378)}
      <div class="abs" style="left:60px;top:80px;width:300px;height:330px;border-radius:40px;background:#0B0B0D;box-shadow:0 0 0 3px rgba(255,255,255,.25);transform:translateX(${sh}px) rotate(${sh / 3}deg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
        <div style="width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#D6B36C,#8E6B2A);display:grid;place-items:center;font-family:Anton;font-size:40px;color:#111">M</div>
        <b style="font-size:28px">Marina</b><div style="font-size:20px;color:rgba(255,255,255,.65)">veio pelo seu site</div>
        <div style="margin-top:10px;display:flex;gap:30px">${ok > 0 ? `<div style="padding:10px 22px;border-radius:24px;background:#25D366;color:#06301A;font-weight:800;font-size:22px;transform:scale(${clamp(ok, 0, 1.1)})">✓ Atendida</div>` : `<i style="width:60px;height:60px;border-radius:50%;background:#FF2E43;display:grid;place-items:center;font-style:normal;font-size:28px">📞</i><i style="width:60px;height:60px;border-radius:50%;background:#25D366;display:grid;place-items:center;font-style:normal;font-size:28px;transform:scale(${1 + .1 * Math.sin(t * 8)})">📞</i>`}</div></div>
      ${ring ? [0, 1].map(k => { const q = ((t * 1.2) + k * .5) % 1; return `<div class="abs" style="left:${210 - 190 * (1 + q * .3)}px;top:${245 - 190 * (1 + q * .3)}px;width:${380 * (1 + q * .3)}px;height:${380 * (1 + q * .3)}px;border-radius:50%;border:3px solid ${VIVA()};opacity:${.6 * (1 - q)}"></div>`; }).join('') : ''}
      ${M.map(([ic, tx], j) => { const k = back((t - .9 - j * .5) / .4);
        return `<div class="abs" style="left:410px;width:490px;top:${100 + j * 100}px;height:80px;display:flex;align-items:center;gap:14px;padding:0 20px;border-radius:22px;background:rgba(255,255,255,.08);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 60}px)">
          <span style="font-size:32px">${ic}</span><b style="font-size:28px;flex:1">${tx}</b><span style="width:42px;height:42px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:24px;font-weight:800">✓</span></div>`; }).join('')}</div>
    ${K.kin(t, .05, ['Com isso o cliente', '*te chama na hora*'], { y: 890, max: 175 })}
    ${K.corpo(t, 3.2, 'Arrasta e vê <b>o que faz ele parar de pesquisar e chamar você.</b>', 1095, { fs: 36 })}
    <div class="abs" style="left:0;right:0;bottom:46px;text-align:center;opacity:${ease((t - 3.6) / .4)}"><span style="display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:40px;background:${K.verm ? '#fff' : '#FF2E43'};color:${K.verm ? '#C3101F' : '#fff'};font-family:Anton;font-size:34px;letter-spacing:.06em;box-shadow:0 0 ${30 + 14 * Math.sin(t * 4)}px rgba(255,255,255,.35)">ARRASTA <span style="display:inline-block;transform:translateX(${Math.sin(t * 4) * 14}px)">→</span></span></div>`; });

// 3 · antes x depois: o site largado vira o site real do Dr. Fernando com a barra de luz passando
const AMADOR = { url: 'drfernando.sitegratis.exemplo', titulo: 'BEM VINDO AO SITE DO DR. FERNANDO!!!', img: 'foto_consultorio(2).jpg', texto: 'Consultas, emagrecimento, reposição hormonal, exames e muito mais!!! Marque com antecedência.', horario: 'Atendemos de seg a sex.', email: 'consultorio2015@exemplo.com' };
const REAL2 = { desk: '../../video/src/fernando-site/desk-strip.jpg', cel: '../../video/src/fernando-site/cel-strip.jpg', deskW: 1200, deskH: 2225, celW: 585, celH: 5250, url: 'fernandoaugustodr.com.br' };
slide(7.5, [[0, 'black'], [3.0, 'red']], t => {
  const inn = ease(t / .5), k = eio((t - 1.4) / 1.2), x = 900 * k;
  const etq = (txt, cor, op) => `<span style="display:inline-block;padding:8px 20px;border-radius:24px;background:${cor};color:#fff;font-family:Anton;font-size:32px;opacity:${op}">${txt}</span>`;
  return `<div class="abs" style="left:90px;top:100px;width:900px;height:600px;opacity:${inn}">
      <div class="abs" style="left:0;top:50px">${MOCK.amador(900, 540, AMADOR)}</div>
      <div class="abs" style="left:0;top:50px;clip-path:inset(-40px ${900 - x}px -40px 0 round 18px)">${MOCK.duplo(900, 540, eio((t - 2.6) / 4.5), REAL2)}</div>
      ${k > 0 && k < 1 ? `<div class="abs" style="left:${x - 4}px;top:40px;width:8px;height:560px;border-radius:4px;background:#fff;box-shadow:0 0 30px 8px rgba(255,255,255,.7)"></div>` : ''}
      <div class="abs" style="left:0;top:0">${etq('ANTES', 'rgba(0,0,0,.55)', 1 - k)}</div><div class="abs" style="right:0;top:0">${etq('DEPOIS', K.verm ? '#0B0B0D' : '#FF2E43', k)}</div></div>
  ${K.kick(t, .1, 'NO SEU SITE', 698)}${K.kin(t, .3, ['Do amador', '*ao profissional*'], { y: 935, max: 175, ini: 2 })}
  ${K.corpo(t, 3.0, 'O mesmo negócio, outra cara. O depois é o site do <b>Dr. Fernando</b>, que eu fiz.', 1112, { fs: 34 })}
  ${K.rodape(t, 3.6)}`; });

// 3 · catálogo com filtro: o cliente toca na categoria e só aparece o que ele quer (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const cats = ['Todos', 'Bolos', 'Doces', 'Salgados'], sel = t < 1.6 ? 0 : t < 3.2 ? 1 : 2;
  const L = [['🎂', 'Bolo de chocolate', 'R$ 90', 1], ['🍓', 'Bolo de morango', 'R$ 110', 1], ['🍫', 'Brigadeiro (cento)', 'R$ 120', 2], ['🥥', 'Beijinho (cento)', 'R$ 120', 2], ['🥟', 'Coxinha (cento)', 'R$ 95', 3], ['🧀', 'Pão de queijo (kg)', 'R$ 45', 3]];
  const vis = L.filter(x => sel === 0 || x[3] === sel).slice(0, 4), troca = sel === 0 ? ease((t - .4) / .4) : ease((t - (sel === 1 ? 1.6 : 3.2)) / .4);
  const cx = t < 1.6 ? lerp(700, 330, eio((t - .9) / .6)) : lerp(330, 500, eio((t - 2.5) / .6)), cy = 128;
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('CARDÁPIO')}${TAG()}
      <div class="abs" style="left:40px;top:80px;display:flex;gap:12px">${cats.map((c, j) => `<span style="padding:10px 24px;border-radius:26px;font-weight:800;font-size:26px;background:${j === sel ? '#fff' : 'rgba(255,255,255,.1)'};color:${j === sel ? '#C3101F' : '#fff'}">${c}</span>`).join('')}</div>
      <div class="abs" style="left:40px;right:40px;top:160px;display:grid;grid-template-columns:1fr 1fr;gap:16px">${vis.map(([ic, n, v], j) => { const k = ease((troca - j * .12) / .6);
        return `<div style="height:140px;padding:18px 20px;border-radius:22px;background:rgba(255,255,255,.08);opacity:${k};transform:scale(${.9 + .1 * k})"><div style="font-size:44px">${ic}</div><b style="display:block;font-size:26px;margin-top:6px">${n}</b><span style="font-family:Anton;font-size:30px;color:${K.verm ? '#fff' : '#FF2E43'}">${v}</span></div>`; }).join('')}</div>
      ${t > .9 && t < 3.0 ? cursor(cx, cy + 30, t < 1.7 ? clamp((t - 1.4) / .25) : clamp((t - 2.9) / .25)) : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['O cliente acha', '*o que quer*'], { y: 900, max: 175, ini: 2 })}
  ${K.corpo(t, 3.6, 'Cardápio ou catálogo com <b>filtro e preço</b>: o cliente escolhe sozinho e já chega sabendo o que quer.', 1110, { fs: 32 })}
  ${K.rodape(t, 4.2)}`; });

// 4 · vídeo na página: o player abre e toca, com legenda e barra andando
slide(6.5, [[0, 'black'], [2.6, 'red']], t => {
  const play = back((t - .5) / .4), toca = t > 1.4, pr = clamp((t - 1.4) / 4.5), ondas = Array.from({ length: 34 }, (_, j) => 12 + 46 * Math.abs(Math.sin(j * .7 + t * 6) * Math.sin(j * .23 + t * 2.3)));
  const leg = ['Oi, eu sou a Ana 👋', 'Aqui no salão a gente cuida de você', 'Agenda pelo site, é rapidinho!'][Math.min(2, Math.floor(pr * 3))];
  return `<div style="${CARD(70, 150, 940, 480)}">${ROT('VÍDEO NA SUA PÁGINA')}${TAG()}
      <div class="abs" style="left:40px;right:40px;top:80px;height:320px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 30% 30%, ${K.verm ? '#8E0B17' : '#2A2B33'}, #0B0B0D 80%)">
        ${toca ? `<div class="abs" style="left:40px;right:40px;bottom:80px;height:70px;display:flex;align-items:center;gap:8px">${ondas.map(h => `<i style="flex:1;height:${h}px;border-radius:4px;background:rgba(255,255,255,.55)"></i>`).join('')}</div>
          <div class="abs" style="left:0;right:0;top:70px;text-align:center"><span style="display:inline-block;padding:10px 22px;border-radius:14px;background:rgba(0,0,0,.6);font-weight:700;font-size:30px">${leg}</span></div>` : ''}
        ${!toca || t < 1.6 ? `<div class="abs" style="left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;background:#fff;display:grid;place-items:center;transform:scale(${clamp(play, 0, 1.1) * (t > 1.2 ? 1 - clamp((t - 1.2) / .4) : 1)})"><span style="margin-left:10px;width:0;height:0;border-left:44px solid #C3101F;border-top:28px solid transparent;border-bottom:28px solid transparent"></span></div>` : ''}
        <div class="abs" style="left:24px;right:24px;bottom:22px;height:8px;border-radius:4px;background:rgba(255,255,255,.2)"><div style="height:100%;width:${pr * 100}%;border-radius:4px;background:${K.verm ? '#fff' : '#FF2E43'}"></div></div></div>
      ${t > 1.0 && t < 1.5 ? cursor(lerp(760, 470, eio((t - 1.0) / .3)), lerp(440, 250, eio((t - 1.0) / .3)), clamp((t - 1.3) / .2)) : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['Seu cliente', '*te conhece antes*'], { y: 900, max: 175, ini: 3 })}
  ${K.corpo(t, 3.0, 'Um vídeo seu apresentando o negócio. <b>Quem te vê falando confia mais pra chamar.</b>', 1110, { fs: 34 })}
  ${K.rodape(t, 3.6)}`; });

// 5 · aberto agora + como chegar: o selo muda sozinho e o botão abre a rota (EXEMPLO)
slide(6.5, [[0, 'red'], [3.0, 'black']], t => {
  const H = [['Seg a sex', '8h às 18h'], ['Sábado', '8h às 13h'], ['Domingo', 'Fechado']], rota = eio((t - 2.4) / 1.4), pulso = 1 + .06 * Math.sin(t * 5);
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('HORÁRIO E ENDEREÇO')}${TAG()}
      <div class="abs" style="left:40px;top:84px;display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:30px;background:rgba(37,211,102,.18);color:#4BE38A;font-weight:800;font-size:30px;transform:scale(${back((t - .4) / .4)})">
        <i style="width:18px;height:18px;border-radius:50%;background:#25D366;box-shadow:0 0 ${10 + 8 * Math.sin(t * 5)}px #25D366"></i>Aberto agora · fecha às 18h</div>
      ${H.map(([d, h], j) => { const k = ease((t - .8 - j * .2) / .35); return `<div class="abs" style="left:40px;width:400px;top:${178 + j * 62}px;display:flex;justify-content:space-between;font-size:28px;opacity:${k}"><b>${d}</b><span style="color:rgba(255,255,255,.75)">${h}</span></div>`; }).join('')}
      <div class="abs" style="left:490px;top:96px;width:410px;height:290px;border-radius:24px;overflow:hidden;background:${K.verm ? 'rgba(90,0,10,.6)' : 'rgba(255,255,255,.06)'}">
        <svg width="410" height="290">${[[0, 70, 410, 50], [0, 200, 410, 230], [90, 0, 120, 290], [280, 0, 250, 290]].map(([a, b, c, d]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="rgba(255,255,255,.15)" stroke-width="10"/>`).join('')}
          <path d="M60 250 L110 205 L250 215 L270 120 L330 90" fill="none" stroke="${VIVA()}" stroke-width="8" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="${520 * (1 - rota)}" style="filter:drop-shadow(0 0 10px ${VIVA()})"/>
          <circle cx="60" cy="250" r="12" fill="#fff"/>${rota > .95 ? `<circle cx="330" cy="90" r="16" fill="${VIVA()}"/>` : ''}</svg>
        ${rota > .2 ? `<div class="abs" style="right:14px;bottom:14px;padding:8px 16px;border-radius:16px;background:#fff;color:#111;font-weight:800;font-size:22px;opacity:${ease((rota - .2) * 3)}">🚗 12 min</div>` : ''}</div>
      <div class="abs" style="left:40px;top:400px;padding:16px 30px;border-radius:30px;background:#fff;color:#C3101F;font-weight:800;font-size:28px;transform:scale(${t > 1.8 && t < 2.4 ? pulso : 1})">📍 Como chegar</div>
      ${t > 1.4 && t < 2.5 ? cursor(lerp(700, 200, eio((t - 1.4) / .6)), lerp(470, 420, eio((t - 1.4) / .6)), clamp((t - 2.1) / .25)) : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['Aberto agora?', '*Ele já sabe*'], { y: 900, max: 180, ini: 4 })}
  ${K.corpo(t, 3.2, 'Horário que se atualiza e um toque pra abrir a rota. <b>O cliente sai de casa certo de que vai te achar.</b>', 1110, { fs: 32 })}
  ${K.rodape(t, 3.8)}`; });

// 6 · avaliações passando sozinhas (EXEMPLO)
slide(6.5, [[0, 'red'], [2.3, 'black']], t => {
  const nota = lerp(0, 4.9, eio((t - .6) / 1.4)), rev = [['Marina S.', 'Chegou certinho e no horário. Atendimento nota 10!'], ['Paulo R.', 'Fiz o pedido pelo site em 1 minuto 👏'], ['Lu C.', 'Melhor bolo que já comi em Goiânia 😋'], ['Diego A.', 'Voltei pela terceira vez. Recomendo!']];
  const desl = (t * 110) % (4 * 400);
  return `<div style="${CARD(70, 140, 940, 480)}">
      <div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">AVALIAÇÕES NO GOOGLE</div>
      <div class="abs" style="right:36px;top:28px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>
      <div class="abs" style="left:40px;top:66px;display:flex;align-items:center;gap:22px"><span style="font-family:Anton;font-size:120px;line-height:1">${fmt(nota, 1)}</span>
        <span style="font-size:58px;letter-spacing:4px">${[0, 1, 2, 3, 4].map(i => `<span style="color:${nota >= i + .9 ? '#FFC93C' : 'rgba(255,255,255,.2)'};text-shadow:${nota >= i + .9 ? '0 0 18px rgba(255,201,60,.7)' : 'none'}">★</span>`).join('')}</span></div>
      <div class="abs" style="left:0;top:240px;width:4000px;display:flex;gap:20px;transform:translateX(${40 - desl}px);opacity:${ease((t - 1.6) / .5)}">
        ${[...rev, ...rev, ...rev].map(([n, x]) => `<div style="width:380px;flex-shrink:0;padding:24px 26px;border-radius:26px;background:#fff;color:#0B0B0D">
          <div style="display:flex;justify-content:space-between"><b style="font-size:26px">${n}</b><span style="color:#F5A623;font-size:24px">★★★★★</span></div><div style="margin-top:10px;font-size:25px;line-height:1.3;color:#333">${x}</div></div>`).join('')}</div></div>
  ${FEITO(t)}${K.kin(t, .3, ['Elogio que', '*vende sozinho*'], { y: 900, max: 175, ini: 4 })}
  ${K.corpo(t, 2.8, 'As avaliações do Google <b>passam no seu site</b>, bem na hora que o cliente tá decidindo.', 1110, { fs: 34 })}
  ${K.rodape(t, 3.4)}`; });

// 7 · final aprovado
slide(6.5, [[0, 'black'], [1.4, 'red']], t => {
  const it = ['✨ Visual profissional', '🧁 Cardápio com filtro', '🎬 Vídeo na página', '🟢 Aberto agora', '⭐ Avaliações', '💬 WhatsApp'];
  return `<div class="abs" style="left:70px;top:170px;width:940px;display:grid;grid-template-columns:1fr 1fr;gap:20px">${it.map((x, j) => { const k = back((t - .3 - j * .15) / .4);
      return `<div style="padding:26px 24px;${K.vidro()}border-radius:28px;font-weight:800;font-size:30px;display:flex;justify-content:space-between;align-items:center;gap:10px;transform:scale(${clamp(k, 0, 1.1)});opacity:${clamp(k)}">${x}<span style="flex-shrink:0;width:46px;height:46px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:28px;transform:scale(${back((t - .6 - j * .15) / .3)})">✓</span></div>`; }).join('')}</div>
  ${K.kick(t, 1.4, 'SITE PROFISSIONAL', 655)}${K.kin(t, 1.6, ['Quer isso', '*no seu site?*'], { y: 900, max: 185, ini: 6 })}
  ${K.corpo(t, 2.6, 'Dá uma olhada na <b>minha bio</b>: tem tudo lá. 👆', 1110, { fs: 38 })}
  <div class="abs" style="left:0;right:0;bottom:44px;text-align:center;opacity:${ease((t - 3.2) / .4)};font-weight:800;font-size:24px;letter-spacing:.2em;color:rgba(255,255,255,.8)">OLHA A BIO DO @EUAUGUSTO_OLIV 👆</div>`; });

window.SLIDES = S;
window.mostrar = (i, t) => { const s = S[i]; const f = K.fundo(t, s.trocas); document.getElementById('st').innerHTML = f + s.render(t) + K.topo(i + 1, TOTAL, t, s.dur); };
window.mostrar(0, 0);
</script></body></html>
