<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 25 ANIMADO (1080x1350, cada slide é um vídeo) · "Teu site pode fazer isso" · estilo CINÉTICO (preto/vermelho)
     Pedido dele (27/10): arte focada no SITE, mostrando animações que dá pra ter no site da pessoa (feitas com IA) e a profissionalidade.
     Gancho com animação (bola fazendo percurso e virando botão) · resultados em gráfico (EXEMPLO) · mapa animado da região · agenda · avaliações · botão do WhatsApp · CTA.
     Tudo desenhado; números, nomes e negócio de exemplo são fictícios e aparecem marcados como EXEMPLO. Título de no máximo 2 linhas.
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c25-site-com-ia -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7;
const S = [], slide = (dur, trocas, render) => S.push({ dur, trocas, render });
const CARD = (x, y, w, h, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${K.vidro()}overflow:hidden;${extra}`;
// setinha do mouse; k = clique (0..1)
const cursor = (x, y, k = 0) => `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="40" height="56"><g transform="scale(${1 - .15 * Math.sin(clamp(k) * Math.PI)})">
  <path d="M0 0 L0 44 L11 34 L19 52 L28 48 L20 30 L35 30 Z" fill="#fff" stroke="#0B0B0D" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const onda = (x, y, k, cor = '#fff') => k > 0 && k < 1 ? `<div class="abs" style="left:${x - 60 * k}px;top:${y - 60 * k}px;width:${120 * k}px;height:${120 * k}px;border-radius:50%;border:4px solid ${cor};opacity:${1 - k}"></div>` : '';
const FEITO = (t) => K.kick(t, .1, 'FEITO COM IA', 655);

// 1 · gancho (ajuste dele: impacto já no 1º quadro): celular 3D girando pra dentro da tela, bola 3D quicando até o botão, selos orbitando
slide(7, [[0, 'red'], [2.5, 'black']], t => {
  const ent = eio(t / .7), ry = lerp(-200, -22, ent) + (t > .7 ? 6 * Math.sin((t - .7) * 1.2) : 0), sc = lerp(.35, 1, clamp(back(t / .6), 0, 1.08));
  const hops = [[-10, -80, 0, .5], [60, 150, 0, .9], [150, 250, 0, 1.25], [100, 330, 0, 1.6], [135, 430, 0, 2.0], [135, 448, 0, 2.3]];
  let bx = 135, by = 448, bz = 0; for (let k = 0; k < hops.length - 1; k++) { const [x0, y0, , t0] = hops[k], [x1, y1, , t1] = hops[k + 1]; if (t >= t0 && t < t1) { const u = (t - t0) / (t1 - t0); bx = lerp(x0, x1, u); by = lerp(y0, y1, u); bz = (k === 0 ? 260 : 150 - k * 22) * 4 * u * (1 - u); } }
  if (t < .5) { bx = -10; by = -80; bz = 260; }
  const hit = clamp((t - 2.3) / .6), press = 1 - .1 * Math.sin(clamp((t - 2.3) / .25) * Math.PI), flash = clamp(1 - t / .18);
  const bola = t < 2.35 ? `<div class="abs" style="left:${bx - 24}px;top:${by - 24}px;width:48px;height:48px;border-radius:50%;transform:translateZ(${bz}px);background:radial-gradient(circle at 34% 30%,#fff 0,#FFB3BA 12%,#FF2E43 38%,#8E0716 78%);box-shadow:0 0 30px rgba(255,46,67,.8)"></div>
      <div class="abs" style="left:${bx - 22}px;top:${by - 8}px;width:44px;height:16px;border-radius:50%;background:rgba(0,0,0,${.5 - Math.min(.4, bz / 700)});filter:blur(3px);transform:scale(${1 - Math.min(.6, bz / 500)})"></div>` : '';
  const conf = hit > 0 && hit < 1 ? Array.from({ length: 18 }, (_, i) => { const a = i * 2.39, r = 40 + 220 * eio(hit), z = 160 * Math.sin(i) * hit;
      return `<div class="abs" style="left:${135 + Math.cos(a) * r}px;top:${448 + Math.sin(a) * r * .7 - 80 * hit}px;width:14px;height:${i % 2 ? 14 : 24}px;border-radius:${i % 3 ? 3 : 7}px;background:${['#fff', '#FF2E43', '#D6B36C', '#25D366'][i % 4]};transform:translateZ(${z}px) rotate(${i * 40 + hit * 400}deg);opacity:${1 - hit}"></div>`; }).join('') : '';
  const fone = `<div class="abs" style="left:405px;top:120px;width:270px;height:530px;transform-style:preserve-3d;transform:rotateY(${ry}deg) rotateX(12deg) rotateZ(-3deg) scale(${sc})">
      <div class="abs" style="inset:0;border-radius:44px;background:#111216;border:6px solid #23252C;box-shadow:0 60px 120px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.08) inset;overflow:hidden">
        <div style="padding:26px 18px 0;color:#fff"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-family:Anton;font-size:26px">DOCE ANA</b><span style="font-size:13px;opacity:.6">☰</span></div>
          <div style="margin-top:22px;font-weight:800;font-size:27px;line-height:1.1">Bolo de festa<br>em Goiânia 🎂</div>
          <div style="margin-top:16px;height:150px;border-radius:20px;background:radial-gradient(circle at 50% 40%,#FFD1A8,#D6B36C 45%,#7A4E1E);display:grid;place-items:center;font-size:84px">🎂</div>
          <div style="margin-top:14px;display:flex;gap:6px">${[1, 2, 3].map(() => '<div style="flex:1;height:52px;border-radius:12px;background:rgba(255,255,255,.08)"></div>').join('')}</div></div>
        <div class="abs" style="left:22px;right:22px;top:418px;height:60px;border-radius:30px;background:#25D366;color:#06301A;display:grid;place-items:center;font-weight:800;font-size:21px;transform:scale(${press});box-shadow:0 0 ${hit > 0 ? 40 * (1 - hit) + 10 : 10}px rgba(37,211,102,.8)">💬 Pedir no WhatsApp</div></div>
      <div class="abs" style="inset:0;transform-style:preserve-3d">${bola}${conf}</div></div>`;
  const chips = ['⭐ 4,9 no Google', '📍 Goiânia e região', '📅 Agenda aberta'].map((c, k) => { const ang = t * .9 + k * 2.094, x = 540 + 300 * Math.cos(ang), z = 170 * Math.sin(ang), y = 260 + k * 120, pop = back((t - .9 - k * .15) / .4);
      return { z, h: `<div class="abs" style="left:${x - 130}px;top:${y}px;width:260px;padding:14px 0;border-radius:30px;text-align:center;font-weight:800;font-size:25px;color:#fff;${K.vidro()}transform:translateZ(${z}px) scale(${clamp(pop, 0, 1.1)});opacity:${clamp(pop) * (.55 + .45 * (z + 170) / 340)}">${c}</div>` }; });
  const atras = chips.filter(c => c.z < 0).map(c => c.h).join(''), frente = chips.filter(c => c.z >= 0).map(c => c.h).join('');
  return `<div class="abs" style="inset:0;perspective:1400px;perspective-origin:50% 35%;transform-style:preserve-3d">${atras}${fone}${frente}</div>
    ${flash > 0 ? `<div class="abs" style="inset:0;background:#fff;opacity:${.7 * flash}"></div>` : ''}
    ${K.kin(t, .05, ['Isso aqui', '*é um site*'], { y: 870, max: 200 })}
    ${K.corpo(t, 3.0, 'Feito com IA: <b>3D, movimento e animação</b> que fazem o cliente parar e clicar.', 1110)}
    ${K.rodape(t, 3.6)}`; });

// 2 · resultados num gráfico que se monta sozinho (valores de EXEMPLO)
slide(6.5, [[0, 'black'], [2.6, 'red']], t => `
  ${K.linha(t, { y: 140, h: 480, rotulo: 'CLIENTES QUE CHAMARAM PELO SITE', prefixo: '', casas: 0, sem_chip: true, tag: 'EXEMPLO', min: 0, max: 50,
     pontos: [{ rot: 'JUN', v: 8, t: .3 }, { rot: 'JUL', v: 17, t: 1.0 }, { rot: 'AGO', v: 26, t: 1.7 }, { rot: 'SET', v: 41, t: 2.4 }] })}
  ${FEITO(t)}${K.kin(t, .3, ['Teus resultados', '*na tela*'], { y: 900, max: 175, ini: 1 })}
  ${K.corpo(t, 3.0, 'Gráfico animado com <b>clientes, pedidos e avaliações</b> do teu negócio. Quem vê, confia.', 1110, { fs: 34 })}
  ${K.rodape(t, 3.6)}`);

// 3 · mapa 3D (ajuste dele: mais dinâmico e com 3D): o mapa vem de cima e deita, gira devagar, pino 3D cai com feixe de luz e as cidades sobem
slide(7.5, [[0, 'black'], [3.8, 'red']], t => {
  const tilt = lerp(0, 58, eio((t - .1) / 1.1)), ang = -25 + 9 * t, zoom = lerp(1.25, .98, eio(t / 1.4)), W = 1000, cx = 500, cy = 500;
  const cid = [['Goianira', 380, 330], ['Trindade', 250, 530], ['Senador Canedo', 700, 520], ['Aparecida', 520, 710], ['Anápolis', 790, 250]];
  const ruas = [[0, 180, 1000, 140], [0, 420, 1000, 470], [0, 610, 1000, 560], [0, 820, 1000, 860], [160, 0, 210, 1000], [420, 0, 390, 1000], [640, 0, 700, 1000], [860, 0, 820, 1000], [0, 60, 900, 1000], [250, 0, 1000, 700]];
  const anel = k => { const q = ((t - 1.6) / 1.5 + k) % 1; return t > 1.6 ? `<circle cx="${cx}" cy="${cy}" r="${30 + 330 * q}" fill="none" stroke="${K.viva()}" stroke-width="5" opacity="${.8 * (1 - q)}"/>` : ''; };
  const linhas = cid.map(([, x, y], j) => { const k = eio((t - 2.1 - j * .2) / .5); return `<line x1="${cx}" y1="${cy}" x2="${lerp(cx, x, k)}" y2="${lerp(cy, y, k)}" stroke="#fff" stroke-width="4" stroke-dasharray="14 12" stroke-dashoffset="${-t * 60}" opacity=".75"/>`; }).join('');
  const ergue = (x, y, h) => `position:absolute;left:${x}px;top:${y}px;width:0;height:0;transform-style:preserve-3d;transform:rotateZ(${-ang}deg) rotateX(${-tilt}deg)`;
  const pinos = cid.map(([n, x, y], j) => { const k = back((t - 2.5 - j * .2) / .45);
      return k <= 0 ? '' : `<div style="${ergue(x, y)}"><div style="position:absolute;left:-60px;bottom:0;width:120px;text-align:center;transform:scale(${clamp(k, 0, 1.15)});transform-origin:50% 100%">
        <div style="display:inline-block;padding:6px 14px;border-radius:16px;background:#fff;color:#0B0B0D;font-weight:800;font-size:27px;white-space:nowrap">${n}</div>
        <div style="margin:0 auto;width:4px;height:44px;background:linear-gradient(#fff,rgba(255,255,255,.2))"></div></div></div>`; }).join('');
  const queda = back((t - 1.1) / .55), alt = (1 - clamp(queda)) * 260, feixe = clamp((t - 1.5) / .4) * (.75 + .25 * Math.sin(t * 5));
  const centro = queda > 0 ? `<div style="${ergue(cx, cy)}">
      <div style="position:absolute;left:-22px;bottom:0;width:44px;height:380px;border-radius:22px;background:linear-gradient(to top, ${K.verm ? 'rgba(255,255,255,.45)' : 'rgba(255,46,67,.5)'}, transparent 85%);opacity:${feixe};filter:blur(9px)"></div>
      <div style="position:absolute;left:-55px;bottom:${alt}px;width:110px;height:140px;transform:scale(${clamp(queda, 0, 1.1)});transform-origin:50% 100%">
        <svg width="110" height="140" viewBox="0 0 110 140"><defs><radialGradient id="pg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="${K.verm ? '#fff' : '#FF6B78'}"/><stop offset="1" stop-color="${K.verm ? '#E7E7EC' : '#B00A1B'}"/></radialGradient></defs>
          <path d="M55 138 C30 100 6 78 6 52 A49 49 0 1 1 104 52 C104 78 80 100 55 138Z" fill="url(#pg)" stroke="#fff" stroke-width="4"/><circle cx="55" cy="52" r="18" fill="${K.verm ? '#C3101F' : '#fff'}"/></svg></div>
      <div style="position:absolute;left:-110px;bottom:${alt + 150}px;width:220px;text-align:center;font-family:Anton;font-size:50px;color:#fff;opacity:${clamp(queda)};text-shadow:0 6px 20px rgba(0,0,0,.6)">GOIÂNIA</div></div>` : '';
  const plano = `<div style="position:absolute;left:${470 - W / 2}px;top:${300 - W / 2}px;width:${W}px;height:${W}px;transform-style:preserve-3d;transform:scale(${zoom}) rotateX(${tilt}deg) rotateZ(${ang}deg)">
      <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%, ${K.verm ? 'rgba(120,0,14,.75)' : 'rgba(40,42,52,.9)'} 0, ${K.verm ? 'rgba(90,0,10,.5)' : 'rgba(20,21,26,.75)'} 55%, transparent 71%)"></div>
      <svg width="${W}" height="${W}" style="position:absolute;inset:0">
        ${ruas.map(([a, b, c, d], j) => `<line x1="${a}" y1="${b}" x2="${lerp(a, c, eio((t - j * .06) / .9))}" y2="${lerp(b, d, eio((t - j * .06) / .9))}" stroke="rgba(255,255,255,.16)" stroke-width="${j % 3 ? 4 : 10}" stroke-linecap="round"/>`).join('')}
        ${anel(0)}${anel(.5)}${linhas}
        ${cid.map(([, x, y], j) => { const k = back((t - 2.5 - j * .2) / .4); return k > 0 ? `<circle cx="${x}" cy="${y}" r="${14 * clamp(k, 0, 1.2)}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${30 * clamp(k)}" fill="none" stroke="#fff" stroke-width="3" opacity=".5"/>` : ''; }).join('')}</svg>
      ${pinos}${centro}</div>`;
  return `<div class="abs" style="left:70px;top:130px;width:940px;height:520px;perspective:1300px;perspective-origin:50% 20%;overflow:hidden;-webkit-mask-image:radial-gradient(ellipse 75% 85% at 50% 50%, #000 60%, transparent 100%)">${plano}</div>
    <div class="abs" style="left:0;right:0;top:560px;text-align:center;${K.surge(back((t - 3.8) / .45))}"><span style="display:inline-block;padding:14px 30px;border-radius:34px;background:#fff;color:#C3101F;font-weight:800;font-size:31px;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)">📍 Atendemos Goiânia e região</span></div>
  ${K.kick(t, .1, 'FEITO COM IA', 660)}${K.kin(t, .3, ['Mostra onde', '*você atende*'], { y: 925, max: 165, ini: 2 })}
  ${K.corpo(t, 4.4, 'Em vez de só escrever o endereço: <b>mapa 3D com tua cidade e região.</b>', 1120, { fs: 34 })}
  ${K.rodape(t, 5)}`; });

// 4 · agenda: o cliente escolhe dia e horário sozinho
slide(7, [[0, 'black'], [3.9, 'red']], t => {
  const dias = Array.from({ length: 30 }, (_, i) => i + 1), sel = t > 1.9, hora = t > 3.0, ok = back((t - 3.9) / .45), cl = (a) => clamp((t - a) / .3);
  const cxy = !sel ? [lerp(560, 300 + 3 * 58, eio((t - 1.1) / .7)), lerp(420, 150 + 2 * 54, eio((t - 1.1) / .7))] : !hora ? [lerp(300 + 3 * 58, 660, eio((t - 2.3) / .6)), lerp(150 + 2 * 54, 236, eio((t - 2.3) / .6))] : [lerp(660, 680, eio((t - 3.2) / .4)), lerp(236, 396, eio((t - 3.2) / .4))];
  const grade = dias.map((d, i) => { const c = i % 7, r = Math.floor(i / 7), on = d === 18 && sel;
    return `<div class="abs" style="left:${40 + c * 58}px;top:${150 + r * 54}px;width:48px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:22px;background:${on ? '#fff' : 'transparent'};color:${on ? '#C3101F' : 'rgba(255,255,255,.8)'};transform:scale(${on ? 1 + .25 * Math.sin(clamp((t - 1.9) / .3) * Math.PI) : 1})">${d}</div>`; }).join('');
  const horas = ['09:00', '10:30', '14:00', '16:30'].map((h, j) => { const k = back((t - 2.1 - j * .1) / .35), on = hora && h === '14:00';
    return `<div class="abs" style="left:${470 + (j % 2) * 210}px;top:${180 + Math.floor(j / 2) * 76}px;width:190px;height:60px;border-radius:30px;display:grid;place-items:center;font-weight:800;font-size:26px;border:2px solid rgba(255,255,255,.35);background:${on ? '#fff' : 'transparent'};color:${on ? '#C3101F' : '#fff'};transform:scale(${clamp(k, 0, 1.1)})">${h}</div>`; }).join('');
  return `<div style="${CARD(70, 140, 940, 480)}">
      <div class="abs" style="left:40px;top:34px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">AGENDA ONLINE</div>
      <div class="abs" style="left:40px;top:70px;font-family:Anton;font-size:52px">NOVEMBRO</div>
      ${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((d, c) => `<div class="abs" style="left:${40 + c * 58}px;top:126px;width:48px;text-align:center;font-weight:800;font-size:18px;color:rgba(255,255,255,.45)">${d}</div>`).join('')}${grade}
      <div class="abs" style="left:470px;top:126px;font-weight:800;font-size:20px;letter-spacing:.12em;color:rgba(255,255,255,.55);opacity:${ease((t - 2.0) / .3)}">HORÁRIOS · QUA, 18</div>${horas}
      <div class="abs" style="left:470px;top:370px;width:400px;height:66px;border-radius:33px;background:#25D366;color:#06301A;display:grid;place-items:center;font-weight:800;font-size:28px;opacity:${ease((t - 3.0) / .3)};transform:scale(${1 - .06 * Math.sin(cl(3.6) * Math.PI)})">Confirmar</div>
      ${t > .9 && ok <= 0 ? cursor(cxy[0], cxy[1], t > 3.5 ? cl(3.6) : t > 2.8 ? cl(2.9) : cl(1.8)) : ''}
      ${ok > 0 ? `<div class="abs" style="left:170px;top:170px;width:600px;padding:30px 34px;border-radius:30px;background:#fff;color:#0B0B0D;text-align:center;transform:scale(${ok});box-shadow:0 30px 80px rgba(0,0,0,.5)">
        <div style="font-size:60px">✅</div><div style="font-family:Anton;font-size:52px;margin-top:6px">AGENDADO</div><div style="font-weight:700;font-size:28px;color:#444;margin-top:6px">Quarta, 18/11 · 14h</div></div>` : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['O cliente marca', '*sozinho*'], { y: 900, max: 175, ini: 3 })}
  ${K.corpo(t, 4.4, 'Ele escolhe o dia e o horário no site. <b>Você só recebe o aviso.</b> Até de madrugada.', 1110, { fs: 34 })}
  ${K.rodape(t, 5)}`; });

// 5 · avaliações passando sozinhas (EXEMPLO)
slide(6.5, [[0, 'red'], [2.3, 'black']], t => {
  const nota = lerp(0, 4.9, eio((t - .6) / 1.4)), rev = [['Marina S.', 'Chegou certinho e no horário. Atendimento nota 10!'], ['Paulo R.', 'Fiz o pedido pelo site em 1 minuto 👏'], ['Lu C.', 'Melhor bolo que já comi em Goiânia 😋'], ['Diego A.', 'Voltei pela terceira vez. Recomendo!']];
  const desl = (t * 110) % (4 * 400);
  return `<div style="${CARD(70, 140, 940, 480)}">
      <div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">AVALIAÇÕES NO GOOGLE</div>
      <div class="abs" style="right:36px;top:28px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>
      <div class="abs" style="left:40px;top:66px;display:flex;align-items:center;gap:22px"><span style="font-family:Anton;font-size:120px;line-height:1">${fmt(nota, 1)}</span>
        <span style="font-size:58px;letter-spacing:4px">${[0, 1, 2, 3, 4].map(i => `<span style="color:${nota >= i + .9 ? '#FFC93C' : 'rgba(255,255,255,.2)'};text-shadow:${nota >= i + .9 ? '0 0 18px rgba(255,201,60,.7)' : 'none'}">★</span>`).join('')}</span></div>
      <div class="abs" style="left:0;top:240px;width:4000px;display:flex;gap:20px;transform:translateX(${40 - desl}px);opacity:${ease((t - 1.6) / .5)}">
        ${[...rev, ...rev, ...rev].map(([n, x]) => `<div style="width:380px;flex-shrink:0;padding:24px 26px;border-radius:26px;background:#fff;color:#0B0B0D">
          <div style="display:flex;justify-content:space-between"><b style="font-size:26px">${n}</b><span style="color:#F5A623;font-size:24px">★★★★★</span></div><div style="margin-top:10px;font-size:25px;line-height:1.3;color:#333">${x}</div></div>`).join('')}</div></div>
  ${FEITO(t)}${K.kin(t, .3, ['Elogio que', '*vende sozinho*'], { y: 900, max: 175, ini: 4 })}
  ${K.corpo(t, 2.8, 'As avaliações do Google <b>passam no teu site</b>, bem na hora que o cliente tá decidindo.', 1110, { fs: 34 })}
  ${K.rodape(t, 3.4)}`; });

// 6 · botão que já abre o WhatsApp com a mensagem pronta
slide(7, [[0, 'black'], [3.4, 'red']], t => {
  const msg = 'Olá! Vi teu site e quero encomendar um bolo pra sábado 🎂', troca = eio((t - 1.9) / .5), n = Math.floor(clamp((t - 2.4) / .7) * msg.length), env = t > 3.4;
  const site = `<div class="abs" style="inset:0;transform:translateX(${-troca * 100}%);padding:40px">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-family:Anton;font-size:40px">DOCE ANA</b><span style="font-size:22px;color:rgba(255,255,255,.6)">Cardápio · Preços · Onde fica</span></div>
