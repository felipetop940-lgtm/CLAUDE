<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 42 ANIMADO (1080x1350, cada slide é um vídeo) · "Com isso seu cliente paga sem medo" · estilo CINÉTICO focado em SITE
     Liga com o v42 (boato do bloqueio de contas, medo de golpe com dinheiro). Regras: gancho com promessa + animação coerente (cronômetro + o que o cliente confere antes de pagar), sem imagem de IA, sem falar de IA, sempre "seu/sua", sem o emoji de calendário;
     site real do Dr. Fernando no celular; domínio próprio com cadeado; formas de pagamento (EXEMPLO); aberto agora (EXEMPLO); orçamento organizado (EXEMPLO); final aprovado. Sem repetir os slides do c41.
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c42-cliente-paga-sem-medo -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-weight: 600; src: url("../fontes/playfair-600.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-style: italic; font-weight: 600; src: url("../fontes/playfair-600-italic.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script src="../animado/mockups.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7;
const S = [], slide = (dur, trocas, render) => S.push({ dur, trocas, render });
const CARD = (x, y, w, h, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${K.vidro()}overflow:hidden;${extra}`;
// setinha do mouse; k = clique (0..1)
const cursor = (x, y, k = 0) => `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="40" height="56"><g transform="scale(${1 - .15 * Math.sin(clamp(k) * Math.PI)})">
  <path d="M0 0 L0 44 L11 34 L19 52 L28 48 L20 30 L35 30 Z" fill="#fff" stroke="#0B0B0D" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const onda = (x, y, k, cor = '#fff') => k > 0 && k < 1 ? `<div class="abs" style="left:${x - 60 * k}px;top:${y - 60 * k}px;width:${120 * k}px;height:${120 * k}px;border-radius:50%;border:4px solid ${cor};opacity:${1 - k}"></div>` : '';
const FEITO = (t) => K.kick(t, .1, 'NO SEU SITE', 655);

const TAG = (x = 36, y = 28) => `<div class="abs" style="right:${x}px;top:${y}px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>`;
const ROT = txt => `<div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">${txt}</div>`;

const VIVA = () => K.verm ? '#fff' : '#FF2E43';

// 1 · gancho: cronômetro correndo e, em segundos, o cliente confere o que precisa pra pagar tranquilo (cada item com ✓)
slide(7, [[0, 'black'], [3.0, 'red']], t => {
  const s = Math.min(3, Math.max(0, (t - .4) * 1.15)), R = 92, C2 = 2 * Math.PI * R;
  const P = [['🔒', 'Cadeado e seu nome no endereço', .7], ['🏢', 'CNPJ e endereço à vista', 1.4], ['💳', 'Jeitos de pagar claros', 2.1], ['💬', 'Como falar com você', 2.8]];
  return `<div style="${CARD(70, 170, 940, 440)}">${ROT('O QUE ELE CONFERE ANTES DE PAGAR')}
      <svg class="abs" style="left:40px;top:90px" width="260" height="260"><circle cx="130" cy="130" r="${R}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="18"/>
        <circle cx="130" cy="130" r="${R}" fill="none" stroke="${VIVA()}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C2 * s / 3} ${C2}" transform="rotate(-90 130 130)" style="filter:drop-shadow(0 0 12px ${VIVA()})"/>
        <text x="130" y="150" text-anchor="middle" font-family="Anton" font-size="64" fill="#fff">${s.toFixed(1).replace('.', ',')}s</text></svg>
      ${P.map(([ic, tx, t0], j) => { const k = back((t - t0) / .4), ok = back((t - t0 - .3) / .3);
        return `<div class="abs" style="left:330px;width:570px;top:${78 + j * 86}px;height:72px;display:flex;align-items:center;gap:14px;padding:0 20px;border-radius:20px;background:rgba(255,255,255,.08);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 60}px)">
          <span style="font-size:30px">${ic}</span><b style="font-size:27px;flex:1">${tx}</b><span style="width:40px;height:40px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:22px;font-weight:800;transform:scale(${clamp(ok, 0, 1.15)})">✓</span></div>`; }).join('')}</div>
    ${K.kin(t, .05, ['Com isso seu cliente', '*paga sem medo*'], { y: 890, max: 175 })}
    ${K.corpo(t, 3.2, 'Arrasta e vê <b>o que faz o cliente pagar tranquilo, sem achar que é golpe.</b>', 1095, { fs: 36 })}
    <div class="abs" style="left:0;right:0;bottom:46px;text-align:center;opacity:${ease((t - 3.6) / .4)}"><span style="display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:40px;background:${K.verm ? '#fff' : '#FF2E43'};color:${K.verm ? '#C3101F' : '#fff'};font-family:Anton;font-size:34px;letter-spacing:.06em;box-shadow:0 0 ${30 + 14 * Math.sin(t * 4)}px rgba(255,255,255,.35)">ARRASTA <span style="display:inline-block;transform:translateX(${Math.sin(t * 4) * 14}px)">→</span></span></div>`; });

// 2 · site REAL do Dr. Fernando rolando num celular grande, com etiquetas do que aparece
const CEL = '../../video/src/fernando-site/cel-strip.jpg', CW = 585, CH = 5250;
slide(7.5, [[0, 'black'], [3.4, 'red']], t => {
  const inn = ease(t / .6), PW = 300, PH = 560, esc = PW / CW, rol = eio((t - .8) / 6) * (CH * esc - PH + 40);
  const tags = [['📱', 'Abre perfeito no celular', .9], ['👆', 'Botão grande, fácil de tocar', 1.6], ['⚡', 'Leve, carrega rápido', 2.3]];
  return `<div class="abs" style="left:150px;top:118px;width:${PW + 24}px;height:${PH + 24}px;border-radius:52px;background:#0B0B0D;padding:12px;box-shadow:0 0 0 3px rgba(255,255,255,.25), 0 50px 100px -30px rgba(0,0,0,.9);opacity:${inn};transform:translateY(${(1 - inn) * 40}px) rotate(-3deg)">
      <div style="width:${PW}px;height:${PH}px;border-radius:42px;overflow:hidden;position:relative;background:#111"><img src="${CEL}" style="position:absolute;left:0;top:${-rol}px;width:${PW}px"></div>
      <div style="position:absolute;left:50%;top:22px;width:90px;height:24px;margin-left:-45px;border-radius:12px;background:#0B0B0D"></div></div>
    ${tags.map(([ic, tx, t0], j) => { const k = back((t - t0) / .4); return k <= 0 ? '' : `<div class="abs" style="left:520px;top:${200 + j * 130}px;width:460px;padding:20px 24px;${K.vidro()}border-radius:26px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:28px;transform:translateX(${(1 - clamp(k)) * 80}px) scale(${clamp(k, 0, 1.06)});opacity:${clamp(k)}"><span style="font-size:36px">${ic}</span>${tx}</div>`; }).join('')}
    <div class="abs" style="left:520px;top:600px;font-weight:700;font-size:22px;color:rgba(255,255,255,.7);opacity:${ease((t - 2.8) / .4)}">fernandoaugustodr.com.br</div>
  ${K.kick(t, .1, 'SITE REAL', 676)}${K.kin(t, .3, ['Seu cliente', '*tá no celular*'], { y: 930, max: 170, ini: 1 })}
  ${K.corpo(t, 3.0, 'Esse é o site do <b>Dr. Fernando</b>, que eu fiz. No celular ele fica tão bonito quanto no computador.', 1115, { fs: 33 })}
  ${K.rodape(t, 3.6)}`; });

// 3 · domínio próprio: o endereço feio vira www.seunome.com.br com cadeado
slide(6.5, [[0, 'red'], [3.0, 'black']], t => {
  const feio = 'meusite.plataformagratis.exemplo/u/1234', bom = 'www.seunome.com.br', apaga = clamp((t - 1.3) / .5), k2 = clamp((t - 1.9) / .8);
  const txt = t < 1.9 ? feio.slice(0, Math.ceil(feio.length * (1 - apaga))) : bom.slice(0, Math.floor(bom.length * k2)), ok = back((t - 2.8) / .4);
  return `<div style="${CARD(70, 150, 940, 470)}">${ROT('O ENDEREÇO DO SEU SITE')}
      <div class="abs" style="left:40px;right:40px;top:100px;height:96px;display:flex;align-items:center;gap:18px;padding:0 30px;border-radius:48px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,${t > 2.7 ? .7 : .2})">
        <span style="font-size:34px">${t > 2.7 ? '🔒' : '⚠️'}</span><span style="font-size:${t < 1.9 ? 30 : 42}px;font-weight:${t < 1.9 ? 500 : 800};color:${t < 1.9 ? 'rgba(255,255,255,.6)' : '#fff'};white-space:nowrap">${txt}<span style="opacity:${Math.sin(t * 10) > 0 ? 1 : 0}">|</span></span></div>
      ${['Fácil de lembrar e de falar', 'Passa cara de empresa séria', 'Vai no cartão, no Instagram, na fachada'].map((x, j) => { const k = back((t - 3.0 - j * .25) / .35);
        return `<div class="abs" style="left:50px;top:${240 + j * 70}px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:30px;opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * -50}px)"><span style="width:42px;height:42px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:24px;font-weight:800;transform:scale(${clamp(k, 0, 1.15)})">✓</span>${x}</div>`; }).join('')}
      ${ok > 0 ? `<div class="abs" style="right:40px;top:212px;padding:10px 22px;border-radius:30px;background:#fff;color:#C3101F;font-family:Anton;font-size:32px;transform:rotate(-6deg) scale(${clamp(ok, 0, 1.15)})">DOMÍNIO PRÓPRIO</div>` : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['Seu nome', '*no endereço*'], { y: 900, max: 180, ini: 2 })}
  ${K.corpo(t, 3.4, 'Nada de link comprido e esquisito: <b>seunome.com.br</b>, que o cliente lembra e confia.', 1110, { fs: 34 })}
  ${K.rodape(t, 4.0)}`; });

// 3 · formas de pagamento: os jeitos de pagar entram com ✓, incluindo os vales (EXEMPLO)
slide(6.5, [[0, 'red'], [3.0, 'black']], t => {
  const P = [['⚡', 'Pix'], ['💳', 'Crédito'], ['💳', 'Débito'], ['🍽️', 'Vale-refeição'], ['🛒', 'Vale-alimentação'], ['💵', 'Dinheiro']];
  const selo = back((t - 2.6) / .4);
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('FORMAS DE PAGAMENTO')}${TAG()}
      <div class="abs" style="left:40px;right:40px;top:86px;display:grid;grid-template-columns:1fr 1fr;gap:16px">${P.map(([ic, tx], j) => { const k = back((t - .4 - j * .25) / .35);
        return `<div style="height:80px;display:flex;align-items:center;gap:14px;padding:0 20px;border-radius:20px;background:rgba(255,255,255,.08);opacity:${clamp(k)};transform:scale(${clamp(k, 0, 1.06)})">
          <span style="font-size:32px">${ic}</span><b style="font-size:28px;flex:1">${tx}</b><span style="width:40px;height:40px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:22px;font-weight:800">✓</span></div>`; }).join('')}</div>
      ${selo > 0 ? `<div class="abs" style="left:0;right:0;top:400px;text-align:center"><span style="display:inline-block;padding:12px 28px;border-radius:30px;background:#fff;color:#C3101F;font-weight:800;font-size:28px;transform:scale(${clamp(selo, 0, 1.1)})">🍽️ Aceitamos todos os vales</span></div>` : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['Mostra como', '*ele pode pagar*'], { y: 900, max: 180, ini: 2 })}
  ${K.corpo(t, 3.2, 'Quem já sabe que você aceita <b>Pix, cartão e vale</b> não fica com dúvida e não vai embora.', 1110, { fs: 33 })}
  ${K.rodape(t, 3.8)}`; });

// 5 · aberto agora + como chegar: o selo muda sozinho e o botão abre a rota (EXEMPLO)
slide(6.5, [[0, 'red'], [3.0, 'black']], t => {
  const H = [['Seg a sex', '8h às 18h'], ['Sábado', '8h às 13h'], ['Domingo', 'Fechado']], rota = eio((t - 2.4) / 1.4), pulso = 1 + .06 * Math.sin(t * 5);
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('HORÁRIO E ENDEREÇO')}${TAG()}
      <div class="abs" style="left:40px;top:84px;display:inline-flex;align-items:center;gap:12px;padding:12px 24px;border-radius:30px;background:rgba(37,211,102,.18);color:#4BE38A;font-weight:800;font-size:30px;transform:scale(${back((t - .4) / .4)})">
        <i style="width:18px;height:18px;border-radius:50%;background:#25D366;box-shadow:0 0 ${10 + 8 * Math.sin(t * 5)}px #25D366"></i>Aberto agora · fecha às 18h</div>
      ${H.map(([d, h], j) => { const k = ease((t - .8 - j * .2) / .35); return `<div class="abs" style="left:40px;width:400px;top:${178 + j * 62}px;display:flex;justify-content:space-between;font-size:28px;opacity:${k}"><b>${d}</b><span style="color:rgba(255,255,255,.75)">${h}</span></div>`; }).join('')}
      <div class="abs" style="left:490px;top:96px;width:410px;height:290px;border-radius:24px;overflow:hidden;background:${K.verm ? 'rgba(90,0,10,.6)' : 'rgba(255,255,255,.06)'}">
        <svg width="410" height="290">${[[0, 70, 410, 50], [0, 200, 410, 230], [90, 0, 120, 290], [280, 0, 250, 290]].map(([a, b, c, d]) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="rgba(255,255,255,.15)" stroke-width="10"/>`).join('')}
          <path d="M60 250 L110 205 L250 215 L270 120 L330 90" fill="none" stroke="${VIVA()}" stroke-width="8" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="${520 * (1 - rota)}" style="filter:drop-shadow(0 0 10px ${VIVA()})"/>
          <circle cx="60" cy="250" r="12" fill="#fff"/>${rota > .95 ? `<circle cx="330" cy="90" r="16" fill="${VIVA()}"/>` : ''}</svg>
        ${rota > .2 ? `<div class="abs" style="right:14px;bottom:14px;padding:8px 16px;border-radius:16px;background:#fff;color:#111;font-weight:800;font-size:22px;opacity:${ease((rota - .2) * 3)}">🚗 12 min</div>` : ''}</div>
      <div class="abs" style="left:40px;top:400px;padding:16px 30px;border-radius:30px;background:#fff;color:#C3101F;font-weight:800;font-size:28px;transform:scale(${t > 1.8 && t < 2.4 ? pulso : 1})">📍 Como chegar</div>
      ${t > 1.4 && t < 2.5 ? cursor(lerp(700, 200, eio((t - 1.4) / .6)), lerp(470, 420, eio((t - 1.4) / .6)), clamp((t - 2.1) / .25)) : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['Aberto agora?', '*Ele já sabe*'], { y: 900, max: 180, ini: 4 })}
  ${K.corpo(t, 3.2, 'Horário que se atualiza e um toque pra abrir a rota. <b>O cliente sai de casa certo de que vai te achar.</b>', 1110, { fs: 32 })}
  ${K.rodape(t, 3.8)}`; });

// 4 · pedido de orçamento: o formulário se preenche, envia e chega o aviso pro dono (EXEMPLO)
slide(7, [[0, 'black'], [3.6, 'red']], t => {
  const F = [['Nome', 'Carla Souza'], ['WhatsApp', '(62) 9 0000-0000'], ['O que você precisa?', 'Bolo pra 40 pessoas, dia 15']];
  const env = back((t - 2.9) / .35), noti = back((t - 3.5) / .45);
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('PEÇA SEU ORÇAMENTO')}${TAG()}
      ${F.map(([r, v], j) => { const t0 = .5 + j * .7, n = Math.floor(clamp((t - t0) / .55) * v.length);
        return `<div class="abs" style="left:40px;right:40px;top:${82 + j * 98}px"><div style="font-weight:700;font-size:21px;color:rgba(255,255,255,.65)">${r}</div>
          <div style="margin-top:6px;height:56px;padding:0 20px;display:flex;align-items:center;border-radius:16px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,${t > t0 && t < t0 + .7 ? .6 : .12});font-size:27px">${v.slice(0, n)}</div></div>`; }).join('')}
      <div class="abs" style="left:40px;top:392px;padding:16px 36px;border-radius:30px;background:${t > 2.9 ? '#25D366' : '#fff'};color:${t > 2.9 ? '#06301A' : '#C3101F'};font-weight:800;font-size:28px;transform:scale(${t > 2.7 && t < 2.9 ? .94 : 1})">${t > 2.9 ? '✓ Pedido enviado' : 'Enviar pedido'}</div>
      ${noti > 0 ? `<div class="abs" style="right:30px;top:376px;width:420px;padding:16px 20px;border-radius:22px;background:#fff;color:#111;box-shadow:0 20px 50px rgba(0,0,0,.45);transform:translateY(${(1 - clamp(noti)) * 40}px) scale(${clamp(noti, 0, 1.05)})">
        <b style="font-size:22px">🔔 Novo orçamento pelo site</b><div style="font-size:21px;color:#444;margin-top:4px">Carla · Bolo pra 40 pessoas</div></div>` : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['Orçamento chega', '*organizado*'], { y: 900, max: 175, ini: 3 })}
  ${K.corpo(t, 4.0, 'O cliente manda tudo que você precisa saber <b>de uma vez</b>. Nada de dez mensagens pra entender o pedido.', 1110, { fs: 32 })}
  ${K.rodape(t, 4.6)}`; });

// 7 · final aprovado
slide(6.5, [[0, 'black'], [1.4, 'red']], t => {
  const it = ['📱 Perfeito no celular', '🔒 Seu nome no endereço', '💳 Jeitos de pagar claros', '🟢 Aberto agora', '📝 Orçamento organizado', '🤝 Cliente que paga tranquilo'];
  return `<div class="abs" style="left:70px;top:170px;width:940px;display:grid;grid-template-columns:1fr 1fr;gap:20px">${it.map((x, j) => { const k = back((t - .3 - j * .15) / .4);
      return `<div style="padding:26px 22px;${K.vidro()}border-radius:28px;font-weight:800;font-size:29px;display:flex;justify-content:space-between;align-items:center;gap:10px;transform:scale(${clamp(k, 0, 1.1)});opacity:${clamp(k)}">${x}<span style="flex-shrink:0;width:46px;height:46px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:28px;transform:scale(${back((t - .6 - j * .15) / .3)})">✓</span></div>`; }).join('')}</div>
  ${K.kick(t, 1.4, 'SITE PROFISSIONAL', 655)}${K.kin(t, 1.6, ['Quer isso', '*no seu site?*'], { y: 900, max: 185, ini: 6 })}
  ${K.corpo(t, 2.6, 'Dá uma olhada na <b>minha bio</b>: tem tudo lá. 👆', 1110, { fs: 38 })}
  <div class="abs" style="left:0;right:0;bottom:44px;text-align:center;opacity:${ease((t - 3.2) / .4)};font-weight:800;font-size:24px;letter-spacing:.2em;color:rgba(255,255,255,.8)">OLHA A BIO DO @EUAUGUSTO_OLIV 👆</div>`; });

window.SLIDES = S;
window.mostrar = (i, t) => { const s = S[i]; const f = K.fundo(t, s.trocas); document.getElementById('st').innerHTML = f + s.render(t) + K.topo(i + 1, TOTAL, t, s.dur); };
window.mostrar(0, 0);
</script></body></html>
