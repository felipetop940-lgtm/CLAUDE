<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 52 ANIMADO (1080x1350, cada slide é um vídeo) · "Como responder todo mundo na Black Friday" · estilo CINÉTICO, formato do ajuste de 14/11
     Título ensinando EM CIMA (conversas não lidas subindo, menor embaixo, EXEMPLO); 4 DICAS: mensagem de saudação com as ofertas, 3 respostas prontas (frete, pagamento, troca), coleção "Black Friday" no catálogo, pedido fechado numa mensagem só;
     ligação com o site (perguntas frequentes respondidas antes) + final aprovado. Fontes: Sebrae/RS via Mix Vale 18/11, mLabs, Bizu, Central do Varejo. Dados de exemplo marcados EXEMPLO.
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c52-mensagens-black-friday -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-weight: 600; src: url("../fontes/playfair-600.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-style: italic; font-weight: 600; src: url("../fontes/playfair-600-italic.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script src="../animado/mockups.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7;
const S = [], slide = (dur, trocas, render) => S.push({ dur, trocas, render });
const CARD = (x, y, w, h, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${K.vidro()}overflow:hidden;${extra}`;
// setinha do mouse; k = clique (0..1)
const cursor = (x, y, k = 0) => `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="40" height="56"><g transform="scale(${1 - .15 * Math.sin(clamp(k) * Math.PI)})">
  <path d="M0 0 L0 44 L11 34 L19 52 L28 48 L20 30 L35 30 Z" fill="#fff" stroke="#0B0B0D" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const onda = (x, y, k, cor = '#fff') => k > 0 && k < 1 ? `<div class="abs" style="left:${x - 60 * k}px;top:${y - 60 * k}px;width:${120 * k}px;height:${120 * k}px;border-radius:50%;border:4px solid ${cor};opacity:${1 - k}"></div>` : '';
const FEITO = (t) => K.kick(t, .1, 'NO SEU SITE', 655);

const TAG = (x = 36, y = 28) => `<div class="abs" style="right:${x}px;top:${y}px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>`;
const ROT = txt => `<div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">${txt}</div>`;

const VIVA = () => K.verm ? '#fff' : '#FF2E43';

// ---------- celular com a tela do WhatsApp Business (tema escuro) ----------
const ZB = '#0B141A', ZH = '#1F2C34', ZT = '#E9EDEF', ZS = '#8696A0', ZG = '#00A884';
const FONE = (t, inner) => { const inn = ease(t / .6);
  return `<div class="abs" style="left:110px;top:112px;width:344px;height:600px;border-radius:52px;background:#0B0B0D;padding:12px;box-shadow:0 0 0 3px rgba(255,255,255,.25), 0 50px 100px -30px rgba(0,0,0,.9);opacity:${inn};transform:translateY(${(1 - inn) * 40}px) rotate(-2deg)">
    <div style="width:320px;height:576px;border-radius:42px;overflow:hidden;position:relative;background:${ZB};font-family:IT,sans-serif;color:${ZT}">${inner}</div>
    <div style="position:absolute;left:50%;top:22px;width:90px;height:24px;margin-left:-45px;border-radius:12px;background:#0B0B0D"></div></div>`; };
const TOPO = (tit, sub = '') => `<div style="height:104px;padding:50px 20px 0;background:${ZH};display:flex;align-items:center;gap:14px"><span style="font-size:26px;color:${ZS}">←</span><div><b style="font-size:23px">${tit}</b>${sub ? `<div style="font-size:15px;color:${ZS}">${sub}</div>` : ''}</div></div>`;
// lista de opções; sel = índice tocado, k = progresso do toque
const LISTA = (itens, sel = -1, k = 0) => itens.map(([ic, tx, sub], j) => `<div style="display:flex;align-items:center;gap:14px;padding:15px 20px;position:relative;background:${j === sel && k > 0 ? `rgba(0,168,132,${.28 * Math.sin(clamp(k) * Math.PI) + (k >= 1 ? .14 : 0)})` : 'transparent'}">
    <span style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:21px">${ic}</span><div><div style="font-size:19px;font-weight:600">${tx}</div>${sub ? `<div style="font-size:14px;color:${ZS}">${sub}</div>` : ''}</div></div>`).join('');
const CHAVE = (on) => `<span style="flex-shrink:0;width:52px;height:30px;border-radius:15px;background:${on > .5 ? ZG : '#3B4A54'};position:relative"><span style="position:absolute;top:4px;left:${4 + 22 * clamp(on)}px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span>`;
// passos do lado direito (o caminho dentro do app), cada um entra com ✓
const PASSOS = (t, L, t0 = .5, dt = .55) => L.map((tx, j) => { const k = back((t - t0 - j * dt) / .4), ok = back((t - t0 - j * dt - .3) / .3);
  return k <= 0 ? '' : `<div class="abs" style="left:500px;width:480px;top:${150 + j * 112}px;padding:18px 22px;${K.vidro()}border-radius:24px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:25px;line-height:1.2;opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 70}px)">
    <span style="flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-family:Anton;font-size:22px;transform:scale(${clamp(ok, 0, 1.15)})">${j + 1}</span>${tx}</div>`; }).join('');
const FERR = [['🏪', 'Perfil comercial'], ['🛍️', 'Catálogo'], ['💤', 'Mensagem de ausência'], ['👋', 'Mensagem de saudação'], ['⚡', 'Respostas rápidas']];
const DICA = (t, n, tit, txt, ini) => `${K.kick(t, .1, 'DICA ' + n, 736)}${K.kin(t, .3, tit, { y: 978, max: 148, ini })}${K.corpo(t, 3.0, txt, 1150, { fs: 31 })}${K.rodape(t, 3.6)}`;

// tela de app de banco genérico (sem marca)
const BB = '#111316', BH = '#1B1F24', BA = '#21C38B', BT = '#F2F4F5', BS = '#8B95A1';
const BTOPO = (tit) => `<div style="height:100px;padding:48px 20px 0;background:${BH};display:flex;align-items:center;gap:14px"><span style="font-size:24px;color:${BS}">←</span><b style="font-size:22px;color:${BT}">${tit}</b></div>`;
const BANCO = (inner) => `<div style="position:absolute;inset:0;background:${BB};color:${BT}">${inner}</div>`;
const EXE = `<div style="position:absolute;right:16px;bottom:12px;font-size:12px;color:${BS};letter-spacing:.12em;font-weight:800">EXEMPLO</div>`;

// 1 · gancho: TÍTULO em cima ensinando; embaixo, menor, as conversas não lidas subindo e as mesmas perguntas chegando (EXEMPLO)
slide(7, [[0, 'black'], [3.0, 'red']], t => {
  const inn = ease((t - 1.0) / .6), n = Math.round(lerp(3, 47, eio((t - 1.3) / 2.2)));
  const P = [['Ana', 'Tem frete pra Aparecida?'], ['Lucas', 'Aceita Pix?'], ['Bia', 'Se não servir, dá pra trocar?']];
  return `${K.kin(t, .05, ['Como responder todo mundo', '*na Black Friday*'], { y: 300, max: 165 })}
    ${K.corpo(t, 1.0, 'Cliente que espera demais desiste. Arrasta e vê <b>4 dicas</b> pra dar conta das mensagens.', 470, { fs: 34 })}
    <div style="${CARD(130, 640, 820, 420, `opacity:${.92 * inn};transform:translateY(${(1 - inn) * 40}px)`)}">${ROT('SEU WHATSAPP NA BLACK FRIDAY')}${TAG(30, 360)}
      <div class="abs" style="right:36px;top:22px;padding:6px 16px;border-radius:20px;background:#25D366;color:#06301A;font-weight:800;font-size:22px">${n} não lidas</div>
      ${P.map(([nm, tx], j) => { const k = back((t - 1.6 - j * .5) / .4);
        return `<div class="abs" style="left:36px;right:36px;top:${90 + j * 76}px;height:62px;display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:16px;background:rgba(255,255,255,.08);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 60}px)">
          <span style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800">${nm[0]}</span><b style="font-size:20px;width:70px">${nm}</b><span style="font-size:20px;color:rgba(255,255,255,.85);flex:1">${tx}</span>
          <span style="width:30px;height:30px;border-radius:50%;background:#25D366;color:#06301A;display:grid;place-items:center;font-size:15px;font-weight:800">${j + 2}</span></div>`; }).join('')}</div>
    <div class="abs" style="left:0;right:0;bottom:46px;text-align:center;opacity:${ease((t - 3.6) / .4)}"><span style="display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:40px;background:${K.verm ? '#fff' : '#FF2E43'};color:${K.verm ? '#C3101F' : '#fff'};font-family:Anton;font-size:34px;letter-spacing:.06em;box-shadow:0 0 ${30 + 14 * Math.sin(t * 4)}px rgba(255,255,255,.35)">ARRASTA <span style="display:inline-block;transform:translateX(${Math.sin(t * 4) * 14}px)">→</span></span></div>`; });

// 2 · DICA 1 · mensagem de saudação já com as ofertas (EXEMPLO)
slide(7.5, [[0, 'black'], [3.4, 'red']], t => {
  const tela2 = t > 1.7, on = clamp((t - 2.0) / .25), msg = 'Oi! 🖤 Bem-vindo à nossa Black Friday! Veja as ofertas no catálogo e me diga o que você quer. Respondo em até 1 hora!', n = Math.floor(clamp((t - 2.3) / 1.4) * msg.length);
  const inner = !tela2 ? TOPO('Ferramentas comerciais') + LISTA(FERR, 3, clamp((t - 1.1) / .5)) + (t > 1.0 && t < 1.7 ? onda(160, 450, clamp((t - 1.1) / .5), ZG) : '')
    : TOPO('Mensagem de saudação') + `<div style="padding:16px 20px">
        <div style="display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600">Enviar mensagem de saudação<span style="margin-left:auto"></span>${CHAVE(on)}</div>
        <div style="margin-top:18px;font-size:14px;color:${ZG};font-weight:700">MENSAGEM</div>
        <div style="margin-top:8px;min-height:130px;padding:14px 16px;border-radius:14px;background:#005C4B;font-size:17px;line-height:1.35;opacity:${clamp(on * 2)}">${msg.slice(0, n)}</div>
        <div style="margin-top:12px;font-size:14px;color:${ZS}">Vai pra quem chama pela primeira vez ou depois de 14 dias</div>
        <div style="margin-top:10px;text-align:right;font-size:12px;color:${ZS};letter-spacing:.12em;font-weight:800">EXEMPLO</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['⋮ › Ferramentas comerciais', 'Mensagem de saudação', 'Escreve: ofertas + catálogo + prazo', 'Promete só o prazo que você cumpre'])}
  ${DICA(t, 1, ['Saudação já com', '*as ofertas*'], 'O cliente chega e já sabe <b>onde olhar e quando você responde.</b>', 1)}`; });

// 3 · DICA 2 · as 3 respostas prontas: frete, pagamento e troca (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const R = [['/frete', 'Entregamos em Goiânia e região no mesmo dia. Frete grátis acima de R$ 100 🛵'], ['/pagamento', 'Aceitamos Pix, crédito e débito 💳'], ['/troca', 'Troca em até 7 dias com a nota 🔁']];
  const inner = TOPO('Respostas rápidas') + `<div style="padding:12px 18px">${R.map(([a, r], j) => { const k = back((t - .6 - j * .55) / .4);
      return `<div style="margin-bottom:12px;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 40}px)"><b style="font-size:18px;color:${ZG}">${a}</b><div style="margin-top:4px;font-size:15px;line-height:1.35;color:${ZT}">${r}</div></div>`; }).join('')}
      <div style="margin-top:6px;text-align:right;font-size:12px;color:${ZS};letter-spacing:.12em;font-weight:800">EXEMPLO</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['⋮ › Ferramentas comerciais', 'Respostas rápidas › +', 'Cria /frete, /pagamento e /troca'])}
  ${DICA(t, 2, ['As 3 respostas', '*que todo mundo pede*'], 'Frete, pagamento e troca: <b>é o que mais perguntam</b> na Black Friday.', 3)}`; });

// 4 · DICA 3 · coleção "Black Friday" no catálogo (EXEMPLO)
slide(7, [[0, 'black'], [3.4, 'red']], t => {
  const L = [['🎂', 'Bolo de chocolate', 'R$ 72', 'R$ 90'], ['🍫', 'Brigadeiro (cento)', 'R$ 96', 'R$ 120'], ['🥥', 'Beijinho (cento)', 'R$ 96', 'R$ 120'], ['🍓', 'Bolo de morango', 'R$ 88', 'R$ 110']];
  const inner = TOPO('Catálogo', 'Doce Ana') + `<div style="padding:14px 16px">
      <div style="display:inline-block;padding:6px 14px;border-radius:14px;background:#111;border:1px solid #444;font-weight:800;font-size:15px;transform:scale(${back((t - .5) / .4)})">🖤 Coleção BLACK FRIDAY</div>
      <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px">${L.map(([ic, n, v, de], j) => { const k = back((t - 1.0 - j * .35) / .4);
        return `<div style="padding:10px;border-radius:12px;background:${ZH};opacity:${clamp(k)};transform:scale(${clamp(k, 0, 1.06)})"><div style="height:74px;border-radius:8px;background:#2A3942;display:grid;place-items:center;font-size:40px">${ic}</div><div style="font-size:14px;font-weight:600;margin-top:6px;line-height:1.2">${n}</div><div style="font-size:13px;color:${ZS};text-decoration:line-through">${de}</div><div style="font-size:16px;color:${ZG};font-weight:800">${v}</div></div>`; }).join('')}</div>
      <div style="margin-top:8px;text-align:right;font-size:12px;color:${ZS};letter-spacing:.12em;font-weight:800">EXEMPLO</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['⋮ › Ferramentas comerciais › Catálogo', 'Adicionar coleção: "Black Friday"', 'Põe só as ofertas, com o preço de antes'])}
  ${DICA(t, 3, ['Coleção Black Friday', '*no catálogo*'], 'Em vez de mandar foto por foto, <b>manda um link com todas as ofertas.</b>', 4)}`; });

// 5 · DICA 4 · fecha o pedido numa mensagem só: o modelo vai e volta preenchido (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const inner = TOPO('Lucas M.', 'online') + `<div style="padding:16px">
      <div style="margin-left:auto;max-width:88%;padding:12px 14px;border-radius:14px 4px 14px 14px;background:#005C4B;font-size:15px;line-height:1.45;transform:scale(${back((t - .5) / .4)});transform-origin:100% 0">Pra fechar, me manda assim 👇<br>• Nome:<br>• Produto:<br>• Entrega ou retirada:<br>• Pagamento:</div>
      ${t > 1.8 ? `<div style="margin-top:12px;max-width:80%;padding:12px 14px;border-radius:4px 14px 14px 14px;background:${ZH};font-size:15px;line-height:1.45;transform:scale(${back((t - 1.8) / .4)});transform-origin:0 0">• Nome: Lucas<br>• Produto: 1 bolo de chocolate<br>• Entrega: Setor Bueno<br>• Pagamento: Pix</div>` : ''}
      ${t > 2.9 ? `<div style="margin-top:12px;text-align:center"><span style="display:inline-block;padding:8px 16px;border-radius:16px;background:${ZG};color:#06301A;font-weight:800;font-size:15px;transform:scale(${back((t - 2.9) / .35)})">✓ Pedido fechado em 2 mensagens</span></div>` : ''}
      <div style="margin-top:10px;text-align:right;font-size:12px;color:${ZS};letter-spacing:.12em;font-weight:800">EXEMPLO</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['Salva um modelo de pedido', 'Manda quando o cliente decidir', 'Ele preenche tudo de uma vez'])}
  ${DICA(t, 4, ['Fecha o pedido', '*numa mensagem só*'], 'Sem vai e vem de pergunta, <b>você atende mais gente no mesmo tempo.</b>', 2)}`; });

// 6 · ligação com o site: frete, pagamento e troca respondidos antes (EXEMPLO)
slide(6.5, [[0, 'red'], [3.2, 'black']], t => {
  const P = [['Entrega na minha cidade?', 'Sim! Goiânia e região, no mesmo dia.'], ['Aceita Pix e cartão?', 'Sim, Pix, crédito e débito.'], ['Posso trocar?', 'Pode, em até 7 dias com a nota.']];
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('PERGUNTAS FREQUENTES')}${TAG()}
      ${P.map(([p, r], j) => { const t0 = .6 + j * .8, k = ease((t - t0) / .35), ab = eio((t - t0 - .35) / .4), y = 86 + j * 135;
        return `<div class="abs" style="left:40px;right:40px;top:${y}px;padding:20px 26px;border-radius:22px;background:rgba(255,255,255,.08);opacity:${k};transform:translateY(${(1 - k) * 30}px)">
          <div style="display:flex;justify-content:space-between;font-weight:800;font-size:30px">${p}<span style="display:inline-block;transform:rotate(${ab * 45}deg);font-size:34px;line-height:1">+</span></div>
          <div style="overflow:hidden;height:${ab * 44}px;margin-top:${ab * 8}px;font-size:28px;color:${K.verm ? '#fff' : '#FF8A95'};font-weight:600">${r}</div></div>`; }).join('')}</div>
  ${K.kick(t, .1, 'E O SEU SITE?', 655)}${K.kin(t, .3, ['Seu site responde', '*antes de perguntarem*'], { y: 900, max: 175, ini: 5 })}
  ${K.corpo(t, 3.2, 'No site que eu faço, frete, pagamento e troca <b>ficam respondidos antes</b>: o cliente já chama pra comprar.', 1110, { fs: 32 })}
  ${K.rodape(t, 3.8)}`; });

// 7 · final aprovado
slide(6.5, [[0, 'black'], [1.4, 'red']], t => {
  const it = ['❓ Dúvidas respondidas', '🛍️ Catálogo com preço', '💬 Botão do WhatsApp', '💳 Formas de pagamento', '📍 Onde entrega', '🤝 Cliente decidido'];
  return `<div class="abs" style="left:70px;top:170px;width:940px;display:grid;grid-template-columns:1fr 1fr;gap:20px">${it.map((x, j) => { const k = back((t - .3 - j * .15) / .4);
      return `<div style="padding:26px 22px;${K.vidro()}border-radius:28px;font-weight:800;font-size:29px;display:flex;justify-content:space-between;align-items:center;gap:10px;transform:scale(${clamp(k, 0, 1.1)});opacity:${clamp(k)}">${x}<span style="flex-shrink:0;width:46px;height:46px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:28px;transform:scale(${back((t - .6 - j * .15) / .3)})">✓</span></div>`; }).join('')}</div>
  ${K.kick(t, 1.4, 'SITE PROFISSIONAL', 655)}${K.kin(t, 1.6, ['Quer isso', '*no seu site?*'], { y: 900, max: 185, ini: 6 })}
  ${K.corpo(t, 2.6, 'Dá uma olhada na <b>minha bio</b>: tem tudo lá. 👆', 1110, { fs: 38 })}
  <div class="abs" style="left:0;right:0;bottom:44px;text-align:center;opacity:${ease((t - 3.2) / .4)};font-weight:800;font-size:24px;letter-spacing:.2em;color:rgba(255,255,255,.8)">OLHA A BIO DO @EUAUGUSTO_OLIV 👆</div>`; });

window.SLIDES = S;
window.mostrar = (i, t) => { const s = S[i]; const f = K.fundo(t, s.trocas); document.getElementById('st').innerHTML = f + s.render(t) + K.topo(i + 1, TOTAL, t, s.dur); };
window.mostrar(0, 0);
</script></body></html>
