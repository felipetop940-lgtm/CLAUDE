<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 43 ANIMADO (1080x1350, cada slide é um vídeo) · "Seu negócio atende até no domingo" · estilo CINÉTICO focado em SITE
     Postado num sábado. Regras: gancho com promessa + animação coerente (a semana com sábado e domingo acendendo e os pedidos chegando, EXEMPLO), sem imagem de IA, sem falar de IA, sempre "seu/sua", sem o emoji de calendário;
     mapa 3D da região; botão do WhatsApp com mensagem pronta; catálogo com filtro (EXEMPLO); preço claro (EXEMPLO); contatos subindo (EXEMPLO); final aprovado. Sem repetir os slides do c42.
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c43-atende-ate-domingo -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-weight: 600; src: url("../fontes/playfair-600.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-style: italic; font-weight: 600; src: url("../fontes/playfair-600-italic.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script src="../animado/mockups.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7;
const S = [], slide = (dur, trocas, render) => S.push({ dur, trocas, render });
const CARD = (x, y, w, h, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${K.vidro()}overflow:hidden;${extra}`;
// setinha do mouse; k = clique (0..1)
const cursor = (x, y, k = 0) => `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="40" height="56"><g transform="scale(${1 - .15 * Math.sin(clamp(k) * Math.PI)})">
  <path d="M0 0 L0 44 L11 34 L19 52 L28 48 L20 30 L35 30 Z" fill="#fff" stroke="#0B0B0D" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const onda = (x, y, k, cor = '#fff') => k > 0 && k < 1 ? `<div class="abs" style="left:${x - 60 * k}px;top:${y - 60 * k}px;width:${120 * k}px;height:${120 * k}px;border-radius:50%;border:4px solid ${cor};opacity:${1 - k}"></div>` : '';
const FEITO = (t) => K.kick(t, .1, 'NO SEU SITE', 655);

const TAG = (x = 36, y = 28) => `<div class="abs" style="right:${x}px;top:${y}px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>`;
const ROT = txt => `<div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">${txt}</div>`;

const VIVA = () => K.verm ? '#fff' : '#FF2E43';

// 1 · gancho: a semana inteira; sábado e domingo acendem e os pedidos pelo site chegam mesmo com a loja fechada (EXEMPLO)
slide(7, [[0, 'black'], [3.0, 'red']], t => {
  const D = [['SEG', 0], ['TER', 0], ['QUA', 0], ['QUI', 0], ['SEX', 0], ['SÁB', 1], ['DOM', 1]];
  const P = [['🛒', 'Pedido pelo site', 'sábado, 21:40'], ['💬', 'Cliente novo no WhatsApp', 'domingo, 10:15'], ['📝', 'Orçamento recebido', 'domingo, 19:02']];
  return `<div style="${CARD(70, 170, 940, 440)}">${ROT('SUA SEMANA')}${TAG(36, 378)}
      <div class="abs" style="left:40px;right:40px;top:76px;display:flex;gap:12px">${D.map(([d, fds], j) => { const k = ease((t - .2 - j * .06) / .3), acende = fds ? back((t - .9 - (j - 5) * .25) / .4) : 0;
        return `<div style="flex:1;padding:14px 0;border-radius:18px;text-align:center;font-weight:800;font-size:24px;letter-spacing:.08em;opacity:${k};background:${acende > 0 ? '#fff' : 'rgba(255,255,255,.08)'};color:${acende > 0 ? '#C3101F' : 'rgba(255,255,255,.7)'};transform:scale(${fds ? 1 + .06 * clamp(acende) : 1})">${d}</div>`; }).join('')}</div>
      ${P.map(([ic, tx, sub], j) => { const k = back((t - 1.4 - j * .45) / .4), ok = back((t - 1.7 - j * .45) / .3);
        return `<div class="abs" style="left:40px;right:40px;top:${160 + j * 72}px;height:62px;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:18px;background:rgba(255,255,255,.08);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 60}px)">
          <span style="font-size:28px">${ic}</span><b style="font-size:26px;flex:1">${tx}</b><span style="font-size:21px;color:rgba(255,255,255,.7)">${sub}</span>
          <span style="width:38px;height:38px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:21px;font-weight:800;transform:scale(${clamp(ok, 0, 1.15)})">✓</span></div>`; }).join('')}</div>
    ${K.kin(t, .05, ['Seu negócio atende', '*até no domingo*'], { y: 890, max: 175 })}
    ${K.corpo(t, 3.2, 'Arrasta e vê <b>o que trabalha por você enquanto você descansa.</b>', 1095, { fs: 36 })}
    <div class="abs" style="left:0;right:0;bottom:46px;text-align:center;opacity:${ease((t - 3.6) / .4)}"><span style="display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:40px;background:${K.verm ? '#fff' : '#FF2E43'};color:${K.verm ? '#C3101F' : '#fff'};font-family:Anton;font-size:34px;letter-spacing:.06em;box-shadow:0 0 ${30 + 14 * Math.sin(t * 4)}px rgba(255,255,255,.35)">ARRASTA <span style="display:inline-block;transform:translateX(${Math.sin(t * 4) * 14}px)">→</span></span></div>`; });

// 3 · mapa 3D (ajuste dele: mais dinâmico e com 3D): o mapa vem de cima e deita, gira devagar, pino 3D cai com feixe de luz e as cidades sobem
slide(7.5, [[0, 'black'], [3.8, 'red']], t => {
  const tilt = lerp(0, 58, eio((t - .1) / 1.1)), ang = -25 + 9 * t, zoom = lerp(1.25, .98, eio(t / 1.4)), W = 1000, cx = 500, cy = 500;
  const cid = [['Goianira', 380, 330], ['Trindade', 250, 530], ['Senador Canedo', 700, 520], ['Aparecida', 520, 710], ['Anápolis', 790, 250]];
  const ruas = [[0, 180, 1000, 140], [0, 420, 1000, 470], [0, 610, 1000, 560], [0, 820, 1000, 860], [160, 0, 210, 1000], [420, 0, 390, 1000], [640, 0, 700, 1000], [860, 0, 820, 1000], [0, 60, 900, 1000], [250, 0, 1000, 700]];
  const anel = k => { const q = ((t - 1.6) / 1.5 + k) % 1; return t > 1.6 ? `<circle cx="${cx}" cy="${cy}" r="${30 + 330 * q}" fill="none" stroke="${K.viva()}" stroke-width="5" opacity="${.8 * (1 - q)}"/>` : ''; };
  const linhas = cid.map(([, x, y], j) => { const k = eio((t - 2.1 - j * .2) / .5); return `<line x1="${cx}" y1="${cy}" x2="${lerp(cx, x, k)}" y2="${lerp(cy, y, k)}" stroke="#fff" stroke-width="4" stroke-dasharray="14 12" stroke-dashoffset="${-t * 60}" opacity=".75"/>`; }).join('');
  const ergue = (x, y, h) => `position:absolute;left:${x}px;top:${y}px;width:0;height:0;transform-style:preserve-3d;transform:rotateZ(${-ang}deg) rotateX(${-tilt}deg)`;
  const pinos = cid.map(([n, x, y], j) => { const k = back((t - 2.5 - j * .2) / .45);
      return k <= 0 ? '' : `<div style="${ergue(x, y)}"><div style="position:absolute;left:-60px;bottom:0;width:120px;text-align:center;transform:scale(${clamp(k, 0, 1.15)});transform-origin:50% 100%">
        <div style="display:inline-block;padding:6px 14px;border-radius:16px;background:#fff;color:#0B0B0D;font-weight:800;font-size:27px;white-space:nowrap">${n}</div>
        <div style="margin:0 auto;width:4px;height:44px;background:linear-gradient(#fff,rgba(255,255,255,.2))"></div></div></div>`; }).join('');
  const queda = back((t - 1.1) / .55), alt = (1 - clamp(queda)) * 260, feixe = clamp((t - 1.5) / .4) * (.75 + .25 * Math.sin(t * 5));
  const centro = queda > 0 ? `<div style="${ergue(cx, cy)}">
      <div style="position:absolute;left:-22px;bottom:0;width:44px;height:380px;border-radius:22px;background:linear-gradient(to top, ${K.verm ? 'rgba(255,255,255,.45)' : 'rgba(255,46,67,.5)'}, transparent 85%);opacity:${feixe};filter:blur(9px)"></div>
      <div style="position:absolute;left:-55px;bottom:${alt}px;width:110px;height:140px;transform:scale(${clamp(queda, 0, 1.1)});transform-origin:50% 100%">
        <svg width="110" height="140" viewBox="0 0 110 140"><defs><radialGradient id="pg" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="${K.verm ? '#fff' : '#FF6B78'}"/><stop offset="1" stop-color="${K.verm ? '#E7E7EC' : '#B00A1B'}"/></radialGradient></defs>
          <path d="M55 138 C30 100 6 78 6 52 A49 49 0 1 1 104 52 C104 78 80 100 55 138Z" fill="url(#pg)" stroke="#fff" stroke-width="4"/><circle cx="55" cy="52" r="18" fill="${K.verm ? '#C3101F' : '#fff'}"/></svg></div>
      <div style="position:absolute;left:-110px;bottom:${alt + 150}px;width:220px;text-align:center;font-family:Anton;font-size:50px;color:#fff;opacity:${clamp(queda)};text-shadow:0 6px 20px rgba(0,0,0,.6)">GOIÂNIA</div></div>` : '';
  const plano = `<div style="position:absolute;left:${470 - W / 2}px;top:${300 - W / 2}px;width:${W}px;height:${W}px;transform-style:preserve-3d;transform:scale(${zoom}) rotateX(${tilt}deg) rotateZ(${ang}deg)">
      <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%, ${K.verm ? 'rgba(120,0,14,.75)' : 'rgba(40,42,52,.9)'} 0, ${K.verm ? 'rgba(90,0,10,.5)' : 'rgba(20,21,26,.75)'} 55%, transparent 71%)"></div>
      <svg width="${W}" height="${W}" style="position:absolute;inset:0">
        ${ruas.map(([a, b, c, d], j) => `<line x1="${a}" y1="${b}" x2="${lerp(a, c, eio((t - j * .06) / .9))}" y2="${lerp(b, d, eio((t - j * .06) / .9))}" stroke="rgba(255,255,255,.16)" stroke-width="${j % 3 ? 4 : 10}" stroke-linecap="round"/>`).join('')}
        ${anel(0)}${anel(.5)}${linhas}
        ${cid.map(([, x, y], j) => { const k = back((t - 2.5 - j * .2) / .4); return k > 0 ? `<circle cx="${x}" cy="${y}" r="${14 * clamp(k, 0, 1.2)}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${30 * clamp(k)}" fill="none" stroke="#fff" stroke-width="3" opacity=".5"/>` : ''; }).join('')}</svg>
      ${pinos}${centro}</div>`;
  return `<div class="abs" style="left:70px;top:130px;width:940px;height:520px;perspective:1300px;perspective-origin:50% 20%;overflow:hidden;-webkit-mask-image:radial-gradient(ellipse 75% 85% at 50% 50%, #000 60%, transparent 100%)">${plano}</div>
    <div class="abs" style="left:0;right:0;top:560px;text-align:center;${K.surge(back((t - 3.8) / .45))}"><span style="display:inline-block;padding:14px 30px;border-radius:34px;background:#fff;color:#C3101F;font-weight:800;font-size:31px;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)">📍 Atendemos Goiânia e região</span></div>
  ${K.kick(t, .1, 'NO SEU SITE', 660)}${K.kin(t, .3, ['Mostra onde', '*você atende*'], { y: 925, max: 165, ini: 3 })}
  ${K.corpo(t, 4.4, 'Em vez de só escrever o endereço: <b>mapa 3D com sua cidade e região.</b>', 1120, { fs: 34 })}
  ${K.rodape(t, 5)}`; });


// 7 · botão que já abre o WhatsApp com a mensagem pronta
slide(7, [[0, 'black'], [3.4, 'red']], t => {
  const msg = 'Olá! Vi seu site e quero encomendar um bolo pra sábado 🎂', troca = eio((t - 1.9) / .5), n = Math.floor(clamp((t - 2.4) / .7) * msg.length), env = t > 3.4;
  const site = `<div class="abs" style="inset:0;transform:translateX(${-troca * 100}%);padding:40px">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-family:Anton;font-size:40px">DOCE ANA</b><span style="font-size:22px;color:rgba(255,255,255,.6)">Cardápio · Preços · Onde fica</span></div>
      <div style="margin-top:46px;font-weight:800;font-size:56px;line-height:1.08">Bolo de festa por<br>encomenda em Goiânia</div>
      <div style="margin-top:34px;display:inline-flex;align-items:center;gap:14px;padding:22px 40px;border-radius:44px;background:#25D366;color:#06301A;font-weight:800;font-size:32px;transform:scale(${(1 + .04 * Math.sin(t * 6)) * (1 - .08 * Math.sin(clamp((t - 1.5) / .3) * Math.PI))});box-shadow:0 0 ${30 + 20 * Math.sin(t * 6)}px rgba(37,211,102,.6)">💬 Pedir pelo WhatsApp</div></div>`;
  const zap = `<div class="abs" style="inset:0;transform:translateX(${(1 - troca) * 100}%);display:flex;flex-direction:column;background:#0B141A">
      <div style="display:flex;align-items:center;gap:16px;padding:22px 28px;background:#1F2C34"><div style="width:54px;height:54px;border-radius:50%;background:#D6B36C;color:#111;display:grid;place-items:center;font-family:Anton;font-size:26px">DA</div><b style="font-size:29px">Doce Ana</b></div>
      <div style="flex:1;padding:24px 28px">${env ? `<div style="margin-left:auto;max-width:80%;padding:18px 22px;border-radius:20px 20px 6px 20px;background:#005C4B;font-size:28px;line-height:1.3;transform:scale(${back((t - 3.4) / .35)});transform-origin:100% 100%">${msg}<div style="text-align:right;font-size:20px;color:#9FC9BD;margin-top:4px">✓✓</div></div>` : ''}</div>
      <div style="display:flex;gap:12px;padding:14px 20px 22px"><div style="flex:1;min-height:62px;padding:16px 22px;border-radius:31px;background:#1F2C34;font-size:25px;color:${env ? '#8696A0' : '#E9EDEF'}">${env ? 'Mensagem' : msg.slice(0, n)}</div><div style="width:62px;height:62px;border-radius:50%;background:#00A884;display:grid;place-items:center;font-size:28px">➤</div></div></div>`;
  return `<div style="${CARD(70, 140, 940, 480)}">${site}${zap}${t > .6 && t < 1.9 ? cursor(lerp(700, 330, eio((t - .6) / .8)), lerp(440, 330, eio((t - .6) / .8)), clamp((t - 1.5) / .3)) : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['Um clique', '*e cai no WhatsApp*'], { y: 900, max: 175, ini: 5 })}
  ${K.corpo(t, 4.0, 'O botão já abre a conversa com a <b>mensagem pronta</b>. O cliente nem precisa pensar no que escrever.', 1110, { fs: 33 })}
  ${K.rodape(t, 4.6)}`; });

// 3 · catálogo com filtro: o cliente toca na categoria e só aparece o que ele quer (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const cats = ['Todos', 'Bolos', 'Doces', 'Salgados'], sel = t < 1.6 ? 0 : t < 3.2 ? 1 : 2;
  const L = [['🎂', 'Bolo de chocolate', 'R$ 90', 1], ['🍓', 'Bolo de morango', 'R$ 110', 1], ['🍫', 'Brigadeiro (cento)', 'R$ 120', 2], ['🥥', 'Beijinho (cento)', 'R$ 120', 2], ['🥟', 'Coxinha (cento)', 'R$ 95', 3], ['🧀', 'Pão de queijo (kg)', 'R$ 45', 3]];
  const vis = L.filter(x => sel === 0 || x[3] === sel).slice(0, 4), troca = sel === 0 ? ease((t - .4) / .4) : ease((t - (sel === 1 ? 1.6 : 3.2)) / .4);
  const cx = t < 1.6 ? lerp(700, 330, eio((t - .9) / .6)) : lerp(330, 500, eio((t - 2.5) / .6)), cy = 128;
  return `<div style="${CARD(70, 140, 940, 500)}">${ROT('CARDÁPIO')}${TAG()}
      <div class="abs" style="left:40px;top:80px;display:flex;gap:12px">${cats.map((c, j) => `<span style="padding:10px 24px;border-radius:26px;font-weight:800;font-size:26px;background:${j === sel ? '#fff' : 'rgba(255,255,255,.1)'};color:${j === sel ? '#C3101F' : '#fff'}">${c}</span>`).join('')}</div>
      <div class="abs" style="left:40px;right:40px;top:160px;display:grid;grid-template-columns:1fr 1fr;gap:16px">${vis.map(([ic, n, v], j) => { const k = ease((troca - j * .12) / .6);
        return `<div style="height:140px;padding:18px 20px;border-radius:22px;background:rgba(255,255,255,.08);opacity:${k};transform:scale(${.9 + .1 * k})"><div style="font-size:44px">${ic}</div><b style="display:block;font-size:26px;margin-top:6px">${n}</b><span style="font-family:Anton;font-size:30px;color:${K.verm ? '#fff' : '#FF2E43'}">${v}</span></div>`; }).join('')}</div>
      ${t > .9 && t < 3.0 ? cursor(cx, cy + 30, t < 1.7 ? clamp((t - 1.4) / .25) : clamp((t - 2.9) / .25)) : ''}</div>
  ${FEITO(t)}${K.kin(t, .3, ['O cliente acha', '*o que quer*'], { y: 900, max: 175, ini: 2 })}
  ${K.corpo(t, 3.6, 'Cardápio ou catálogo com <b>filtro e preço</b>: o cliente escolhe sozinho e já chega sabendo o que quer.', 1110, { fs: 32 })}
  ${K.rodape(t, 4.2)}`; });

// 5 · preços claros (EXEMPLO): menos "quanto é?" no WhatsApp
slide(6.5, [[0, 'black'], [3.0, 'red']], t => {
  const L = [['✂️', 'Corte', 'R$ 45'], ['💇', 'Escova', 'R$ 60'], ['🎨', 'Coloração', 'R$ 120'], ['👰', 'Pacote noiva', 'sob consulta']];
  const pergunta = back((t - .4) / .4), risca = ease((t - 2.4) / .4);
  return `<div style="${CARD(70, 140, 940, 500)}">
      <div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">SERVIÇOS E VALORES</div>
      <div class="abs" style="right:36px;top:28px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>
      ${L.map(([ic, n, v], j) => { const k = ease((t - .7 - j * .3) / .45);
        return `<div class="abs" style="left:40px;right:40px;top:${90 + j * 92}px;height:76px;display:flex;align-items:center;gap:18px;padding:0 22px;border-radius:18px;background:rgba(255,255,255,.07);opacity:${k};transform:translateX(${(1 - k) * -60}px)">
          <span style="font-size:36px">${ic}</span><b style="font-size:30px">${n}</b><span style="margin-left:auto;font-family:Anton;font-size:36px;color:${K.verm ? '#fff' : '#FF2E43'}">${v}</span></div>`; }).join('')}</div>
    ${pergunta > 0 ? `<div class="abs" style="right:90px;top:600px;padding:14px 22px;border-radius:22px 22px 6px 22px;background:#005C4B;font-size:28px;font-weight:600;transform:scale(${clamp(pergunta, 0, 1.1)})">Quanto é? 🤔
      <div style="position:absolute;left:10px;right:10px;top:50%;height:5px;background:#fff;transform:scaleX(${risca});transform-origin:0 50%"></div></div>` : ''}
  ${K.kick(t, .1, 'NO SEU SITE', 690)}${K.kin(t, .3, ['Preço claro,', '*menos pergunta*'], { y: 925, max: 170, ini: 3 })}
  ${K.corpo(t, 3.2, 'Cliente que já sabe o valor chega decidido. <b>Você para de responder "quanto é?" o dia todo.</b>', 1112, { fs: 32 })}
  ${K.rodape(t, 3.8)}`; });


// 6 · resultado: contatos pelo site subindo mês a mês (EXEMPLO)
slide(7, [[0, 'black'], [3.6, 'red']], t => `${K.linha(t, { x: 70, y: 140, w: 940, h: 500, rotulo: 'CONTATOS PELO SITE POR MÊS', tag: 'EXEMPLO', prefixo: '', casas: 0, sem_chip: true, min: 0, max: 60,
    pontos: [{ rot: 'MÊS 1', v: 8, t: 0 }, { rot: 'MÊS 2', v: 17, t: 1.0 }, { rot: 'MÊS 3', v: 29, t: 2.0 }, { rot: 'MÊS 4', v: 46, t: 3.0 }] })}
  ${FEITO(t)}${K.kin(t, .3, ['Cliente chegando', '*todo mês*'], { y: 900, max: 175, ini: 5 })}
  ${K.corpo(t, 3.6, 'Site bem feito trabalha <b>todo dia</b>, até quando você tá atendendo ou dormindo.', 1110, { fs: 34 })}
  ${K.rodape(t, 4.2)}`);

// 7 · final aprovado
slide(6.5, [[0, 'black'], [1.4, 'red']], t => {
  const it = ['📍 Mapa da sua região', '💬 Pedido no WhatsApp', '🛍️ Catálogo com filtro', '🏷️ Preço claro', '📈 Cliente todo mês', '🌙 Atende até no domingo'];
  return `<div class="abs" style="left:70px;top:170px;width:940px;display:grid;grid-template-columns:1fr 1fr;gap:20px">${it.map((x, j) => { const k = back((t - .3 - j * .15) / .4);
