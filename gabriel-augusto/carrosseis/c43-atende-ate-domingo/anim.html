<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Carrossel 43 ANIMADO v2 (1080x1350, cada slide é um vídeo) · "Como fazer seu negócio atender até no domingo" · estilo CINÉTICO
     Ajuste do Felipe (14/11): no gancho o TÍTULO fica em cima e é o destaque (o gráfico fica menor embaixo, sem roubar a atenção); título ENSINA ("Como fazer..."); os slides do meio são DICAS úteis de verdade
     (WhatsApp Business: mensagem de ausência, horário no perfil, respostas rápidas, catálogo), e no fim a ligação com o site que o Gabriel faz (botão do WhatsApp com mensagem pronta) + final aprovado.
     Render: PWPATH=$(npm root -g)/playwright node animado/render-anim.js c43-atende-ate-domingo -->
<style>
@font-face { font-family: "IT"; font-weight: 400 800; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("../../shorts/ferramentas/fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-weight: 600; src: url("../fontes/playfair-600.woff2") format("woff2"); }
@font-face { font-family: "PF"; font-style: italic; font-weight: 600; src: url("../fontes/playfair-600-italic.woff2") format("woff2"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: #000; font-family: "IT", sans-serif; color: #F5F6F8; -webkit-font-smoothing: antialiased; }
#st { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; }
</style></head><body><div id="st"></div>
<script src="../animado/cinetico.js"></script>
<script src="../animado/mockups.js"></script>
<script>
window.ALTURA = 1350;
const { clamp, ease, eio, back, lerp, fmt } = K, TOTAL = 7;
const S = [], slide = (dur, trocas, render) => S.push({ dur, trocas, render });
const CARD = (x, y, w, h, extra = '') => `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${K.vidro()}overflow:hidden;${extra}`;
// setinha do mouse; k = clique (0..1)
const cursor = (x, y, k = 0) => `<svg class="abs" style="left:${x}px;top:${y}px;overflow:visible" width="40" height="56"><g transform="scale(${1 - .15 * Math.sin(clamp(k) * Math.PI)})">
  <path d="M0 0 L0 44 L11 34 L19 52 L28 48 L20 30 L35 30 Z" fill="#fff" stroke="#0B0B0D" stroke-width="3" stroke-linejoin="round"/></g></svg>`;
const onda = (x, y, k, cor = '#fff') => k > 0 && k < 1 ? `<div class="abs" style="left:${x - 60 * k}px;top:${y - 60 * k}px;width:${120 * k}px;height:${120 * k}px;border-radius:50%;border:4px solid ${cor};opacity:${1 - k}"></div>` : '';
const FEITO = (t) => K.kick(t, .1, 'NO SEU SITE', 655);

const TAG = (x = 36, y = 28) => `<div class="abs" style="right:${x}px;top:${y}px;padding:6px 16px;border-radius:20px;border:2px solid rgba(255,255,255,.5);font-weight:800;font-size:20px;letter-spacing:.14em">EXEMPLO</div>`;
const ROT = txt => `<div class="abs" style="left:40px;top:30px;font-weight:800;font-size:25px;letter-spacing:.16em;color:rgba(255,255,255,.65)">${txt}</div>`;

const VIVA = () => K.verm ? '#fff' : '#FF2E43';

// ---------- celular com a tela do WhatsApp Business (tema escuro) ----------
const ZB = '#0B141A', ZH = '#1F2C34', ZT = '#E9EDEF', ZS = '#8696A0', ZG = '#00A884';
const FONE = (t, inner) => { const inn = ease(t / .6);
  return `<div class="abs" style="left:110px;top:112px;width:344px;height:600px;border-radius:52px;background:#0B0B0D;padding:12px;box-shadow:0 0 0 3px rgba(255,255,255,.25), 0 50px 100px -30px rgba(0,0,0,.9);opacity:${inn};transform:translateY(${(1 - inn) * 40}px) rotate(-2deg)">
    <div style="width:320px;height:576px;border-radius:42px;overflow:hidden;position:relative;background:${ZB};font-family:IT,sans-serif;color:${ZT}">${inner}</div>
    <div style="position:absolute;left:50%;top:22px;width:90px;height:24px;margin-left:-45px;border-radius:12px;background:#0B0B0D"></div></div>`; };
const TOPO = (tit, sub = '') => `<div style="height:104px;padding:50px 20px 0;background:${ZH};display:flex;align-items:center;gap:14px"><span style="font-size:26px;color:${ZS}">←</span><div><b style="font-size:23px">${tit}</b>${sub ? `<div style="font-size:15px;color:${ZS}">${sub}</div>` : ''}</div></div>`;
// lista de opções; sel = índice tocado, k = progresso do toque
const LISTA = (itens, sel = -1, k = 0) => itens.map(([ic, tx, sub], j) => `<div style="display:flex;align-items:center;gap:14px;padding:15px 20px;position:relative;background:${j === sel && k > 0 ? `rgba(0,168,132,${.28 * Math.sin(clamp(k) * Math.PI) + (k >= 1 ? .14 : 0)})` : 'transparent'}">
    <span style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:21px">${ic}</span><div><div style="font-size:19px;font-weight:600">${tx}</div>${sub ? `<div style="font-size:14px;color:${ZS}">${sub}</div>` : ''}</div></div>`).join('');
const CHAVE = (on) => `<span style="flex-shrink:0;width:52px;height:30px;border-radius:15px;background:${on > .5 ? ZG : '#3B4A54'};position:relative"><span style="position:absolute;top:4px;left:${4 + 22 * clamp(on)}px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span>`;
// passos do lado direito (o caminho dentro do app), cada um entra com ✓
const PASSOS = (t, L, t0 = .5, dt = .55) => L.map((tx, j) => { const k = back((t - t0 - j * dt) / .4), ok = back((t - t0 - j * dt - .3) / .3);
  return k <= 0 ? '' : `<div class="abs" style="left:500px;width:480px;top:${150 + j * 112}px;padding:18px 22px;${K.vidro()}border-radius:24px;display:flex;align-items:center;gap:14px;font-weight:800;font-size:25px;line-height:1.2;opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 70}px)">
    <span style="flex-shrink:0;width:40px;height:40px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-family:Anton;font-size:22px;transform:scale(${clamp(ok, 0, 1.15)})">${j + 1}</span>${tx}</div>`; }).join('');
const FERR = [['🏪', 'Perfil comercial'], ['🛍️', 'Catálogo'], ['💤', 'Mensagem de ausência'], ['👋', 'Mensagem de saudação'], ['⚡', 'Respostas rápidas']];
const DICA = (t, n, tit, txt, ini) => `${K.kick(t, .1, 'DICA ' + n, 736)}${K.kin(t, .3, tit, { y: 978, max: 148, ini })}${K.corpo(t, 3.0, txt, 1150, { fs: 31 })}${K.rodape(t, 3.6)}`;

// 1 · gancho (ajuste 14/11): TÍTULO em cima e grande; a semana com o atendimento automático fica menor embaixo (EXEMPLO)
slide(7, [[0, 'black'], [3.0, 'red']], t => {
  const D = [['SEG', 0], ['TER', 0], ['QUA', 0], ['QUI', 0], ['SEX', 0], ['SÁB', 1], ['DOM', 1]];
  const P = [['💬', 'Cliente chamou', 'sábado, 21:40'], ['💤', 'Resposta automática enviada', 'sábado, 21:40'], ['🛒', 'Pedido pelo site', 'domingo, 10:15']];
  const inn = ease((t - 1.0) / .6);
  return `${K.kin(t, .05, ['Como fazer seu negócio', '*atender até no domingo*'], { y: 300, max: 165 })}
    ${K.corpo(t, 1.0, 'Arrasta e configura hoje: <b>4 dicas rápidas</b> pra ninguém ficar sem resposta no fim de semana.', 470, { fs: 34 })}
    <div style="${CARD(130, 640, 820, 420, `opacity:${.92 * inn};transform:translateY(${(1 - inn) * 40}px)`)}">${ROT('SEU FIM DE SEMANA')}${TAG(30, 360)}
      <div class="abs" style="left:36px;right:36px;top:76px;display:flex;gap:10px">${D.map(([d, fds], j) => { const k = ease((t - 1.1 - j * .06) / .3), acende = fds ? back((t - 1.8 - (j - 5) * .25) / .4) : 0;
        return `<div style="flex:1;padding:12px 0;border-radius:16px;text-align:center;font-weight:800;font-size:21px;letter-spacing:.06em;opacity:${k};background:${acende > 0 ? '#fff' : 'rgba(255,255,255,.08)'};color:${acende > 0 ? '#C3101F' : 'rgba(255,255,255,.7)'}">${d}</div>`; }).join('')}</div>
      ${P.map(([ic, tx, sub], j) => { const k = back((t - 2.3 - j * .45) / .4), ok = back((t - 2.6 - j * .45) / .3);
        return `<div class="abs" style="left:36px;right:36px;top:${150 + j * 66}px;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-radius:16px;background:rgba(255,255,255,.08);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 60}px)">
          <span style="font-size:24px">${ic}</span><b style="font-size:22px;flex:1">${tx}</b><span style="font-size:18px;color:rgba(255,255,255,.7)">${sub}</span>
          <span style="width:34px;height:34px;border-radius:50%;background:#fff;color:#C3101F;display:grid;place-items:center;font-size:19px;font-weight:800;transform:scale(${clamp(ok, 0, 1.15)})">✓</span></div>`; }).join('')}</div>
    <div class="abs" style="left:0;right:0;bottom:46px;text-align:center;opacity:${ease((t - 3.6) / .4)}"><span style="display:inline-flex;align-items:center;gap:14px;padding:14px 30px;border-radius:40px;background:${K.verm ? '#fff' : '#FF2E43'};color:${K.verm ? '#C3101F' : '#fff'};font-family:Anton;font-size:34px;letter-spacing:.06em;box-shadow:0 0 ${30 + 14 * Math.sin(t * 4)}px rgba(255,255,255,.35)">ARRASTA <span style="display:inline-block;transform:translateX(${Math.sin(t * 4) * 14}px)">→</span></span></div>`; });

// 2 · DICA 1 · mensagem de ausência: toca em Ferramentas comerciais › Mensagem de ausência, liga a chave, a mensagem aparece e a programação "fora do horário comercial"
slide(7.5, [[0, 'black'], [3.4, 'red']], t => {
  const tela2 = t > 1.7, on = clamp((t - 2.2) / .25), msg = 'Oi! Agora estamos fechados 😴 A gente responde amanhã cedo. Já deixa sua dúvida aqui!', n = Math.floor(clamp((t - 2.6) / 1.2) * msg.length), prog = back((t - 3.9) / .4);
  const inner = !tela2 ? TOPO('Ferramentas comerciais') + LISTA(FERR, 2, clamp((t - 1.1) / .5)) + (t > 1.0 && t < 1.7 ? onda(160, 380, clamp((t - 1.1) / .5), ZG) : '')
    : TOPO('Mensagem de ausência') + `<div style="padding:18px 20px">
        <div style="display:flex;align-items:center;gap:12px;font-size:18px;font-weight:600">Enviar mensagem de ausência<span style="margin-left:auto"></span>${CHAVE(on)}</div>
        <div style="margin-top:20px;font-size:14px;color:${ZG};font-weight:700">MENSAGEM</div>
        <div style="margin-top:8px;min-height:120px;padding:14px 16px;border-radius:14px;background:#005C4B;font-size:17px;line-height:1.35;opacity:${clamp(on * 2)}">${msg.slice(0, n)}${n < msg.length && t > 2.6 ? '|' : ''}</div>
        <div style="margin-top:20px;font-size:14px;color:${ZG};font-weight:700">PROGRAMAÇÃO</div>
        <div style="margin-top:8px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);font-size:17px;display:flex;align-items:center;gap:10px;transform:scale(${prog > 0 ? clamp(prog, 0, 1.06) : 1});opacity:${prog > 0 ? 1 : .35}">🕗 Fora do horário comercial ${prog > 0 ? `<span style="margin-left:auto;color:${ZG};font-weight:800">✓</span>` : ''}</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['Abre o WhatsApp Business', '⋮ › Ferramentas comerciais', 'Mensagem de ausência', 'Liga e escolhe "fora do horário comercial"'])}
  ${DICA(t, 1, ['Mensagem', '*de ausência*'], 'Quem chama no domingo recebe resposta na hora e <b>não fica no vácuo.</b>', 1)}`; });

// 3 · DICA 2 · horário no perfil: Perfil comercial › Horário de atendimento, os dias entram um a um (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const tela2 = t > 1.7, H = [['Seg a sex', '8h às 18h'], ['Sábado', '8h às 12h'], ['Domingo', 'Fechado']];
  const inner = !tela2 ? TOPO('Perfil comercial') + LISTA([['📍', 'Endereço', 'Rua das Flores, 120'], ['🕗', 'Horário de atendimento', 'Não informado'], ['🌐', 'Site', 'seunome.com.br'], ['✉️', 'E-mail', 'contato@seunome.com.br']], 1, clamp((t - 1.1) / .5)) + (t > 1.0 && t < 1.7 ? onda(160, 252, clamp((t - 1.1) / .5), ZG) : '')
    : TOPO('Horário de atendimento') + `<div style="padding:16px 20px">${H.map(([d, h], j) => { const k = back((t - 2.0 - j * .45) / .4);
        return `<div style="display:flex;align-items:center;gap:12px;padding:16px 4px;border-bottom:1px solid rgba(255,255,255,.08);opacity:${clamp(k)};transform:translateX(${(1 - clamp(k)) * 40}px)"><b style="font-size:19px">${d}</b><span style="margin-left:auto;font-size:18px;color:${h === 'Fechado' ? '#F15C6D' : ZS}">${h}</span>${CHAVE(h === 'Fechado' ? 0 : 1)}</div>`; }).join('')}
        <div style="margin-top:22px;text-align:center;padding:14px;border-radius:24px;background:${ZG};color:#06301A;font-weight:800;font-size:18px;opacity:${ease((t - 3.5) / .4)}">Salvar</div>
        <div style="margin-top:14px;text-align:center;font-size:13px;color:${ZS};letter-spacing:.12em;font-weight:800">EXEMPLO</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['⋮ › Ferramentas comerciais', 'Perfil comercial', 'Horário de atendimento', 'Coloca os dias e as horas'])}
  ${DICA(t, 2, ['Seu horário', '*no perfil*'], 'O cliente vê quando você volta e <b>não acha que foi ignorado.</b>', 3)}`; });

// 4 · DICA 3 · respostas rápidas: chega a pergunta, digita /preco e vira a resposta pronta (EXEMPLO)
slide(7, [[0, 'black'], [3.4, 'red']], t => {
  const atalho = '/preco', na = Math.floor(clamp((t - 1.4) / .6) * atalho.length), sug = t > 2.0 && t < 2.6, env = t > 2.9;
  const resp = 'Corte R$ 45 · Escova R$ 60 ✂️ Quer agendar? 😊';
  const inner = TOPO('Ana Paula', 'online') + `<div style="padding:16px 16px;height:372px;position:relative"><div style="position:absolute;right:16px;top:14px;font-size:12px;color:${ZS};letter-spacing:.12em;font-weight:800">EXEMPLO</div>
      <div style="text-align:center;margin-bottom:12px"><span style="padding:4px 12px;border-radius:8px;background:#182229;font-size:13px;color:${ZS}">DOMINGO</span></div>
      <div style="max-width:78%;padding:10px 14px;border-radius:4px 14px 14px 14px;background:${ZH};font-size:17px;transform:scale(${back((t - .5) / .35)});transform-origin:0 0">Qual o valor do corte? <span style="font-size:12px;color:${ZS}">10:14</span></div>
      ${env ? `<div style="margin:12px 0 0 auto;max-width:82%;padding:10px 14px;border-radius:14px 4px 14px 14px;background:#005C4B;font-size:17px;transform:scale(${back((t - 2.9) / .35)});transform-origin:100% 0">${resp} <span style="font-size:12px;color:#9FC9BD">10:14 ✓✓</span></div>` : ''}
      ${sug ? `<div style="position:absolute;left:16px;right:16px;bottom:8px;padding:12px 14px;border-radius:12px;background:${ZH};font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.5)"><b style="color:${ZG}">/preco</b><div style="color:${ZS};margin-top:4px">${resp}</div></div>` : ''}</div>
    <div style="display:flex;gap:10px;padding:10px 14px"><div style="flex:1;min-height:50px;padding:13px 18px;border-radius:25px;background:${ZH};font-size:17px;color:${env ? ZS : ZT}">${env ? 'Mensagem' : t > 1.4 ? atalho.slice(0, na) : 'Mensagem'}</div><div style="width:50px;height:50px;border-radius:50%;background:${ZG};display:grid;place-items:center;font-size:22px">➤</div></div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['⋮ › Ferramentas comerciais', 'Respostas rápidas', 'Cria o atalho /preco com a resposta', 'No chat, digita / e escolhe'])}
  ${DICA(t, 3, ['Respostas', '*rápidas*'], 'Na segunda, você responde <b>a fila do fim de semana em segundos.</b>', 4)}`; });

// 5 · DICA 4 · catálogo: os produtos entram com foto e preço (EXEMPLO)
slide(7, [[0, 'red'], [3.4, 'black']], t => {
  const L = [['🎂', 'Bolo de chocolate', 'R$ 90'], ['🍓', 'Bolo de morango', 'R$ 110'], ['🍫', 'Brigadeiro (cento)', 'R$ 120'], ['🥥', 'Beijinho (cento)', 'R$ 120']];
  const inner = TOPO('Catálogo', 'Doce Ana') + `<div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px">${L.map(([ic, n, v], j) => { const k = back((t - .8 - j * .4) / .4);
      return `<div style="padding:12px;border-radius:14px;background:${ZH};opacity:${clamp(k)};transform:scale(${clamp(k, 0, 1.08)})"><div style="height:92px;border-radius:10px;background:#2A3942;display:grid;place-items:center;font-size:48px">${ic}</div><div style="font-size:15px;font-weight:600;margin-top:8px;line-height:1.2">${n}</div><div style="font-size:16px;color:${ZG};font-weight:800;margin-top:2px">${v}</div></div>`; }).join('')}</div>
    <div style="text-align:center;font-size:13px;color:${ZS};letter-spacing:.12em;font-weight:800">EXEMPLO</div>`;
  return `${FONE(t, inner)}${PASSOS(t, ['⋮ › Ferramentas comerciais', 'Catálogo', 'Adiciona foto, nome e preço', 'Pronto: o cliente vê sozinho'])}
  ${DICA(t, 4, ['Catálogo', '*no WhatsApp*'], 'O cliente vê o que você vende e o preço <b>mesmo com você offline.</b>', 2)}`; });

// 6 · ligação com o trabalho do Gabriel: o site leva o cliente pro WhatsApp com a mensagem pronta
slide(7, [[0, 'black'], [3.4, 'red']], t => {
  const msg = 'Olá! Vi seu site e quero encomendar um bolo pra sábado 🎂', troca = eio((t - 1.9) / .5), n = Math.floor(clamp((t - 2.4) / .7) * msg.length), env = t > 3.4;
  const site = `<div class="abs" style="inset:0;transform:translateX(${-troca * 100}%);padding:40px">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-family:Anton;font-size:40px">DOCE ANA</b><span style="font-size:22px;color:rgba(255,255,255,.6)">Cardápio · Preços · Onde fica</span></div>
      <div style="margin-top:46px;font-weight:800;font-size:56px;line-height:1.08">Bolo de festa por<br>encomenda em Goiânia</div>
      <div style="margin-top:34px;display:inline-flex;align-items:center;gap:14px;padding:22px 40px;border-radius:44px;background:#25D366;color:#06301A;font-weight:800;font-size:32px;transform:scale(${(1 + .04 * Math.sin(t * 6)) * (1 - .08 * Math.sin(clamp((t - 1.5) / .3) * Math.PI))});box-shadow:0 0 ${30 + 20 * Math.sin(t * 6)}px rgba(37,211,102,.6)">💬 Pedir pelo WhatsApp</div></div>`;
  const zap = `<div class="abs" style="inset:0;transform:translateX(${(1 - troca) * 100}%);display:flex;flex-direction:column;background:#0B141A">
      <div style="display:flex;align-items:center;gap:16px;padding:22px 28px;background:#1F2C34"><div style="width:54px;height:54px;border-radius:50%;background:#D6B36C;color:#111;display:grid;place-items:center;font-family:Anton;font-size:26px">DA</div><b style="font-size:29px">Doce Ana</b></div>
      <div style="flex:1;padding:24px 28px">${env ? `<div style="margin-left:auto;max-width:80%;padding:18px 22px;border-radius:20px 20px 6px 20px;background:#005C4B;font-size:28px;line-height:1.3;transform:scale(${back((t - 3.4) / .35)});transform-origin:100% 100%">${msg}<div style="text-align:right;font-size:20px;color:#9FC9BD;margin-top:4px">✓✓</div></div>` : ''}</div>
      <div style="display:flex;gap:12px;padding:14px 20px 22px"><div style="flex:1;min-height:62px;padding:16px 22px;border-radius:31px;background:#1F2C34;font-size:25px;color:${env ? '#8696A0' : '#E9EDEF'}">${env ? 'Mensagem' : msg.slice(0, n)}</div><div style="width:62px;height:62px;border-radius:50%;background:#00A884;display:grid;place-items:center;font-size:28px">➤</div></div></div>`;
  return `<div style="${CARD(70, 140, 940, 480)}">${site}${zap}${t > .6 && t < 1.9 ? cursor(lerp(700, 330, eio((t - .6) / .8)), lerp(440, 330, eio((t - .6) / .8)), clamp((t - 1.5) / .3)) : ''}</div>
  ${K.kick(t, .1, 'E O SEU SITE?', 655)}${K.kin(t, .3, ['O site leva o cliente', '*pro seu WhatsApp*'], { y: 900, max: 175, ini: 5 })}
  ${K.corpo(t, 4.0, 'No site que eu faço, o cliente te acha no Google, vê tudo e <b>chama no WhatsApp com a mensagem pronta</b>, até no domingo.', 1110, { fs: 33 })}
  ${K.rodape(t, 4.6)}`; });

// 7 · final aprovado
slide(6.5, [[0, 'black'], [1.4, 'red']], t => {
  const it = ['📍 Aparece no Google', '💬 Botão do WhatsApp', '🛍️ Catálogo com preço', '🕗 Horário à vista', '🔒 Seu nome no endereço', '🌙 Atende até no domingo'];
  return `<div class="abs" style="left:70px;top:170px;width:940px;display:grid;grid-template-columns:1fr 1fr;gap:20px">${it.map((x, j) => { const k = back((t - .3 - j * .15) / .4);
