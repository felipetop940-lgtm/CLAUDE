<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Motor CINÉTICO — fundo preto/vermelho, legenda gigante palavra por palavra, motion graphics em vidro</title>
<!--
  MODELO DE VÍDEO CURTO 1080x1920 — narração + legenda palavra por palavra.
  O gerador injeta o roteiro já com tempos: c.t0, c.dur e c.palavras = [{w, a, b}].
  Áreas (seguras para TikTok/Reels):
    120–200  perfil · 280–760 título · 800–1400 boneco/cena · 1450–1600 legenda
  Marcações no título: ~vermelho~  *dourado*  _azul_  #faixa#  (valem para várias palavras)
  Bonecos: pictogramas originais desenhados aqui (SVG), animados por articulações.
  MODO DINÂMICO (26/10): palavras-chave gigantes cortando no ritmo da fala ("kw" por cena, faixa colorida em 250–640),
  motion graphics explicativos no centro (670–1390) e boneco pequeno no canto. Roteiro: "motor": "motor-dinamico.html".
-->
<style>
@font-face { font-family: "IT"; font-weight: 400 700; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "CG"; font-style: italic; src: url("../../assets/fonts/cormorant-garamond-italic.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "Marker"; src: url("fontes/permanent-marker.woff2") format("woff2"); }
:root { --gold: #D6B36C; --blue: #4F7BFF; --red: #FF4D5E; --white: #F5F6F8; --gray: #9BA2AE; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
body { font-family: "IT", sans-serif; color: var(--white); -webkit-font-smoothing: antialiased; }
#world { position: absolute; inset: 0; transform-origin: 50% 50%; background: #040405; }
.bg { position: absolute; inset: 0; pointer-events: none; }
.beam { position: absolute; top: -300px; width: 900px; height: 2400px; filter: blur(40px); mix-blend-mode: screen; transform-origin: 50% 0; }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); mix-blend-mode: screen; }
.floor { position: absolute; left: -10%; right: -10%; bottom: -200px; height: 900px; background: radial-gradient(ellipse at 50% 30%, rgba(214,179,108,.10), transparent 60%); }
.lines { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size: 100% 6px; opacity: .5; }
.grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: screen; background-size: 256px 256px; }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, transparent 40%, rgba(0,0,0,.8)); }
.glow { position: absolute; width: 1300px; height: 1300px; left: -110px; top: -250px; border-radius: 50%; opacity: .16; mix-blend-mode: screen; }
.spot { position: absolute; left: 50%; top: 1400px; width: 900px; height: 260px; margin-left: -450px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.10), transparent); }
.layer { position: absolute; inset: 0; }
#dust i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.progress { position: absolute; left: 70px; right: 70px; top: 92px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--gold)); transform-origin: 0 50%; }
.handle { position: absolute; top: 126px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 600; color: var(--gold); letter-spacing: .02em; }

.txt { position: absolute; left: 50px; right: 50px; top: 390px; text-align: center; font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 1.07; letter-spacing: .01em; text-shadow: 0 10px 34px rgba(0,0,0,.75); }
.txt .ln { display: table; margin: 0 auto; }
.w { display: inline-block; margin: 0 .1em; transform-origin: 50% 80%; }
.w.gold, .w.red, .w.blue { font-family: "Marker", "Anton", sans-serif; font-size: 1.16em; letter-spacing: 0; }
.w.gold { color: var(--gold); } .w.red { color: var(--red); } .w.blue { color: var(--blue); }
.w.box { background: var(--white); color: #07080A; padding: 0 .2em; margin: .05em; text-shadow: none; }
.hl { position: relative; }
.hl::after { content: ""; position: absolute; left: -2px; right: -2px; bottom: .05em; height: .07em; border-radius: 4px; background: currentColor; transform-origin: 0 50%; transform: scaleX(var(--u, 0)); }
.w.red.hl::after { display: none; }

.subs { position: absolute; left: 60px; right: 60px; top: 1420px; text-align: center; font-family: "IT", sans-serif; font-weight: 800; text-transform: none; font-size: 50px; line-height: 1.2; }
.subs span { display: inline-block; margin: 0 .11em; color: var(--white); text-shadow: 0 5px 0 #000, 0 0 26px rgba(0,0,0,.95); }
.subs span.on { color: var(--gold); }
.subs span.next { color: rgba(245,246,248,.55); }

.label { position: absolute; transform: translateX(-50%); font-family: "CG", serif; font-style: italic; font-size: 62px; white-space: nowrap; text-shadow: 0 4px 20px #000; }
svg { overflow: visible; }
#bg, #grain, #glow, .spot, #dust, .vig, #stick, #labels, #fg, #mg { display: none !important; }
#world { background: #000 !important; }
#bgc { position: absolute; inset: 0; }
#subs, #txt { display: none !important; }
#kin { position: absolute; left: 0; right: 0; top: 0; height: 0; }
.band { position: absolute; left: -60px; right: -60px; top: 770px; height: 390px; overflow: hidden; }
#kin .kt { position: absolute; left: 0; right: 0; text-align: center; font-family: "Anton", sans-serif; text-transform: uppercase; line-height: .98; white-space: pre; padding-top: .04em; }
#kin .ks { position: absolute; left: 0; right: 0; text-align: center; font-family: "IT", sans-serif; font-weight: 800; font-size: 38px; letter-spacing: .14em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="world">
  <div class="layer" id="bgc"></div>
  <div class="bg" id="bg"></div>
  <div class="grain" id="grain"></div>
  <div class="glow" id="glow"></div>
  <div class="spot"></div>
  <div class="layer" id="dust"></div>
  <div class="vig"></div>
  <svg class="layer" id="mg" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
  <div class="layer" id="cam">
    <div class="layer" id="props"></div>
    <svg class="layer" id="hl" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
  </div>
  <svg class="layer" id="stick" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
  <div class="layer" id="labels"></div>
  <div class="txt" id="txt"></div>
  <div id="kin"></div>
  <svg class="layer" id="fg" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
</div>
<div class="subs" id="subs"></div>
<div class="layer" id="trans" style="pointer-events:none"></div>
<div class="progress"><i id="prog"></i></div>
<div class="handle" id="handle"></div>
<div class="flash" id="flash"></div>

<script>
const R = __ROTEIRO__;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const C = { gold: '#D6B36C', blue: '#4F7BFF', red: '#FF4D5E', white: '#F5F6F8', gray: '#9BA2AE' };
$('handle').textContent = R.perfil || '';

// Granulado e poeira (estáticos, sementes fixas → quadros determinísticos)
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
(() => { const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d'); const d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); $('grain').style.backgroundImage = `url(${cv.toDataURL()})`; })();
const DUST = Array.from({ length: 26 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, s: .4 + rnd() * .9, v: 12 + rnd() * 30, o: .08 + rnd() * .25 }));
$('dust').innerHTML = DUST.map(() => '<i></i>').join('');
const BOKEH = Array.from({ length: 14 }, () => ({ x: rnd() * 1080, y: rnd() * 2200, r: 30 + rnd() * 90, v: 8 + rnd() * 18, o: (.10 + rnd() * .18).toFixed(2), bl: 6 + rnd() * 14, g: rnd() > .5 }));

/* ---------------- Título cinético ---------------- */
function buildText(c) {
  const box = $('txt'); box.innerHTML = ''; box.style.fontSize = (c.tamanho || 120) + 'px'; c._words = [];
  const CLS = { '*': 'gold', '~': 'red', '_': 'blue', '#': 'box' };
  (c.texto || []).forEach(line => {
    const ln = document.createElement('span'); ln.className = 'ln'; let open = null;
    line.split(' ').forEach(tok => {
      const w = document.createElement('span'); w.className = 'w'; let t = tok, mk = open;
      if (!open && CLS[t[0]]) { mk = t[0]; t = t.slice(1); open = mk; }
      const end = mk && t.match(new RegExp('\\' + mk + '([.,!?…:]*)$'));
      if (end) { t = t.slice(0, end.index) + end[1]; open = null; }
      if (mk) { w.classList.add(CLS[mk]); if (mk !== '#') w.classList.add('hl'); }
      w.textContent = t; ln.appendChild(w); c._words.push(w);
    });
    box.appendChild(ln);
  });
  let fs = parseFloat(box.style.fontSize);
  for (let k = 0; k < 25 && [...box.children].some(l => l.offsetWidth > 970); k++) { fs *= .94; box.style.fontSize = fs + 'px'; }
}

/* ---------------- Legenda (karaokê) ---------------- */
function renderSubs(c, t) {
  const box = $('subs'); const P = c.palavras || [];
  if (!P.length) { box.innerHTML = ''; return; }
  const chunks = []; let cur = [];
  P.forEach((p, i) => { cur.push(i); if (cur.length >= 4 || /[.,!?:]$/.test(p.w)) { chunks.push(cur); cur = []; } });
  if (cur.length) chunks.push(cur);
  let idx = P.findIndex(p => t >= p.a && t < p.b);
  if (idx < 0) { if (t < P[0].a) { box.innerHTML = ''; box.dataset.h = ''; return; } idx = P.length - 1; }
  const ch = chunks.find(k => k.includes(idx));
  const html = ch.map(i => `<span class="${i === idx ? 'on' : i > idx ? 'next' : ''}">${P[i].w}</span>`).join('');
  if (box.dataset.h !== html) { box.innerHTML = html; box.dataset.h = html; }
  const k = back((t - P[ch[0]].a) / .16);
  box.style.transform = `translateY(${(1 - k) * 24}px) scale(${.9 + .1 * k})`; box.style.opacity = clamp(k * 2);
}

/* ---------------- Bonecos pictograma (originais) ---------------- */
// Ângulos em graus, sempre "para fora do corpo": 0 = para baixo, 90 = horizontal para fora, 180 = para cima.
// Valores negativos apontam para dentro (cruzando o corpo). O lado esquerdo é espelhado automaticamente.
// a = braço esquerdo, b = braço direito: [ombro, cotovelo]. p = perna esquerda, q = perna direita: [quadril, joelho].
const POSES = {
  parado:      { h: 0,   t: 0,  a: [13, 0],     b: [13, 0],      p: [5, 0],   q: [5, 0] },
  socando:     { h: -4,  t: 4,  a: [22, -172],  b: [90, 0],     p: [16, 0],  q: [18, -8] },     // guarda no queixo + soco para a direita
  andando:     { h: -2,  t: 3,  a: [18, -10],   b: [-14, 6],    p: [22, -4], q: [-18, 26] },
  pensando:    { h: 8,   t: 2,  a: [6, 0],      b: [60, 150],   p: [5, 0],   q: [5, 0] },       // mão no queixo
  acenando:    { h: -4,  t: -2, a: [6, 0],      b: [140, 25],   p: [5, 0],   q: [5, 0] },
  dancando:    { h: -8,  t: -5, a: [95, -40],   b: [150, 12],   p: [10, 0],  q: [36, 55] },
  comemorando: { h: -10, t: 0,  a: [150, 10],   b: [150, 10],   p: [15, 0],  q: [15, 0] },      // braços em V
  triste:      { h: 34,  t: 6,  a: [3, -4],     b: [3, -4],     p: [4, -5],  q: [4, -5] },      // cabisbaixo
  chocado:     { h: -6,  t: 0,  a: [100, 105],  b: [100, 105],  p: [13, 0],  q: [13, 0] },      // mãos na cabeça
  celular:     { h: 14,  t: 2,  a: [12, 0],     b: [36, 112],    p: [6, 0],   q: [6, 0] },       // celular numa mão, do lado do rosto
  confiante:   { h: -6,  t: 0,  a: [26, -122],  b: [26, -116],  p: [11, 0],  q: [11, 0] },      // braços cruzados
  apontando:   { h: -6,  t: -3, a: [8, 0],      b: [90, -4],    p: [9, 0],   q: [9, 0] },
  ideia:       { h: -10, t: -2, a: [12, 0],     b: [158, 16],    p: [5, 0],   q: [5, 0] },       // dedo para cima
  empurrando:  { h: 10,  t: 18, a: [-80, -5],   b: [80, 5],     p: [-8, -6], q: [34, 30] },
  cintura:     { h: -6,  t: 0,  a: [40, -68],   b: [40, -68],   p: [13, 0],  q: [13, 0] },      // mãos na cintura
};
function mixPose(A, B, k) { const o = {}; for (const key in A) o[key] = Array.isArray(A[key]) ? A[key].map((v, i) => lerp(v, B[key][i], k)) : lerp(A[key], B[key], k); return o; }
function limb(x, y, a1, a2, l1, l2) {
  const r1 = a1 * Math.PI / 180, r2 = (a1 + a2) * Math.PI / 180;
  const x1 = x + Math.sin(r1) * l1, y1 = y + Math.cos(r1) * l1;
  return { d: `M${x} ${y} L${x1} ${y1} L${x1 + Math.sin(r2) * l2} ${y1 + Math.cos(r2) * l2}`, x2: x1 + Math.sin(r2) * l2, y2: y1 + Math.cos(r2) * l2 };
}
function figure(s, lt, t) {
  if (s._pose) s = { ...s, pose: s._pose };
  const S = s.escala || 1, base = s.y ?? 1400;
  // entrada: pode chegar andando pela lateral
  let cx = s.x ?? 540, walkK = 0;
  if (s.entrada === 'andando') { const k = ease(lt / .9); cx = lerp(s.x < 540 ? -200 : 1280, s.x ?? 540, k); walkK = 1 - clamp((lt - .75) / .25); }
  const inK = s.entrada === 'andando' ? 1 : back(lt / .38);
  let P = s._P ? { ...s._P, a: [...s._P.a], b: [...s._P.b], p: [...s._P.p], q: [...s._P.q] } : mixPose(POSES.parado, POSES[s.pose] || POSES.parado, ease((lt - (s.entrada === 'andando' ? .8 : 0)) / .3));
  if (walkK > 0) { const ph = Math.sin(lt * 14); P = mixPose(P, { ...POSES.andando, a: [16 * ph, -6], b: [-16 * ph, 6], p: [20 * ph, -Math.max(0, -ph) * 30], q: [-20 * ph, -Math.max(0, ph) * 30] }, walkK); }
  const osc = Math.sin(t * 6);
  if (s.pose === 'acenando') P.b = [P.b[0], P.b[1] + osc * 22];
  if (s.pose === 'comemorando' || s.pose === 'dancando') { P.a[0] += osc * 8; P.b[0] += osc * 8; }
  if (s.pose === 'socando') { const hit = Math.max(0, Math.sin(t * 7)); P.b = [P.b[0], P.b[1]]; cx += hit * 10 * S; }
  if (s.pose === 'triste') P.h += Math.sin(t * 2.5) * 2;
  // vivo: nunca parado. Braço "preso" (segurando algo/na cabeça) mexe pouco; braço livre gesticula como quem conversa.
  const PRESO = { celular: 'b', pensando: 'b', chocado: 'ab', confiante: 'ab', cintura: 'ab' }[s.pose] || '';
  const g1 = Math.sin(t * 1.5), g2 = Math.sin(t * 1.8 + 1.3), g3 = Math.sin(t * 1.3 + 2.1);   // calmo: gesto lento
  if (!s.parado && !['acenando', 'comemorando', 'dancando', 'socando'].includes(s.pose)) {
    if (!PRESO.includes('a')) { P.a = [P.a[0] + 6 + g1 * 7, P.a[1] - 8 + g2 * 9]; } else { P.a = [P.a[0] + g1 * 2, P.a[1] + g2 * 2]; }
    if (!PRESO.includes('b')) { P.b = [P.b[0] + 5 + g2 * 6, P.b[1] - 6 + g3 * 8]; } else { P.b = [P.b[0] + g2 * 2, P.b[1] + g3 * 2]; }
    P.h += Math.sin(t * 1.4) * 3; P.t += Math.sin(t * 1.1) * 2;
    P.p = [P.p[0] + Math.max(0, Math.sin(t * 1.2)) * 6, P.p[1]]; P.q = [P.q[0] + Math.max(0, -Math.sin(t * 1.2)) * 6, P.q[1]];
    cx += Math.sin(t * .8) * 6 * S; }
  const hop = (s.pose === 'comemorando' || s.pose === 'dancando') ? Math.abs(Math.sin(t * 5)) * 30 * S : (s.parado ? 0 : Math.abs(Math.sin(t * 1.6)) * 4 * S);
  const shake = s.pose === 'chocado' ? Math.sin(t * 60) * 3 * S : 0;
  const L = 108 * S, W = 44 * S, HR = 58 * S, gap = 10 * S;
  const hipY = base - 2 * L - hop, tr = P.t * Math.PI / 180;
  const nx = cx + Math.sin(tr) * 1.42 * L + shake, ny = hipY - Math.cos(tr) * 1.42 * L + Math.sin(t * 3) * 2 * S;
  const hr = (P.t + P.h) * Math.PI / 180;
  const hx = nx + Math.sin(hr) * (HR + gap + W * .2), hy = ny - Math.cos(hr) * (HR + gap + W * .2);
  const sh = ny + W * .35;
  // lado esquerdo espelhado: ângulo positivo sempre abre para fora do corpo
  const A = limb(nx - W * .25, sh, -P.a[0], -P.a[1], .9 * L, .82 * L);
  const B = limb(nx + W * .25, sh, P.b[0], P.b[1], .9 * L, .82 * L);
  const Lp = limb(cx - W * .28, hipY, -P.p[0], -P.p[1], L, L);
  const Lq = limb(cx + W * .28, hipY, P.q[0], P.q[1], L, L);
  const col = C[s.cor] || C.white;
  let extra = '';
  if (s.pose === 'celular') { const px = B.x2 + 8 * S, py = B.y2 - 40 * S, tap = Math.max(0, Math.sin(t * 5));
    // celular na mão direita + bolhas de notificação subindo (movimento constante)
    let pings = ''; for (let i = 0; i < 1; i++) { const ph = ((t * .45) % 1), y = py - 90 * S - ph * 230 * S, x = px + (i - 1) * 46 * S + Math.sin(t * 2 + i) * 10 * S, o = Math.sin(ph * Math.PI);
      pings += `<g opacity="${o}" transform="translate(${x} ${y}) scale(${S * (.7 + .3 * o)})"><rect x="-34" y="-24" width="68" height="44" rx="16" fill="${i === 1 ? C.gold : C.blue}"/><path d="M-10 20 l-8 14 l20 -14z" fill="${i === 1 ? C.gold : C.blue}"/><circle cx="-14" cy="-2" r="5" fill="#0B0D11"/><circle cx="0" cy="-2" r="5" fill="#0B0D11"/><circle cx="14" cy="-2" r="5" fill="#0B0D11"/></g>`; }
    extra = `<g transform="rotate(${-8 + Math.sin(t * 1.4) * 3} ${px} ${py})"><rect x="${px - 38 * S}" y="${py - 66 * S}" width="${76 * S}" height="${132 * S}" rx="${15 * S}" fill="#0B0D11" stroke="${C.white}" stroke-width="${6 * S}"/>
      <rect x="${px - 28 * S}" y="${py - 54 * S}" width="${56 * S}" height="${100 * S}" rx="${7 * S}" fill="${C.blue}" opacity="${.55 + .25 * Math.sin(t * 4)}"/>
      <circle cx="${px}" cy="${py + 10 * S}" r="${(10 + tap * 6) * S}" fill="#fff" opacity="${.25 * tap}"/></g>${pings}`; }
  if (s.pose === 'socando') { const hk = Math.max(0, Math.sin(t * 7)); if (hk > .6) extra += [0, 1, 2].map(i => `<path d="M${B.x2 + 40 * S} ${B.y2 + (i - 1) * 34 * S} l${50 * S} ${(i - 1) * 16 * S}" stroke="${C.gold}" stroke-width="${8 * S}" stroke-linecap="round" opacity="${(hk - .6) * 2.5}"/>`).join(''); }
  let emo = ''; const ek = back((lt - .35) / .4);
  if (s.emocao === 'chuva') { let d = ''; for (let i = 0; i < 7; i++) { const dy = (t * 420 + i * 47) % 150;
      d += `<line x1="${hx - 80 * S + i * 27 * S}" y1="${hy - 140 * S + dy}" x2="${hx - 86 * S + i * 27 * S}" y2="${hy - 118 * S + dy}" stroke="${C.blue}" stroke-width="${7 * S}" stroke-linecap="round" opacity="${1 - dy / 150}"/>`; }
    emo = `<g opacity="${clamp(ek)}"><path d="M${hx - 118 * S} ${hy - 160 * S} a50 50 0 0 1 64 -58 a66 66 0 0 1 122 12 a44 44 0 0 1 22 82 Z" fill="#3A404C"/>${d}</g>`; }

/* ---------------- Primeiro plano: reações + efeitos (nunca para) ----------------

const REAC = { red: ['chocado', 'apontando', 'cintura'], gold: ['comemorando', 'ideia', 'apontando'], blue: ['pensando', 'apontando', 'ideia'] };

      const icon = ICO[b] ? `<g transform="translate(-24 -26) scale(2)" fill="none" stroke="#07080A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICO[b]}</g>` :
        `<text x="0" y="22" text-anchor="middle" font-family="Anton" font-size="62" fill="#07080A">${b}</text>`;
      h += `<g transform="translate(${bx} ${by + Math.sin(t * 3) * 6}) scale(${clamp(pk, 0, 1.25)}) rotate(${Math.sin(t * 2) * 6})">

  for (let j = 0; j < (c.pipocar ? 2 : 0); j++) { const per = 1.1 + j * .35, n = Math.floor((t + j * .5) / per), ph = ((t + j * .5) % per) / per;

/* ---------------- Beats: foco de câmera + destaque + reação do boneco, no ritmo da fala ----------------

    const w = (c.palavras || []).find(p => norm(p.w).startsWith(norm(String(b.em)))); return w ? w.a - c.t0 : .5 * c.dur; })() })).sort((a, b) => a.t - b.t);

/* ---------------- Transições entre cenas ----------------
   Cobrem o corte (cobertura total no instante da troca). Alternam: varredura · íris · barras. */
const TR = ['varredura', 'iris', 'barras'];
function drawTransition(t) {
  const el = $('trans'); const D = .32;
  const k = R.cenas.findIndex((c, i) => i > 0 && Math.abs(t - c.t0) < D);
  if (k < 0) { if (el.dataset.on) { el.innerHTML = ''; el.dataset.on = ''; } return; }
  el.dataset.on = '1';
  const tipo = R.cenas[k].transicao || TR[(k - 1) % TR.length];
  const p = (t - R.cenas[k].t0 + D) / (2 * D);               // 0 → 1 (0,5 = tela coberta)
  const G = '#D6B36C', Bl = '#4F7BFF';
  if (tipo === 'varredura') {
    const x = lerp(130, -130, easeIO(p));                     // painel diagonal atravessa a tela
    el.innerHTML = `<div style="position:absolute;top:-20%;height:140%;left:0;width:100%;transform:translateX(${x}%) skewX(-16deg)">
      <div style="position:absolute;inset:0;background:#050507"></div>
      <div style="position:absolute;top:0;bottom:0;left:-10px;width:26px;background:linear-gradient(90deg,transparent,${G},#fff,${G},transparent);box-shadow:0 0 60px 20px rgba(214,179,108,.55)"></div>
      <div style="position:absolute;top:0;bottom:0;right:-10px;width:18px;background:linear-gradient(90deg,transparent,${Bl},transparent);box-shadow:0 0 50px 16px rgba(79,123,255,.5)"></div></div>`;
  } else if (tipo === 'iris') {
    const r = p < .5 ? lerp(1250, 0, easeIO(p * 2)) : lerp(0, 1250, easeIO((p - .5) * 2));
    const mark = 1 - Math.abs(p - .5) * 4;
    el.innerHTML = `<svg width="1080" height="1920" style="position:absolute;inset:0"><path fill="#050507" fill-rule="evenodd" d="M0 0H1080V1920H0Z M${540 - r} 900 a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0Z"/>
      <circle cx="540" cy="900" r="${r}" fill="none" stroke="${G}" stroke-width="6" style="filter:drop-shadow(0 0 18px ${G})"/>
      ${mark > 0 ? `<g opacity="${clamp(mark)}"><rect x="480" y="840" width="120" height="120" rx="28" fill="none" stroke="${G}" stroke-width="4"/><text x="540" y="928" text-anchor="middle" font-family="CG" font-style="italic" font-size="70" fill="${G}">GA</text></g>` : ''}</svg>`;
  } else {
    let h = ''; const N = 7;
    for (let j = 0; j < N; j++) { const d = j * .045, q = clamp((p - d) / (1 - (N - 1) * .045));
      const x = q < .5 ? lerp(j % 2 ? 105 : -105, 0, easeIO(q * 2)) : lerp(0, j % 2 ? -105 : 105, easeIO((q - .5) * 2));
      h += `<div style="position:absolute;left:0;width:100%;top:${j * 1920 / N - 2}px;height:${1920 / N + 4}px;background:#050507;transform:translateX(${x}%);border-${j % 2 ? 'left' : 'right'}:6px solid ${j % 3 === 0 ? G : Bl};box-shadow:0 0 40px ${j % 3 === 0 ? 'rgba(214,179,108,.5)' : 'rgba(79,123,255,.45)'}"></div>`; }
    el.innerHTML = h;
  }
}

/* ---------------- MOTOR CINÉTICO (ajuste dele em 26/10, 3ª versão) ----------------
   "tá muito preto": o FUNDO alterna entre preto e vermelho no ritmo (cena: "fundo_cor": [[em, "black"|"red"], ...]), trocando com um círculo que abre.
   Legenda = a FALA INTEIRA, palavra por palavra, gigante no meio (sem faixa). Cada pedaço entra com uma animação diferente.
   Palavras de destaque ("enfase": [...] na cena, e todo número) mudam de cor e ganham brilho. Motion graphics em cima, em vidro. */
const FUNDO = {
  black: 'radial-gradient(ellipse at 50% 42%, #17171B 0%, #060607 62%, #000 100%)',

let BGATUAL = 'black';
function qd(c, ref) { if (typeof ref === 'number') return ref * c.dur;

  const w = (c.palavras || []).find(p => norm(p.w).startsWith(norm(String(ref)))); return w ? w.a - c.t0 : ((c.palavras || []).length ? .5 * c.dur : 0); }

  let j = 0; L.forEach((x, k) => { if (lt >= x[0]) j = k; });

function drawFundo(c, lt, t) {
  const f = corFundo(c, lt); BGATUAL = f.p > .5 ? f.cor : f.ant;
  const r = f.p * 1500, cy = 1080;
  const anel = f.p > 0 && f.p < 1 ? `<div style="position:absolute;left:${540 - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;box-shadow:0 0 0 6px rgba(255,255,255,${.5 * (1 - f.p)}), 0 0 80px 20px rgba(255,255,255,${.25 * (1 - f.p)})"></div>` : '';
  // linhas finas de luz que atravessam devagar (elegância, sem poluir)
  const linhas = [0, 1].map(k => { const y = ((t * 40 + k * 900) % 2200) - 140; return `<div style="position:absolute;left:0;right:0;top:${y}px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.10),transparent)"></div>`; }).join('');

    <div style="position:absolute;inset:0;background:${FUNDO[f.cor] || f.cor};clip-path:circle(${r}px at 540px ${cy}px)"></div>${anel}${linhas}

const GRAO = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 200; const g = cv.getContext('2d'), d = g.createImageData(200, 200); let s = 7;

/* legenda gigante palavra por palavra */
const MEDE = document.createElement('canvas').getContext('2d');
const nrm = x => String(x).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9%$,+]/g, '');
function pedacos(c) {
  if (c._ped) return c._ped;
  const P = (c.palavras || []).map(p => ({ ...p })), out = [];
  for (let i = 0; i < P.length; i++) {   // "R$" gruda no número
    if (P[i].w === 'R$' && P[i + 1]) { P[i + 1] = { ...P[i + 1], w: 'R$ ' + P[i + 1].w, a: P[i].a }; continue; }
    const cur = out[out.length - 1], limpa = P[i].w.replace(/[.,!?:;]+$/, '');
    const fecha = cur && /[.,!?:;]$/.test(cur.ws[cur.ws.length - 1]);
    if (cur && !fecha && cur.ws.length < 2 && cur.txt.replace(/[^\p{L}\d$]/gu, '').length <= 3 && !/\d/.test(cur.txt) && (cur.txt + ' ' + limpa).length <= 14) { cur.ws.push(P[i].w); cur.txt += ' ' + limpa; cur.b = P[i].b; }
    else out.push({ ws: [P[i].w], txt: limpa, a: P[i].a, b: P[i].b });
