<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Motor de vídeos curtos — Gabriel Augusto (v2)</title>
<!--
  MODELO DE VÍDEO CURTO 1080x1920 — narração + legenda palavra por palavra.
  O gerador injeta o roteiro já com tempos: c.t0, c.dur e c.palavras = [{w, a, b}].
  Áreas (seguras para TikTok/Reels):
    120–200  perfil · 280–760 título · 800–1400 boneco/cena · 1450–1600 legenda
  Marcações no título: ~vermelho~  *dourado*  _azul_  #faixa#  (valem para várias palavras)
  Bonecos: pictogramas originais desenhados aqui (SVG), animados por articulações.
-->
<style>
@font-face { font-family: "IT"; font-weight: 400 700; src: url("../../assets/fonts/inter-tight-var.woff2") format("woff2"); }
@font-face { font-family: "CG"; font-style: italic; src: url("../../assets/fonts/cormorant-garamond-italic.woff2") format("woff2"); }
@font-face { font-family: "Anton"; src: url("fontes/anton.woff2") format("woff2"); }
@font-face { font-family: "Marker"; src: url("fontes/permanent-marker.woff2") format("woff2"); }
:root { --gold: #D6B36C; --blue: #4F7BFF; --red: #FF4D5E; --white: #F5F6F8; --gray: #9BA2AE; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
body { font-family: "IT", sans-serif; color: var(--white); -webkit-font-smoothing: antialiased; }
#world { position: absolute; inset: 0; transform-origin: 50% 50%; background: #040405; }
.tex { position: absolute; inset: -60px; background: url("papel-escuro.jpg") center / cover; opacity: .6; }
.grain { position: absolute; inset: 0; opacity: .08; mix-blend-mode: screen; background-size: 256px 256px; }
.vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, transparent 40%, rgba(0,0,0,.8)); }
.glow { position: absolute; width: 1300px; height: 1300px; left: -110px; top: -250px; border-radius: 50%; opacity: .3; mix-blend-mode: screen; }
.spot { position: absolute; left: 50%; top: 1400px; width: 900px; height: 260px; margin-left: -450px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.10), transparent); }
.layer { position: absolute; inset: 0; }
#dust i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; }
.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.progress { position: absolute; left: 70px; right: 70px; top: 92px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--gold)); transform-origin: 0 50%; }
.handle { position: absolute; top: 126px; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 600; color: var(--gold); letter-spacing: .02em; }

.txt { position: absolute; left: 50px; right: 50px; top: 290px; text-align: center; font-family: "Anton", sans-serif; text-transform: uppercase; line-height: 1.07; letter-spacing: .01em; text-shadow: 0 10px 34px rgba(0,0,0,.75); }
.txt .ln { display: table; margin: 0 auto; }
.w { display: inline-block; margin: 0 .1em; transform-origin: 50% 80%; }
.w.gold, .w.red, .w.blue { font-family: "Marker", "Anton", sans-serif; font-size: 1.16em; letter-spacing: 0; }
.w.gold { color: var(--gold); } .w.red { color: var(--red); } .w.blue { color: var(--blue); }
.w.box { background: var(--white); color: #07080A; padding: 0 .2em; margin: .05em; text-shadow: none; }
.hl { position: relative; }
.hl::after { content: ""; position: absolute; left: -2px; right: -2px; bottom: .05em; height: .07em; border-radius: 4px; background: currentColor; transform-origin: 0 50%; transform: scaleX(var(--u, 0)); }
.w.red.hl::after { display: none; }

.subs { position: absolute; left: 50px; right: 50px; top: 1460px; text-align: center; font-family: "Anton", sans-serif; text-transform: uppercase; font-size: 68px; line-height: 1.12; }
.subs span { display: inline-block; margin: 0 .11em; color: var(--white); text-shadow: 0 5px 0 #000, 0 0 26px rgba(0,0,0,.95); }
.subs span.on { color: var(--gold); }
.subs span.next { color: rgba(245,246,248,.55); }

.label { position: absolute; transform: translateX(-50%); font-family: "CG", serif; font-style: italic; font-size: 62px; white-space: nowrap; text-shadow: 0 4px 20px #000; }
svg { overflow: visible; }
</style>
</head>
<body>
<div id="world">
  <div class="tex" id="tex"></div>
  <div class="grain" id="grain"></div>
  <div class="glow" id="glow"></div>
  <div class="spot"></div>
  <div class="layer" id="dust"></div>
  <div class="vig"></div>
  <div class="layer" id="props"></div>
  <svg class="layer" id="stick" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
  <div class="layer" id="labels"></div>
  <div class="txt" id="txt"></div>
</div>
<div class="subs" id="subs"></div>
<div class="progress"><i id="prog"></i></div>
<div class="handle" id="handle"></div>
<div class="flash" id="flash"></div>

<script>
const R = __ROTEIRO__;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const C = { gold: '#D6B36C', blue: '#4F7BFF', red: '#FF4D5E', white: '#F5F6F8', gray: '#9BA2AE' };
$('handle').textContent = R.perfil || '';

// Granulado e poeira (estáticos, sementes fixas → quadros determinísticos)
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
(() => { const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d'); const d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = rnd() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); $('grain').style.backgroundImage = `url(${cv.toDataURL()})`; })();
const DUST = Array.from({ length: 26 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, s: .4 + rnd() * .9, v: 12 + rnd() * 30, o: .08 + rnd() * .25 }));
$('dust').innerHTML = DUST.map(() => '<i></i>').join('');

/* ---------------- Título cinético ---------------- */
function buildText(c) {
  const box = $('txt'); box.innerHTML = ''; box.style.fontSize = (c.tamanho || 132) + 'px'; c._words = [];
  const CLS = { '*': 'gold', '~': 'red', '_': 'blue', '#': 'box' };
  (c.texto || []).forEach(line => {
    const ln = document.createElement('span'); ln.className = 'ln'; let open = null;
    line.split(' ').forEach(tok => {
      const w = document.createElement('span'); w.className = 'w'; let t = tok, mk = open;
      if (!open && CLS[t[0]]) { mk = t[0]; t = t.slice(1); open = mk; }
      const end = mk && t.match(new RegExp('\\' + mk + '([.,!?…:]*)$'));
      if (end) { t = t.slice(0, end.index) + end[1]; open = null; }
      if (mk) { w.classList.add(CLS[mk]); if (mk !== '#') w.classList.add('hl'); }
      w.textContent = t; ln.appendChild(w); c._words.push(w);
    });
    box.appendChild(ln);
  });
  let fs = parseFloat(box.style.fontSize);
  for (let k = 0; k < 25 && [...box.children].some(l => l.getBoundingClientRect().width > 970); k++) { fs *= .94; box.style.fontSize = fs + 'px'; }
}

/* ---------------- Legenda (karaokê) ---------------- */
function renderSubs(c, t) {
  const box = $('subs'); const P = c.palavras || [];
  if (!P.length) { box.innerHTML = ''; return; }
  const chunks = []; let cur = [];
  P.forEach((p, i) => { cur.push(i); if (cur.length >= 4 || /[.,!?:]$/.test(p.w)) { chunks.push(cur); cur = []; } });
  if (cur.length) chunks.push(cur);
  let idx = P.findIndex(p => t >= p.a && t < p.b);
  if (idx < 0) { if (t < P[0].a) { box.innerHTML = ''; box.dataset.h = ''; return; } idx = P.length - 1; }
  const ch = chunks.find(k => k.includes(idx));
  const html = ch.map(i => `<span class="${i === idx ? 'on' : i > idx ? 'next' : ''}">${P[i].w}</span>`).join('');
  if (box.dataset.h !== html) { box.innerHTML = html; box.dataset.h = html; }
  const k = back((t - P[ch[0]].a) / .16);
  box.style.transform = `translateY(${(1 - k) * 24}px) scale(${.9 + .1 * k})`; box.style.opacity = clamp(k * 2);
}

/* ---------------- Bonecos pictograma (originais) ---------------- */
// Ângulos em graus: 0 = para baixo, positivo gira para a direita da tela.
// a = braço da esquerda da tela, b = braço da direita; [ombro, cotovelo]. p/q = pernas [quadril, joelho].
const POSES = {
  parado:      { h: 0,  t: 0,  a: [10, 4],    b: [-10, -4],   p: [6, 0],   q: [-6, 0] },
  socando:     { h: -4, t: 6,  a: [-30, 130], b: [92, 0],     p: [24, 0],  q: [-26, 14] },
  andando:     { h: -2, t: 5,  a: [22, 12],   b: [-26, -8],   p: [22, -4], q: [-20, 24] },
  pensando:    { h: 8,  t: 2,  a: [4, 4],     b: [26, -172],  p: [5, 0],   q: [-7, 0] },
  acenando:    { h: -4, t: -2, a: [8, 4],     b: [138, 26],   p: [6, 0],   q: [-6, 0] },
  dancando:    { h: -8, t: -6, a: [-100, 40], b: [150, 14],   p: [14, 0],  q: [-40, 70] },
  comemorando: { h: -10, t: 0, a: [-148, -6], b: [148, 6],    p: [16, 0],  q: [-16, 0] },
  triste:      { h: 36, t: 12, a: [2, 8],     b: [-6, 10],    p: [4, 10],  q: [-8, 12] },
  chocado:     { h: -6, t: -6, a: [-146, -82], b: [146, 82],  p: [14, 0],  q: [-14, 0] },
  celular:     { h: 28, t: 6,  a: [18, 104],  b: [-22, -100], p: [5, 0],   q: [-7, 0] },
  confiante:   { h: -6, t: 0,  a: [34, 112],  b: [-34, -112], p: [12, 0],  q: [-12, 0] },
  apontando:   { h: -6, t: -3, a: [10, 4],    b: [96, -4],    p: [10, 0],  q: [-10, 0] },
  ideia:       { h: -10, t: -2, a: [10, 4],   b: [168, 6],    p: [6, 0],   q: [-6, 0] },      // dedo para cima
  cintura:     { h: -6, t: 0,  a: [-40, 100], b: [40, -100],  p: [14, 0],  q: [-14, 0] },    // mãos na cintura
  sentado:     { h: 30, t: -20, a: [-20, 10], b: [30, -40],   p: [-80, 10], q: [-70, 20] },   // sentado no chão, derrotado
  empurrando:  { h: 10, t: 24, a: [70, 40],   b: [96, 20],    p: [-10, -8], q: [-40, 30] },
};
function mixPose(A, B, k) { const o = {}; for (const key in A) o[key] = Array.isArray(A[key]) ? A[key].map((v, i) => lerp(v, B[key][i], k)) : lerp(A[key], B[key], k); return o; }
function limb(x, y, a1, a2, l1, l2) {
  const r1 = a1 * Math.PI / 180, r2 = (a1 + a2) * Math.PI / 180;
  const x1 = x + Math.sin(r1) * l1, y1 = y + Math.cos(r1) * l1;
  return { d: `M${x} ${y} L${x1} ${y1} L${x1 + Math.sin(r2) * l2} ${y1 + Math.cos(r2) * l2}`, x2: x1 + Math.sin(r2) * l2, y2: y1 + Math.cos(r2) * l2 };
}
function figure(s, lt, t) {
  const S = s.escala || 1, base = s.y ?? 1400;
  // entrada: pode chegar andando pela lateral
  let cx = s.x ?? 540, walkK = 0;
  if (s.entrada === 'andando') { const k = ease(lt / .9); cx = lerp(s.x < 540 ? -200 : 1280, s.x ?? 540, k); walkK = 1 - clamp((lt - .75) / .25); }
  const inK = s.entrada === 'andando' ? 1 : back(lt / .38);
  let P = mixPose(POSES.parado, POSES[s.pose] || POSES.parado, ease((lt - (s.entrada === 'andando' ? .8 : 0)) / .3));
  if (walkK > 0) { const ph = Math.sin(lt * 14); P = mixPose(P, { ...POSES.andando, a: [22 * ph, 10], b: [-22 * ph, -10], p: [22 * ph, -4 + Math.max(0, -ph) * 30], q: [-22 * ph, -4 + Math.max(0, ph) * 30] }, walkK); }
  const osc = Math.sin(t * 6);
  if (s.pose === 'acenando') P.b = [P.b[0], P.b[1] + osc * 22];
  if (s.pose === 'comemorando' || s.pose === 'dancando') { P.a[0] += osc * 8; P.b[0] -= osc * 8; }
  if (s.pose === 'socando') { const hit = Math.max(0, Math.sin(t * 7)); P.b = [P.b[0], P.b[1]]; cx += hit * 10 * S; }
  if (s.pose === 'triste') P.h += Math.sin(t * 2.5) * 2;
  const hop = (s.pose === 'comemorando' || s.pose === 'dancando') ? Math.abs(Math.sin(t * 5)) * 30 * S : 0;
  const shake = s.pose === 'chocado' ? Math.sin(t * 60) * 3 * S : 0;
  const L = 108 * S, W = 44 * S, HR = 58 * S, gap = 10 * S;
  const hipY = base - 2 * L - hop, tr = P.t * Math.PI / 180;
  const nx = cx + Math.sin(tr) * 1.42 * L + shake, ny = hipY - Math.cos(tr) * 1.42 * L + Math.sin(t * 3) * 2 * S;
  const hr = (P.t + P.h) * Math.PI / 180;
  const hx = nx + Math.sin(hr) * (HR + gap + W * .2), hy = ny - Math.cos(hr) * (HR + gap + W * .2);
  const sh = ny + W * .35;
  const A = limb(nx - W * .25, sh, P.a[0], P.a[1], .9 * L, .82 * L);
  const B = limb(nx + W * .25, sh, P.b[0], P.b[1], .9 * L, .82 * L);
  const Lp = limb(cx - W * .28, hipY, P.p[0], P.p[1], L, L);
  const Lq = limb(cx + W * .28, hipY, P.q[0], P.q[1], L, L);
  const col = C[s.cor] || C.white;
  let extra = '';
  if (s.pose === 'celular') { const px = (A.x2 + B.x2) / 2, py = (A.y2 + B.y2) / 2 - 14 * S;
    extra = `<rect x="${px - 36 * S}" y="${py - 62 * S}" width="${72 * S}" height="${124 * S}" rx="${14 * S}" fill="#0B0D11" stroke="${C.blue}" stroke-width="${7 * S}"/><rect x="${px - 26 * S}" y="${py - 50 * S}" width="${52 * S}" height="${92 * S}" rx="${6 * S}" fill="${C.blue}" opacity="${.35 + .2 * Math.sin(t * 4)}"/>`; }
  if (s.pose === 'socando') { const hk = Math.max(0, Math.sin(t * 7)); if (hk > .6) extra += [0, 1, 2].map(i => `<path d="M${B.x2 + 40 * S} ${B.y2 + (i - 1) * 34 * S} l${50 * S} ${(i - 1) * 16 * S}" stroke="${C.gold}" stroke-width="${8 * S}" stroke-linecap="round" opacity="${(hk - .6) * 2.5}"/>`).join(''); }
  let emo = ''; const ek = back((lt - .35) / .4);
  if (s.emocao === 'chuva') { let d = ''; for (let i = 0; i < 7; i++) { const dy = (t * 420 + i * 47) % 150;
      d += `<line x1="${hx - 80 * S + i * 27 * S}" y1="${hy - 140 * S + dy}" x2="${hx - 86 * S + i * 27 * S}" y2="${hy - 118 * S + dy}" stroke="${C.blue}" stroke-width="${7 * S}" stroke-linecap="round" opacity="${1 - dy / 150}"/>`; }
    emo = `<g opacity="${clamp(ek)}"><path d="M${hx - 118 * S} ${hy - 160 * S} a50 50 0 0 1 64 -58 a66 66 0 0 1 122 12 a44 44 0 0 1 22 82 Z" fill="#3A404C"/>${d}</g>`; }
  if (s.emocao === 'exclamacao') emo = `<text x="${hx + 84 * S}" y="${hy - 30 * S}" font-family="Anton" font-size="${150 * S * clamp(ek, 0, 1.2)}" fill="${C.red}">!</text><text x="${hx - 150 * S}" y="${hy - 50 * S}" font-family="Anton" font-size="${110 * S * clamp(ek, 0, 1.2)}" fill="${C.red}" transform="rotate(-14 ${hx - 130 * S} ${hy - 90 * S})">!</text>`;
  if (s.emocao === 'interrogacao') emo = `<text x="${hx + 84 * S}" y="${hy - 44 * S}" font-family="Anton" font-size="${150 * S * clamp(ek, 0, 1.2)}" fill="${C.gold}" transform="rotate(${osc * 8} ${hx + 100 * S} ${hy - 90 * S})">?</text>`;
  if (s.emocao === 'lampada') { const on = lt > .5 ? 1 : 0, g = .5 + .5 * Math.sin(t * 6), x = B.x2, y = B.y2 - 70 * S;
    emo = `<g transform="translate(${x} ${y}) scale(${S * clamp(ek)})"><circle r="${60 + 12 * g}" fill="${C.gold}" opacity="${on * .18}"/><path d="M-30 10 a36 36 0 1 1 60 0 q-10 12 -10 26 h-40 q0 -14 -10 -26Z" fill="${on ? C.gold : '#555'}"/><rect x="-18" y="42" width="36" height="14" rx="4" fill="#9BA2AE"/>${[0, 1, 2, 3, 4].map(i => { const a = (-150 + i * 30) * Math.PI / 180; return `<line x1="${Math.cos(a) * 58}" y1="${Math.sin(a) * 58 - 10}" x2="${Math.cos(a) * 80}" y2="${Math.sin(a) * 80 - 10}" stroke="${C.gold}" stroke-width="7" stroke-linecap="round" opacity="${on}"/>`; }).join('')}</g>`; }
  if (s.emocao === 'brilho') [[-128, -100], [128, -130], [160, 20], [-160, 10]].forEach(([dx, dy], i) => { const k = (Math.sin(t * 8 + i * 1.7) + 1) / 2, r = (15 + k * 16) * S * clamp(ek), x = hx + dx * S, y = hy + dy * S;
      emo += `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r}Z" fill="${C.gold}"/>`; });
  const bodyW = W * 1.25;
  return `<g transform="translate(${cx} ${base}) scale(${inK}) translate(${-cx} ${-base})">
    <ellipse cx="${cx}" cy="${base + 6 * S}" rx="${105 * S}" ry="${13 * S}" fill="rgba(0,0,0,.7)"/>
    <g stroke="${col}" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#sombra)">
      <path d="${Lp.d}" stroke-width="${W}"/><path d="${Lq.d}" stroke-width="${W}"/>
      <path d="M${cx} ${hipY - W * .1} L${nx} ${ny + W * .45}" stroke-width="${bodyW}"/>
      <path d="${A.d}" stroke-width="${W * .92}"/><path d="${B.d}" stroke-width="${W * .92}"/>
      <circle cx="${hx}" cy="${hy}" r="${HR}" fill="${col}" stroke="none"/>
    </g>${extra}${emo}</g>`;
}
function drawFigures(c, lt, t) {
  const list = !c.boneco ? [] : Array.isArray(c.boneco) ? c.boneco : [c.boneco];
  $('stick').innerHTML = `<defs><filter id="sombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".7"/></filter></defs>` +
    list.map((s, n) => figure(s, Math.max(0, lt - n * .15), t + n * .9)).join('');
  $('labels').innerHTML = list.filter(s => s.rotulo).map(s => { const k = ease((lt - .2) / .35);
    return `<div class="label" style="left:${s.x ?? 540}px;top:${(s.y ?? 1400) - 610 * (s.escala || 1) - 70}px;color:${C[s.corRotulo] || C.white};opacity:${k};transform:translateX(-50%) translateY(${(1 - k) * 16}px)">${s.rotulo}</div>`; }).join('');
}

/* ---------------- Ilustrações ---------------- */
function prop(c, lt, t) {
  const p = c.prop; if (!p) return '';
  const k = back(lt / .45), f = ease(lt / .3), at = (x, y, h) => `<div style="position:absolute;left:${x}px;top:${y}px">${h}</div>`;
  const card = 'background:rgba(14,17,22,.92);border:3px solid rgba(255,255,255,.1);border-radius:30px;';
  if (p.tipo === 'conta_off') { const crack = ease((lt - 1) / .35);
    return at(590, 820, `<div style="width:330px;height:560px;border-radius:52px;border:6px solid rgba(255,255,255,.2);background:#0B0D11;transform:rotate(${7 + Math.sin(t * 40) * 3 * clamp(1 - (lt - 1) / .4)}deg) scale(${k});position:relative;overflow:hidden;box-shadow:0 40px 90px -20px #000">
      <div style="position:absolute;top:66px;left:0;right:0;text-align:center;font-size:28px;color:${C.gray};font-weight:600">@seu.perfil</div>
      <div style="position:absolute;top:160px;left:50%;width:140px;height:140px;margin-left:-70px;border-radius:50%;background:${C.red};display:grid;place-items:center;font-family:Anton;font-size:90px;transform:scale(${back((lt - .6) / .35)})">!</div>
      <div style="position:absolute;top:340px;left:16px;right:16px;text-align:center;font-family:Anton;font-size:48px;line-height:1.1;text-transform:uppercase;color:${C.red};opacity:${ease((lt - .7) / .3)}">Conta<br>desativada</div>
      <svg style="position:absolute;inset:0" viewBox="0 0 330 560"><path d="M40 0 L120 150 L90 230 L170 330 L140 420 L220 560" stroke="#fff" stroke-width="4" fill="none" stroke-dasharray="900" stroke-dashoffset="${900 - 900 * crack}" opacity=".85"/></svg></div>`); }
  if (p.tipo === 'alugado') { const sign = back((lt - .8) / .4);
    return at(170, 800, `<div style="position:relative;width:740px;height:600px;opacity:${f}">
      <div style="position:absolute;left:110px;right:110px;bottom:40px;height:92px;border-radius:24px;background:#12151B;border:3px solid rgba(255,255,255,.14);display:grid;place-items:center;font-family:Anton;font-size:46px;letter-spacing:.08em;color:${C.gray}">INSTAGRAM</div>
      <svg style="position:absolute;left:190px;bottom:132px;transform:scale(${k});transform-origin:50% 100%" width="360" height="320" viewBox="0 0 360 320"><path d="M30 150 L180 30 L330 150 V320 H30 Z" fill="#F5F6F8"/><rect x="145" y="210" width="70" height="110" rx="8" fill="#07080A"/><rect x="60" y="180" width="60" height="60" rx="6" fill="#07080A"/><rect x="240" y="180" width="60" height="60" rx="6" fill="#07080A"/></svg>
      <div style="position:absolute;right:10px;top:50px;transform:rotate(${-8 + Math.sin(t * 4) * 3}deg) scale(${sign});transform-origin:50% 100%">
        <div style="padding:14px 34px;background:${C.gold};color:#07080A;font-family:Anton;font-size:66px;text-transform:uppercase;box-shadow:0 20px 40px -10px #000">Alugado</div>
        <div style="width:12px;height:190px;margin:0 auto;background:#8A6B3A"></div></div></div>`); }
  if (p.tipo === 'grafico') { const d = ease((lt - .2) / 1.8);
    const pts = [[0, 60], [80, 36], [160, 70], [240, 48], [300, 120], [360, 200], [430, 260], [500, 330]];
    const n = Math.max(2, Math.ceil(d * pts.length)), path = pts.slice(0, n).map((q, i) => (i ? 'L' : 'M') + q[0] + ' ' + q[1]).join(' '), last = pts[n - 1];
    return at(470, 850, `<div style="${card}width:560px;height:470px;padding:40px;opacity:${f};transform:scale(${.9 + .1 * k})">
      <div style="font-size:30px;color:${C.gray};font-weight:600">Alcance</div>
      <svg width="500" height="360" viewBox="-10 0 520 360" style="margin-top:10px"><path d="${path}" stroke="${C.red}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="14" fill="${C.red}"/></svg></div>`); }
  if (p.tipo === 'busca') { const q = p.consulta, n = Math.floor(clamp((lt - .1) / 1.2) * q.length);
    const res = [['Perfil sem site', C.red, '✕'], ['Sem avaliações', C.red, '✕'], ['Site profissional', C.gold, '✓']];
    return at(100, 840, `<div style="width:880px;opacity:${f}">
      <div style="height:116px;border-radius:60px;border:4px solid rgba(255,255,255,.16);background:#111419;display:flex;align-items:center;padding:0 42px;font-size:42px;gap:20px"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="${C.gold}" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>${q.slice(0, n)}<span style="width:4px;height:46px;background:${C.gold};opacity:${Math.floor(t * 3) % 2}"></span></div>
      ${res.map((x, i) => { const kk = ease((lt - 1.5 - i * .4) / .35); return `<div style="margin-top:22px;padding:28px 36px;${card}display:flex;justify-content:space-between;font-size:40px;font-weight:600;opacity:${kk};transform:translateX(${(1 - kk) * -60}px);${i === 2 ? `border-color:${C.gold};box-shadow:0 0 50px -10px ${C.gold}` : ''}"><span style="color:${i === 2 ? C.white : C.gray}">${x[0]}</span><b style="color:${x[1]}">${x[2]}</b></div>`; }).join('')}</div>`); }
  if (p.tipo === 'enquete') {
    const btn = (txt, col, x, i) => { const kk = back((lt - .3 - i * .2) / .4), pulse = 1 + .05 * Math.sin(t * 8 + i * 3);
      return `<div style="position:absolute;left:${x}px;top:0;width:290px;height:170px;border-radius:40px;background:${col};color:#07080A;display:grid;place-items:center;font-family:Anton;font-size:96px;transform:scale(${kk * pulse});box-shadow:0 20px 60px -10px ${col}">${txt}</div>`; };
    return at(430, 880, `<div style="position:relative;width:620px;height:520px">${btn('SIM', C.gold, 0, 0)}${btn('NÃO', C.red, 320, 1)}
      <div style="position:absolute;left:20px;top:250px;width:580px;padding:28px 34px;${card}display:flex;gap:22px;align-items:center;font-size:38px;font-weight:600;opacity:${ease((lt - .9) / .4)}">
        <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="${C.white}" stroke-width="2" stroke-linejoin="round"><path d="M4 18.5V6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H8L4 20.5Z"/></svg>
        <span>Comenta <b style="color:${C.gold}">SIM</b> ou <b style="color:${C.red}">NÃO</b></span></div></div>`); }
  if (p.tipo === 'cta') { const pulse = 1 + .035 * Math.sin(t * 7);
    return at(90, p.y || 860, `<div style="width:900px;text-align:center;opacity:${f}">
      <div style="display:inline-block;padding:24px 64px;background:${C.gold};color:#07080A;font-family:Anton;text-transform:uppercase;font-size:104px;transform:scale(${k * pulse}) rotate(-2deg);box-shadow:0 0 110px rgba(214,179,108,.5)">${p.botao}</div>
      <div style="margin-top:60px;font-family:Anton;text-transform:uppercase;font-size:54px;color:${C.white};opacity:${ease((lt - .5) / .4)}">${p.sub || ''}</div></div>`); }
  return '';
}

/* ---------------- Quadro ---------------- */
let current = -1;
function render(t) {
  let i = R.cenas.findIndex(c => t >= c.t0 && t < c.t0 + c.dur); if (i < 0) i = R.cenas.length - 1;
  const c = R.cenas[i], lt = t - c.t0;
  if (i !== current) { buildText(c); current = i; }
  $('prog').style.transform = `scaleX(${clamp(t / R.total)})`;
  const acc = C[c.acento] || C.blue;
  $('glow').style.background = `radial-gradient(closest-side, ${acc}70, transparent 70%)`;
  $('glow').style.transform = `translate(${Math.sin(t * .7) * 70}px, ${Math.cos(t * .5) * 50}px)`;
  $('tex').style.transform = `translate(${Math.sin(t * .2) * 24}px, ${Math.cos(t * .17) * 24}px)`;
  $('grain').style.backgroundPosition = `${(t * 997) % 256}px ${(t * 613) % 256}px`;
  [...$('dust').children].forEach((el, j) => { const d = DUST[j]; const y = (d.y - t * d.v + 1920) % 1920;
    el.style.transform = `translate(${d.x + Math.sin(t * .5 + j) * 20}px, ${y}px) scale(${d.s})`; el.style.opacity = d.o; });
  c._words.forEach((w, j) => { const k = back((lt - .05 - j * .08) / .3);
    w.style.opacity = clamp(k * 1.4); w.style.transform = `translateY(${(1 - k) * 60}px) scale(${.55 + .45 * k}) rotate(${(1 - k) * (j % 2 ? 7 : -7)}deg)`;
    w.style.setProperty('--u', ease((lt - .45 - j * .08) / .3)); });
  // transição: saída com zoom + desfoque, entrada com zoom de volta
  const out = ease((lt - (c.dur - .18)) / .18), inn = 1 - ease(lt / .22);
  $('txt').style.opacity = 1 - out;
  let sx = 0, sy = 0, sc = 1 + .02 * lt / c.dur + out * .12 + inn * .08;
  if (c.fx === 'tremer' && lt < .5) { const a = (1 - lt / .5) * 16; sx = Math.sin(t * 90) * a; sy = Math.cos(t * 70) * a; }
  $('world').style.transform = `translate(${sx}px, ${sy}px) scale(${sc})`;
  $('world').style.filter = (out > .01 || inn > .01) ? `blur(${Math.max(out, inn) * 10}px)` : 'none';
  $('flash').style.opacity = c.fx === 'flash' ? Math.max(0, .45 - lt * 4) : Math.max(0, .1 - lt * 2);
  $('props').innerHTML = prop(c, lt, t);
  drawFigures(c, lt, t);
  renderSubs(c, t);
}
window.render = render; window.R = R;
render(0);
</script>
