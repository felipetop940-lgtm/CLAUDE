<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fontes.css">
<!-- Logo animado (caminho 1, JANELA). render(t) é determinístico: o render.js tira um quadro por 1/30 s. -->
<style>
*{margin:0;box-sizing:border-box} html,body{width:100%;height:100%;background:#07080A;overflow:hidden;font-family:MS;color:#F5F6F8}
#fundo{position:absolute;inset:0}
#palco{position:absolute;left:50%;top:50%;width:1080px;height:1080px;margin:-540px 0 0 -540px}
</style></head><body><div id="fundo"></div><div id="palco"></div>
<script>
window.DUR = 5;
const OU = '#D6B36C', OC = '#F1DDA8', OE = '#9C7A3A', BR = '#F5F6F8';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const easeIO = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const fase = (t, a, d) => (t - a) / d;
window.render = t => {
  const luz = ease(t / .8);
  document.getElementById('fundo').style.background =
    `radial-gradient(900px 700px at 50% 38%, rgba(214,179,108,${.16 * luz}), transparent 65%), radial-gradient(800px 800px at 85% 100%, rgba(79,123,255,${.13 * luz}), transparent 70%), #07080A`;
  const moldura = easeIO(fase(t, .15, .9)), barra = ease(fase(t, .75, .4));
  const dot = i => back(fase(t, 1.0 + i * .12, .35));
  const gG = ease(fase(t, 1.25, .55)), gA = ease(fase(t, 1.42, .55));
  const cur = easeIO(fase(t, 1.75, .5)), clique = t >= 2.3 ? 1 : 0, cs = t < 2.25 ? 1 : 1 - .16 * Math.sin(clamp(fase(t, 2.25, .18)) * Math.PI);
  const onda = fase(t, 2.3, .7), brilhoA = t > 2.3 ? Math.max(0, 1 - fase(t, 2.3, .8)) : 0;
  const nome = easeIO(fase(t, 2.55, .65)), sub = ease(fase(t, 2.95, .6)), traco = easeIO(fase(t, 3.0, .7));
  const varre = fase(t, 3.55, .9), resp = t > 3.6 ? 1 + .012 * Math.sin((t - 3.6) * 2.4) : 1;
  const cx = 168 + (1 - cur) * 120, cy = 150 + (1 - cur) * 110;
  const svg = `<svg width="440" height="440" viewBox="0 0 240 240" style="overflow:visible"><defs>
      <linearGradient id="go" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${OC}"/><stop offset=".55" stop-color="${OU}"/><stop offset="1" stop-color="${OE}"/></linearGradient>
      <linearGradient id="lv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <clipPath id="cj"><rect x="12" y="12" width="216" height="216" rx="50"/></clipPath>
      <filter id="bl"><feGaussianBlur stdDeviation="${(1 - gG) * 6}"/></filter><filter id="bl2"><feGaussianBlur stdDeviation="${(1 - gA) * 6}"/></filter></defs>
    <rect x="12" y="12" width="216" height="216" rx="50" fill="#0B0D12" fill-opacity="${moldura}"/>
    <rect x="12" y="12" width="216" height="216" rx="50" fill="none" stroke="${BR}" stroke-width="8" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - moldura}" transform="rotate(0)"/>
    <line x1="12" y1="66" x2="${12 + 216 * barra}" y2="66" stroke="${BR}" stroke-width="8"/>
    <circle cx="50" cy="40" r="${8 * dot(0)}" fill="${BR}" opacity=".45"/><circle cx="76" cy="40" r="${8 * dot(1)}" fill="${BR}" opacity=".45"/>
    <circle cx="102" cy="40" r="${8 * dot(2)}" fill="url(#go)" style="filter:drop-shadow(0 0 ${6 * dot(2)}px ${OU})"/>
    <g clip-path="url(#cj)"><text x="118" y="182" text-anchor="middle" font-family="MS" font-weight="800" font-size="104" letter-spacing="-5">
      <tspan fill="${BR}" opacity="${gG}" filter="url(#bl)" dy="${(1 - gG) * 30}">G</tspan><tspan fill="url(#go)" opacity="${gA}" filter="url(#bl2)" dy="${(1 - gA) * 30 - (1 - gG) * 30}" style="filter:drop-shadow(0 0 ${14 * brilhoA}px ${OU})">A</tspan></text>
      ${varre > 0 && varre < 1 ? `<rect x="${-120 + 480 * easeIO(varre)}" y="0" width="70" height="240" fill="url(#lv)" transform="skewX(-18)"/>` : ''}</g>
    ${onda > 0 && onda < 1 ? `<circle cx="172" cy="156" r="${10 + 60 * ease(onda)}" fill="none" stroke="${OU}" stroke-width="${3 * (1 - onda)}" opacity="${1 - onda}"/>` : ''}
    <g transform="translate(${cx - 168} ${cy - 150}) translate(168 150) scale(${cs}) translate(-168 -150)" opacity="${clamp(cur * 1.5)}">
      <path d="M168 150 L168 204 L181 192 L190 213 L200 209 L191 188 L208 188 Z" fill="${BR}" stroke="#0B0D12" stroke-width="5" stroke-linejoin="round"/></g></svg>`;
  document.getElementById('palco').innerHTML = `
    <div style="position:absolute;left:0;right:0;top:150px;display:flex;justify-content:center;transform:scale(${resp})">${svg}</div>
    <div style="position:absolute;left:0;right:0;top:650px;text-align:center;font-weight:800;font-size:104px;letter-spacing:-.02em;line-height:1;
      clip-path:inset(0 ${50 * (1 - nome)}% 0 ${50 * (1 - nome)}%);opacity:${clamp(nome * 2)};transform:translateY(${(1 - nome) * 18}px)">Gabriel Augusto</div>
    <div style="position:absolute;left:50%;top:790px;height:3px;width:${560 * traco}px;margin-left:${-280 * traco}px;background:linear-gradient(90deg,transparent,${OU},transparent)"></div>
    <div style="position:absolute;left:0;right:0;top:826px;text-align:center;font-weight:700;font-size:34px;letter-spacing:${.62 - .22 * sub}em;color:${OU};opacity:${sub}">SITES PROFISSIONAIS</div>`;
};
render(0);
</script></body></html>
